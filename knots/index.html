<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Knots Made Easy</title>
    <meta
      name="description"
      content="See how knots are tied, step by step, with a physically simulated rope."
    />
    <script type="module" crossorigin src="./assets/index-B_n1JVhF.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-CCPwzkJk.css">
  </head>
  <body>
    <canvas
      id="scene"
      aria-label="3D view of the rope. Drag to turn it, scroll or pinch to zoom."
    ></canvas>

    <header class="top">
      <button id="pick" class="chip" type="button" aria-haspopup="dialog">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M4 6h16M4 12h16M4 18h10" />
        </svg>
        All knots
      </button>
      <a
        class="icon-link"
        href="https://github.com/behnamazimi/knots-made-easy"
        target="_blank"
        rel="noopener"
        aria-label="View source on GitHub"
      >
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path
            d="M12 2a10 10 0 0 0-3.16 19.49c.5.09.68-.22.68-.48v-1.7c-2.78.6-3.37-1.34-3.37-1.34-.45-1.16-1.11-1.47-1.11-1.47-.91-.62.07-.61.07-.61 1-.07 1.53 1.03 1.53 1.03.89 1.52 2.34 1.08 2.91.83.09-.65.35-1.08.63-1.33-2.22-.25-4.55-1.11-4.55-4.94 0-1.09.39-1.98 1.03-2.68-.1-.25-.45-1.27.1-2.64 0 0 .84-.27 2.75 1.02a9.5 9.5 0 0 1 5 0c1.91-1.29 2.75-1.02 2.75-1.02.55 1.37.2 2.39.1 2.64.64.7 1.03 1.59 1.03 2.68 0 3.84-2.34 4.68-4.57 4.93.36.31.68.92.68 1.85v2.74c0 .27.18.58.69.48A10 10 0 0 0 12 2z"
          />
        </svg>
      </a>
    </header>

    <section class="intro">
      <p class="eyebrow">Knots made easy</p>
      <h1 id="knot-name"></h1>
      <p id="knot-summary"></p>
    </section>

    <section class="player" aria-label="Playback">
      <p class="step">
        <span id="step-num" class="step-num"></span><span id="step-title" aria-live="polite"></span>
      </p>
      <div class="bar">
        <button id="play" class="play" type="button" aria-label="Play">
          <svg class="icon-play" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M8 5.5v13l10.5-6.5z" />
          </svg>
          <svg class="icon-pause" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M7 5h3.5v14H7zM13.5 5H17v14h-3.5z" />
          </svg>
        </button>
        <div class="track">
          <div class="rail">
            <div id="ready" class="ready"></div>
            <div id="played" class="played"></div>
          </div>
          <ol id="ticks" class="ticks"></ol>
          <input id="scrub" type="range" min="0" step="0.01" value="0" aria-label="Timeline" />
        </div>
        <span id="clock" class="clock">0.0s</span>
        <div class="speed" role="radiogroup" aria-label="Speed">
          <label><input type="radio" name="speed" value="0.25" /><span>¼×</span></label>
          <label><input type="radio" name="speed" value="0.5" /><span>½×</span></label>
          <label><input type="radio" name="speed" value="1" checked /><span>1×</span></label>
          <label><input type="radio" name="speed" value="2" /><span>2×</span></label>
        </div>
        <button id="loop" class="loop" type="button" aria-pressed="false" aria-label="Loop">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M7 7h9.5l-2-2M17 17H7.5l2 2M4 12a5 5 0 0 1 3-5M20 12a5 5 0 0 1-3 5" />
          </svg>
        </button>
      </div>
    </section>

    <footer class="credit">
      made by <a href="https://x.com/baz7c8" target="_blank" rel="noopener">@baz7c8</a>
    </footer>

    <dialog id="picker" aria-labelledby="picker-title">
      <div class="sheet">
        <div class="sheet-head">
          <h2 id="picker-title">Pick a knot</h2>
          <button id="close-picker" class="close" type="button" aria-label="Close">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" /></svg>
          </button>
        </div>
        <ul id="knot-list" class="knot-list"></ul>
      </div>
    </dialog>

  </body>
</html>
