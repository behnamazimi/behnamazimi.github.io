hrijf een korte tekst (20-50 woorden). Controleer jezelf met de lijst.","hint":"Write in complete sentences and tick off each requirement.","items":[{"t":"wr","title":"Mijn naam en mijn leeftijd","p":"Stel jezelf voor aan een nieuwe buurman. (Introduce yourself to a new neighbour.)","reqs":["Gebruik **Ik heet ...** of **Mijn naam is ...**","Zeg hoe oud je bent: **Ik ben ... jaar.**","Zeg waar je woont met **Ik woon in ...**","Eindig met een beleefde zin, bijvoorbeeld **Aangenaam!**"],"model":"Hallo, ik heet Sam. Ik ben dertig jaar. Ik kom uit Engeland, maar ik woon nu in Utrecht. Ik ben uw nieuwe buurman. Aangenaam!","min":20,"id":"wf1-1cba09aa"},{"t":"wr","title":"Mijn gezin","p":"Schrijf over je familie. (Write about your family.)","reqs":["Gebruik **Ik heb ...** (een broer, een zus, twee kinderen)","Gebruik minstens twee bezittelijke voornaamwoorden: **mijn**, **zijn**, **haar**","Zeg hoe iemand heet met **heet**","Noem één leeftijd of beroep"],"model":"Ik heb een grote familie. Mijn vader heet Peter en mijn moeder heet Anna. Ik heb een broer en een zus. Mijn broer is twintig jaar en zijn vriendin werkt in een ziekenhuis. Mijn zus woont nog thuis.","min":25,"id":"wf1-1ca54364"},{"t":"wr","title":"Mijn huis","p":"Beschrijf waar je woont. (Describe where you live.)","reqs":["Zeg of je in een huis, een flat of een appartement woont","Noem minstens drie kamers: **de keuken**, **de slaapkamer**, **de woonkamer**, **de badkamer**","Gebruik **er is** of **er zijn**","Gebruik **groot**, **klein**, **gezellig** of een ander adjectief"],"model":"Ik woon in een klein appartement in Rotterdam. Het appartement heeft een woonkamer, een keuken, een badkamer en een slaapkamer. De woonkamer is groot en gezellig. Er is ook een balkon met twee stoelen.","min":25,"id":"wf1-68eb45f2"},{"t":"wr","title":"Mijn werk en mijn hobby's","p":"Vertel wat je doet en wat je graag doet in je vrije tijd. (Tell what you do and what you like doing.)","reqs":["Gebruik **Ik werk als ...** of **Ik studeer ...**","Gebruik **graag** bij een hobby: **Ik lees graag.**","Gebruik **want** of **maar** minstens één keer","Schrijf minstens vier zinnen"],"model":"Ik werk als verpleegkundige in een ziekenhuis. Ik vind mijn werk leuk, maar het is soms druk. In mijn vrije tijd lees ik graag, want dan kan ik rustig zitten. Ik fiets ook elke zondag in het park.","min":25,"id":"wf1-6d460a45"},{"t":"wr","title":"Mijn beste vriendin of vriend","p":"Schrijf over een goede vriend of vriendin. (Write about a good friend.)","reqs":["Zeg hoe hij of zij heet en waar hij of zij woont","Gebruik **hij** of **zij** en **zijn** of **haar** correct","Gebruik **hebben** of **zijn** in een zin (**Hij heeft ...**, **Zij is ...**)","Zeg wat jullie samen doen met **samen**"],"model":"Mijn beste vriendin heet Lotte. Zij woont in Amsterdam en zij is twee jaar ouder dan ik. Haar huis is klein, maar heel mooi. Ze heeft een hond en die heet Bas. In het weekend wandelen we samen met haar hond in het park.","min":30,"id":"wf1-0bc25a1e"}]}]},{"id":"wf2","title":"Schrijven 2: dagelijkse routine, planning, agenda","rule":"Gebruik tijden (**om half acht**, **om kwart over vijf**) en woorden als **eerst**, **daarna**, **later**, **'s avonds**.\nScheidbare werkwoorden: **Ik sta om zeven uur op.** (opstaan), **Ik ruim het huis op.** (opruimen), **Ik bel mijn moeder op.** (opbellen).\nToekomst: **Morgen ga ik naar de markt.** (**gaan** + infinitief aan het einde)","group":"Schrijven","sets":[{"instr":"Schrijf een tekst over je dag of week (30-60 woorden).","hint":"Use the time words and separable verbs from the box.","items":[{"t":"wr","title":"Mijn ochtend","p":"Beschrijf je ochtend van opstaan tot werk of school. (Describe your morning.)","reqs":["Gebruik **om ... uur** met een tijd","Gebruik minstens één scheidbaar werkwoord: **opstaan**, **aankleden**, **opruimen**","Gebruik **eerst** en **daarna**","Begin één zin met **Om ...** en zet het werkwoord daarna (**Om half acht ontbijt ik.**)"],"model":"Ik sta om zeven uur op. Eerst neem ik een douche en daarna kleed ik me aan. Om half acht ontbijt ik met brood en koffie. Om kwart over acht pak ik mijn tas en ga ik met de fiets naar mijn werk.","min":30,"id":"wf2-033c5341"},{"t":"wr","title":"Een gewone werkdag","p":"Schrijf over een normale werkdag of schooldag van begin tot eind. (A normal working or school day.)","reqs":["Noem drie tijden met **om ... uur**","Gebruik **'s middags** of **'s avonds**","Gebruik **na het werk** of **na school**","Gebruik minstens één werkwoord met **eten**, **drinken** of **koken**"],"model":"Ik begin om negen uur op kantoor. 's Middags eet ik een boterham met kaas en ik drink een kop thee. Om vijf uur ga ik naar huis. Na het werk doe ik boodschappen en 's avonds kook ik. Om tien uur ga ik naar bed.","min":30,"id":"wf2-cf5aa67d"},{"t":"wr","title":"Mijn week","p":"Schrijf wat je elke dag van de week doet. (What you do each day of the week.)","reqs":["Gebruik minstens drie dagen: **op maandag**, **op woensdag**, **op zaterdag**","Gebruik **elke** met een dag of tijd: **elke ochtend**, **elke zondag**","Gebruik **naar** + plaats: **naar de les**, **naar de sportschool**","Gebruik **soms**, **vaak** of **nooit**"],"model":"Op maandag werk ik thuis. Op woensdag ga ik naar de Nederlandse les en op vrijdag ga ik naar de sportschool. Elke zondag bel ik mijn ouders op. Ik ga nooit naar bed na middernacht, want ik sta vroeg op.","min":30,"id":"wf2-45a4c8e5"},{"t":"wr","title":"Mijn agenda voor morgen","p":"Schrijf je planning voor morgen. (Your plan for tomorrow.)","reqs":["Gebruik **Morgen ga ik ...** met een infinitief aan het einde","Noem minstens drie afspraken met een tijd","Gebruik **eerst**, **dan** en **daarna**","Gebruik een afspraak met een persoon: **met de tandarts**, **met een vriend**"],"model":"Morgen ga ik eerst naar de tandarts om tien uur. Daarna ga ik naar de supermarkt en dan koop ik brood en fruit. 's Middags spreek ik af met een vriend in een café. We gaan samen koffie drinken. 's Avonds ga ik thuis koken.","min":30,"id":"wf2-cabdf666"},{"t":"wr","title":"Zaterdag plannen","p":"Je maakt een plan voor zaterdag met je vriendin. Schrijf wat jullie gaan doen. (Plan Saturday with your friend.)","reqs":["Gebruik **we gaan** + infinitief minstens twee keer","Noem een tijd en een plaats","Gebruik **als** of **want** voor een reden","Stel een vraag aan het eind: **Wil je ...?**, **Heb je zin om ...?**"],"model":"Zaterdag gaan we eerst naar de markt in het centrum. We vertrekken om tien uur, want het is dan nog rustig. Daarna gaan we lunchen in een klein restaurant. Als het mooi weer is, fietsen we 's middags naar het strand. Heb je zin om mee te gaan?","min":35,"id":"wf2-13d3a92d"}]}]},{"id":"wf3","title":"Schrijven 3: berichten en e-mails","rule":"Informeel (vriend): **Hoi Eva, ... Groetjes, Sam** met **je/jij**. Formeel (onbekende): **Geachte mevrouw De Vries, ... Met vriendelijke groet, S. Jansen** met **u**.\nHandige zinnen: **Kunnen we ... afspreken?**, **Het spijt me, ik kan niet komen.**, **Ik wil graag ...**, **Alvast bedankt.**\nBij **u** hoort **uw** (niet **jouw**): **Heeft u uw sleutel?**","group":"Schrijven","sets":[{"instr":"Schrijf het bericht (25-80 woorden). Let op informeel of formeel.","hint":"Pay attention to je/jij versus u/uw.","items":[{"t":"wr","title":"Een sms aan een vriend","p":"Je komt tien minuten te laat. Stuur een kort sms. (You're ten minutes late: send a short text.)","reqs":["Begin met **Hoi** en de naam","Gebruik **ik ben ... te laat** of **ik kom later**","Noem de reden met **want**","Eindig met **Tot zo!** of **Sorry!**"],"model":"Hoi Eva, ik ben tien minuten te laat, want de bus is laat. Wacht je even op me? Sorry! Tot zo!","min":15,"id":"wf3-d71ddeb3"},{"t":"wr","title":"Een afspraak maken","p":"Schrijf een e-mail aan een vriend om samen te eten. (Email a friend to arrange dinner.)","reqs":["Gebruik **Kunnen we ... afspreken?** of **Heb je tijd op ...?**","Noem een dag, een tijd en een plaats","Gebruik **jij/je** (informeel)","Begin met **Hoi ...** en eindig met **Groetjes ...**"],"model":"Hoi Tom, heb je tijd op vrijdag? Kunnen we samen eten in het restaurant bij het station? Is zeven uur goed voor jou? Ik wil graag weten wat jij lekker vindt. Laat je het even weten? Groetjes, Sam","min":27,"id":"wf3-170f9e07"},{"t":"wr","title":"Een afspraak afzeggen","p":"Je bent ziek. Zeg je afspraak met de tandarts af. (You're ill: cancel your dentist appointment.)","reqs":["Gebruik **Ik kan niet komen** of **Ik moet de afspraak afzeggen**","Noem de reden: **ik ben ziek**","Vraag om een nieuwe afspraak: **Kan ik een nieuwe afspraak maken?**","Gebruik **u** en **uw** en een formele begroeting en afsluiting"],"model":"Geachte mevrouw, ik heb morgen om negen uur een afspraak bij u. Helaas kan ik niet komen, want ik ben ziek. Kan ik een nieuwe afspraak maken voor volgende week? Alvast bedankt. Met vriendelijke groet, Sam Jansen","min":25,"id":"wf3-edeb1c86"},{"t":"wr","title":"Een uitnodiging","p":"Nodig vrienden uit voor je verjaardag. (Invite friends to your birthday.)","reqs":["Noem datum, tijd en adres","Gebruik **Ik nodig je uit voor ...** of **Kom je ook?**","Zeg wat jullie gaan doen met **gaan** + infinitief","Vraag om een antwoord: **Laat je me weten of je komt?**"],"model":"Hoi allemaal, ik word zaterdag 12 mei dertig jaar en ik nodig jullie uit voor mijn verjaardag. Het feest begint om acht uur bij mij thuis. Het adres is Dorpsstraat 12 in Utrecht. We gaan eten, drinken en dansen. Laat je me weten of je komt? Groetjes, Sam","min":35,"id":"wf3-40c89c2b"},{"t":"wr","title":"Een beleefde brief aan u","p":"Schrijf aan de gemeente: je wilt informatie over een parkeervergunning. (Formal letter to the council.)","reqs":["Begin met **Geachte heer/mevrouw,**","Gebruik **u** en **uw** minstens twee keer","Gebruik **Ik wil graag ...** of **Kunt u mij ... sturen?**","Noem je adres en eindig met **Alvast bedankt** en **Met vriendelijke groet**"],"model":"Geachte heer, mevrouw, ik woon sinds kort aan de Kerkstraat 8 in Delft. Ik heb een auto en ik wil graag een parkeervergunning aanvragen. Kunt u mij informatie over uw regels sturen? Moet ik ook een formulier invullen? Ik hoor graag van u. Alvast bedankt. Met vriendelijke groet, Sam Jansen","min":35,"id":"wf3-019c3f9d"}]}]},{"id":"wf4","title":"Schrijven 4: het verleden (gisteren, weekend, vakantie)","rule":"Perfectum: **hebben/zijn** + voltooid deelwoord aan het einde. **Ik heb gewerkt.** **Ik ben naar Parijs gegaan.**\nVoltooid deelwoord: **ge-** + stam + **t/d** (**gewerkt**, **gespeeld**) of **ge-** + **-en** (**gelopen**, **gegeten**, **gezien**). Zonder **ge-** bij **be-, ver-, ont-**: **bezocht**, **vertrokken**.\nBewegen en veranderen: **zijn** (**gegaan**, **gekomen**, **gefietst**). Meestal: **hebben**.","group":"Schrijven","sets":[{"instr":"Schrijf in het perfectum (50-90 woorden).","hint":"Use the perfect tense (hebben/zijn + past participle).","items":[{"t":"wr","title":"Gisteren","p":"Wat heb je gisteren gedaan? (What did you do yesterday?)","reqs":["Gebruik minstens vier perfectum-zinnen","Gebruik **heb** en **ben** minstens één keer elk","Gebruik **gisteren** en een tijdsaanduiding (**'s ochtends**, **'s avonds**)","Het voltooid deelwoord staat aan het einde van de zin"],"model":"Gisteren ben ik om acht uur opgestaan. Ik heb de hele ochtend gewerkt en 's middags heb ik boodschappen gedaan. Daarna ben ik naar mijn zus gegaan en we hebben samen thee gedronken. 's Avonds heb ik pasta gekookt en ik heb een film gekeken.","min":30,"id":"wf4-834b5d8f"},{"t":"wr","title":"Mijn weekend","p":"Vertel over je weekend. (Tell about your weekend.)","reqs":["Gebruik **afgelopen weekend** of **zaterdag** en **zondag**","Gebruik minstens vijf voltooide deelwoorden","Gebruik **zijn** bij **gaan**, **komen** of **fietsen**","Zeg ook of je het leuk vond: **Het was ...**"],"model":"Afgelopen weekend was het gezellig. Zaterdag ben ik met mijn vrienden naar het strand gefietst en we hebben daar gezwommen. 's Avonds hebben we lekker gegeten en veel gelachen. Zondag heb ik lang geslapen en daarna heb ik mijn kamer schoongemaakt. Het was een fijn weekend.","min":30,"id":"wf4-aa795400"},{"t":"wr","title":"Mijn vakantie","p":"Schrijf een kaart of tekst over je laatste vakantie. (About your last holiday.)","reqs":["Zeg waar je bent geweest: **Ik ben in ... geweest**","Gebruik **ik ben ... gegaan** en **ik heb ... gezien**","Gebruik **vorig jaar** of **in de zomer**","Noem het weer, het eten of de mensen"],"model":"Vorig jaar ben ik in de zomer naar Spanje gegaan. Ik ben twee weken in Barcelona geweest met mijn vriendin. We hebben veel mooie gebouwen gezien en we hebben elke dag lekker gegeten. Het weer was warm en de mensen waren heel aardig. Ik heb ook veel foto's gemaakt. Het was een geweldige vakantie.","min":40,"id":"wf4-5a0dfe6b"},{"t":"wr","title":"Een verjaardag","p":"Vertel over een leuk feest of verjaardag. (A birthday or party.)","reqs":["Zeg wie jarig was en wanneer","Gebruik minstens vier perfectum-zinnen","Noem een cadeau: **Ik heb ... gekregen/gegeven**","Gebruik **want** of **omdat** voor een reden"],"model":"Vorige week was mijn moeder jarig. Ze is zestig geworden en we hebben een feestje gegeven. Ik heb een taart gebakken, want zij houdt van chocolade. Mijn broer heeft bloemen gekocht en mijn vader heeft een cadeau gegeven. Iedereen heeft gezongen en gegeten. Mijn moeder was erg blij.","min":35,"id":"wf4-f4e72116"},{"t":"wr","title":"Een slechte dag","p":"Schrijf over een dag waarop veel misging. (A day when things went wrong.)","reqs":["Gebruik **eerst**, **toen**, **daarna** en **ten slotte**","Gebruik minstens vijf voltooide deelwoorden","Gebruik **omdat** met het werkwoord aan het einde","Zeg hoe je je voelde: **Ik was boos/moe/verdrietig**"],"model":"Gisteren was een slechte dag. Eerst ben ik te laat opgestaan, omdat mijn wekker niet heeft gewerkt. Toen heb ik de bus gemist en ben ik naar mijn werk gelopen. Daarna heb ik mijn telefoon verloren en mijn lunch vergeten. Ten slotte heb ik 's avonds in de regen gefietst. Ik was moe en boos, maar ik heb goed geslapen.","min":45,"id":"wf4-1da42740"}]}]},{"id":"wf5","title":"Schrijven 5: beschrijven (stad, buurt, persoon, kamer, weer)","rule":"Gebruik **er is/er zijn**, **het ligt ...**, **naast / tegenover / achter / voor / tussen**.\nAdjectief: **een groot huis** (een + het-woord: **geen -e**), **de grote stad**, **een mooie straat** (-e bij de-woord en bij een).\n**Hij/zij** voor mensen, **het** voor dingen: **Hij heeft donker haar en blauwe ogen.**\nWeer: **Het regent. Het is koud. De zon schijnt. Het waait.**","group":"Schrijven","sets":[{"instr":"Beschrijf (60-100 woorden). Let op de -e bij adjectieven.","hint":"Check the -e on adjectives.","items":[{"t":"wr","title":"Mijn stad","p":"Beschrijf de stad waar je woont. (Describe the city where you live.)","reqs":["Zeg hoeveel mensen er ongeveer wonen of de stad groot of klein is","Gebruik **er is** en **er zijn**","Gebruik minstens drie adjectieven met correcte -e (**een mooie**, **het oude**)","Noem iets om te doen: een museum, een park, een markt"],"model":"Ik woon in Utrecht. Het is een gezellige stad in het midden van Nederland. Er wonen ongeveer driehonderdduizend mensen. In het centrum zijn veel oude gebouwen en mooie grachten. Er is een grote markt en er zijn veel leuke cafés. Ik fiets graag langs het water, want het is er rustig.","min":35,"id":"wf5-87ea2f51"},{"t":"wr","title":"Mijn buurt","p":"Beschrijf je buurt. (Describe your neighbourhood.)","reqs":["Gebruik minstens twee voorzetsels van plaats: **naast**, **tegenover**, **achter**, **bij**","Noem winkels of voorzieningen: **de supermarkt**, **de bakker**, **de bushalte**","Gebruik **er is/er zijn**","Zeg of je de buurt leuk vindt en waarom"],"model":"Mijn buurt is rustig en groen. Tegenover mijn huis is een klein park en naast het park is een basisschool. De supermarkt is twee straten verder en er zijn ook een bakker en een slager. De bushalte is vlak bij mijn huis. Ik vind mijn buurt fijn, want de mensen zijn aardig en het is er schoon.","min":40,"id":"wf5-826b2efb"},{"t":"wr","title":"Een persoon","p":"Beschrijf een persoon die je goed kent. (Describe someone you know well.)","reqs":["Beschrijf hoe hij of zij eruitziet: **Hij heeft ... haar**, **Zij is lang/klein**","Beschrijf het karakter: **aardig**, **grappig**, **rustig**, **druk**","Gebruik **zijn/haar** bij kleding of bezit","Zeg wat hij of zij graag doet"],"model":"Mijn oom Henk is lang en mager. Hij heeft grijs haar en een grote bril. Hij draagt vaak een blauwe trui en een oude spijkerbroek. Hij is heel grappig en aardig, maar soms ook wat druk. Hij houdt van koken en hij maakt elke zondag een heerlijke soep voor de hele familie.","min":35,"id":"wf5-7ae0ae39"},{"t":"wr","title":"Mijn kamer","p":"Beschrijf je slaapkamer of je werkkamer. (Describe your bedroom or study.)","reqs":["Noem minstens vijf meubels of spullen: **het bed**, **de kast**, **het bureau**, **de lamp**","Gebruik plaatsvoorzetsels: **naast**, **onder**, **boven**, **tussen**, **voor**","Gebruik **liggen**, **staan** of **hangen**","Noem een kleur met correcte vorm: **een groene stoel**, **het witte bed**"],"model":"In mijn slaapkamer staat een groot bed bij het raam. Naast het bed staat een kleine kast en daarop staat een lamp. Tegenover het bed staat mijn bureau met een computer. Boven het bureau hangt een grote foto. Op de grond ligt een zacht, groen kleed. Mijn kamer is klein, maar heel gezellig.","min":35,"id":"wf5-8fd5cab9"},{"t":"wr","title":"Het weer","p":"Schrijf over het weer in jouw land of stad door het jaar. (Weather through the year.)","reqs":["Noem minstens twee seizoenen: **de lente**, **de zomer**, **de herfst**, **de winter**","Gebruik **Het is ...** en **Het regent/sneeuwt/waait**","Noem een temperatuur met **graden**","Zeg welk weer je het leukst vindt en wat je dan doet"],"model":"In Nederland is het weer vaak veranderlijk. In de zomer is het meestal warm en soms is het wel twintig tot dertig graden. In de herfst regent en waait het veel. In de winter is het koud en soms sneeuwt het. Ik vind de lente het mooist, want dan schijnt de zon en kan ik buiten fietsen.","min":40,"id":"wf5-4c728eef"}]}]},{"id":"wf6","title":"Schrijven 6: meningen, vergelijken, voorkeuren","rule":"Mening: **Ik vind ... leuk/mooi/lekker.**, **Ik denk dat ...** (werkwoord aan het einde!), **Volgens mij ...**\nVoorkeur: **Ik drink liever thee dan koffie.** **Ik hou het meest van ...**\nVergelijken: **groot - groter dan - het grootst**; **goed - beter - best**; **veel - meer - meest**; **even ... als**: **De trein is sneller dan de bus.**\nReden: **omdat**/**want**.","group":"Schrijven","sets":[{"instr":"Geef je mening of vergelijk (60-110 woorden).","hint":"Use liever / beter / het meest / dan.","items":[{"t":"wr","title":"Wat eet en drink ik graag?","p":"Schrijf over je favoriete eten en drinken. (Your favourite food and drink.)","reqs":["Gebruik **liever ... dan ...** minstens één keer","Gebruik **het lekkerst** of **het liefst**","Geef een reden met **omdat** (werkwoord aan het einde)","Noem minstens drie soorten eten of drinken"],"model":"Ik eet graag pasta, soep en salade. Pasta vind ik het lekkerst, omdat het snel klaar is. Ik drink liever thee dan koffie, want koffie maakt mij nerveus. 's Avonds eet ik liever warm dan koud. Fruit eet ik ook graag, maar snoep vind ik niet zo lekker.","min":35,"id":"wf6-e0e8d09f"},{"t":"wr","title":"Twee steden vergelijken","p":"Vergelijk twee steden die je kent. (Compare two cities.)","reqs":["Gebruik minstens twee vergrotende trappen met **dan**: **groter dan**, **duurder dan**","Gebruik **even ... als** één keer","Gebruik **het mooist** of **het gezelligst** voor een superlatief","Zeg welke stad je liever hebt"],"model":"Amsterdam is groter dan Utrecht en het is ook drukker. Utrecht is rustiger dan Amsterdam, maar even gezellig. In Amsterdam zijn de huizen duurder dan in Utrecht. De grachten in Amsterdam zijn het mooist, vind ik. Toch woon ik liever in Utrecht, omdat het daar kleiner en schoner is.","min":35,"id":"wf6-f29f65ff"},{"t":"wr","title":"Mijn mening over fietsen","p":"Wat vind je van fietsen als vervoer? (Your opinion about cycling.)","reqs":["Gebruik **Ik vind dat ...** of **Ik denk dat ...** (werkwoord aan het einde)","Noem twee voordelen en één nadeel","Gebruik **beter dan** of **sneller dan** voor een vergelijking met een auto of bus","Gebruik **maar** voor het nadeel"],"model":"Ik vind dat fietsen heel goed is. Ik denk dat de fiets sneller is dan de bus in de stad en het is ook goedkoper. Bovendien is het gezond en goed voor het milieu, maar het regent vaak in Nederland. Dat is een nadeel. Toch fiets ik liever dan dat ik de auto neem, want ik sta dan nooit in de file.","min":45,"id":"wf6-b54777b3"},{"t":"wr","title":"Mijn favoriete vrijetijdsbesteding","p":"Schrijf over de hobby die je het leukst vindt en vergelijk die met een andere. (Favourite hobby and compare.)","reqs":["Gebruik **het meest** of **het liefst**","Gebruik **liever ... dan ...**","Geef minstens twee redenen met **omdat** of **want**","Gebruik **beter**, **leuker** of **minder** voor een vergelijking"],"model":"Mijn favoriete hobby is koken. Ik vind koken leuker dan tv kijken, omdat ik dan iets maak. Ik kook het liefst voor vrienden, want dan eten we samen en is het gezellig. Soms ga ik liever naar de sportschool dan dat ik thuisblijf, maar koken doe ik het meest. Ik word er ook beter in.","min":40,"id":"wf6-035fb1b8"},{"t":"wr","title":"Welke vakantie kies ik?","p":"Je kiest tussen een strandvakantie en een stedentrip. Schrijf je keuze. (Beach holiday or city trip: write your choice.)","reqs":["Vergelijk beide met minstens twee vergrotende trappen","Gebruik **liever** en **het liefst**","Geef minstens drie redenen","Gebruik **Ik denk dat ...** of **Volgens mij ...**"],"model":"Ik kies liever een stedentrip dan een strandvakantie. Volgens mij is een stad interessanter dan een strand, want je kunt musea en winkels bezoeken. Een strandvakantie is wel rustiger, maar ik verveel me snel. Ik denk dat een stedentrip ook goedkoper is. Het liefst ga ik in het najaar, want het is dan minder druk en het weer is vaak nog goed.","min":45,"id":"wf6-bcf6ec55"}]}]},{"id":"wf7","title":"Schrijven 7: formulieren, klacht, advertentie, instructies","rule":"Langere teksten, nu met meer bijzinnen: **omdat/want/als/dat/maar** en **te**/**om ... te**.\nBijzin: werkwoord **aan het einde**: **Ik schrijf, omdat ik een probleem heb.**\nKlacht: **Ik ben niet tevreden over ...**, **Het werkt niet**, **Kunt u dit oplossen?** Advertentie: **te koop**, **te huur**, **prijs**, **bel/mail**.\nInstructies: gebruik de gebiedende wijs of de infinitief: **Kook de pasta tien minuten.** **Eerst ... daarna ...**","group":"Schrijven","sets":[{"instr":"Schrijf een langere tekst (80-130 woorden). Let op de bijzinnen.","hint":"Use subordinate clauses with the verb at the end.","items":[{"t":"wr","title":"Een formulier invullen en toelichten","p":"Je meldt je aan bij een Nederlandse cursus. Schrijf in volledige zinnen: naam, adres, werk, waarom je Nederlands leert. (Fill in a sign-up form in full sentences.)","reqs":["Noem je naam, geboortedatum en adres","Zeg wat je beroep is","Leg uit waarom je Nederlands leert met **omdat**","Zeg wanneer je tijd hebt: **op dinsdag en donderdag**"],"model":"Mijn naam is Sam Jansen en ik ben op 5 maart 1996 geboren. Ik woon aan de Kerkstraat 8 in Delft. Ik werk als software-ontwikkelaar. Ik leer Nederlands, omdat ik in Nederland wil blijven en met mijn collega's wil praten. Ik heb op dinsdag en donderdag 's avonds tijd. Ik wil graag een cursus voor beginners volgen.","min":40,"id":"wf7-20553260"},{"t":"wr","title":"Een klacht schrijven","p":"Je nieuwe wasmachine werkt niet. Schrijf een klacht naar de winkel. (Complaint about a broken washing machine.)","reqs":["Begin formeel: **Geachte heer/mevrouw,**","Noem wat je hebt gekocht en wanneer (perfectum: **Ik heb ... gekocht**)","Beschrijf het probleem met **omdat** of **want**","Vraag om een oplossing met **Kunt u ...?** en eindig formeel"],"model":"Geachte heer, mevrouw, vorige week heb ik bij u een wasmachine gekocht. Helaas werkt het apparaat niet goed, omdat het water niet weggaat. Ik heb de handleiding gelezen, maar het probleem is niet opgelost. Ik ben niet tevreden over dit product. Kunt u een monteur sturen of mijn geld terugbetalen? Ik hoor graag van u. Met vriendelijke groet, Sam Jansen","min":45,"id":"wf7-f5b45002"},{"t":"wr","title":"Een advertentie schrijven","p":"Je wilt je fiets verkopen of je kamer verhuren. Schrijf een advertentie voor Marktplaats. (Write a classified ad.)","reqs":["Begin met **Te koop** of **Te huur**","Noem minstens drie eigenschappen met correcte adjectieven","Noem de prijs en de plaats","Zeg hoe men contact kan opnemen: **Bel ...** of **Mail ...**"],"model":"Te koop: een goede, zwarte damesfiets. De fiets is drie jaar oud en rijdt nog heel goed. Hij heeft een mandje, een nieuwe lamp en een stevig slot. De prijs is honderdvijftig euro. Je kunt hem komen bekijken in Utrecht. Bel mij na zes uur op 06-12345678 of mail naar sam@voorbeeld.nl. Ik help je graag.","min":40,"id":"wf7-8003c465"},{"t":"wr","title":"Instructies geven","p":"Leg iemand uit hoe je een gerecht kookt of hoe je ergens komt. (Explain a recipe or give directions.)","reqs":["Gebruik de gebiedende wijs: **Kook, Snijd, Ga, Sla ... af**","Gebruik **eerst**, **daarna**, **dan**, **ten slotte**","Noem minstens vijf stappen","Gebruik **als** of **tot** één keer: **Als het water kookt, ...**"],"model":"Zo maak je een eenvoudige tomatensoep. Eerst snijd je een ui en twee tomaten. Daarna bak je de ui vijf minuten in een pan. Voeg de tomaten en een liter water toe. Als het water kookt, zet je het vuur laag en wacht je twintig minuten. Ten slotte maak je de soep fijn en doe je er zout en peper bij. Eet smakelijk!","min":45,"id":"wf7-7f9b4d8c"},{"t":"wr","title":"Een lange brief aan een vriend","p":"Schrijf een brief aan een vriend over je nieuwe leven in Nederland. (A longer informal letter about your new life.)","reqs":["Gebruik minstens vijf perfectum-zinnen","Gebruik minstens twee bijzinnen met **omdat**, **dat** of **als**","Gebruik een vergelijking: **groter dan**, **liever dan**, **het meest**","Gebruik **je/jij** en eindig met een vraag en **Groetjes**"],"model":"Hoi Tom, hoe gaat het met je? Ik ben nu twee maanden in Nederland en ik heb al veel meegemaakt. Ik heb een klein appartement gehuurd en ik heb nieuwe buren leren kennen. Ik heb ook een fiets gekocht en een Nederlandse cursus begonnen. Ze zijn aardiger dan ik dacht. Ik werk nu in Utrecht en ik fiets elke dag, omdat het sneller is dan de trein. Ik vind de taal moeilijk, maar ik leer elke week meer. Het weer vind ik het slechtst, want het regent bijna elke dag. Kom je snel een weekend langs? Dan laat ik je mijn favoriete café zien. Groetjes, Sam","min":74,"id":"wf7-914017c2"}]}]}],"speaking":[{"id":"sd1","title":"Kennismaken en begroeten","rule":"- **Klemtoon**: zeg de belangrijkste woorden sterker: \"Ik *heet* Sam.\" / \"Hoe *gaat* het?\" Kleine woorden (ik, je, de) zijn zwak.\n- Vraag? Je stem gaat omhoog aan het eind: \"Hoe *heet* u?\" Bij een mededeling gaat je stem omlaag.\n- **u** is formeel (docent, baas, klant), **je** is informeel (vrienden, collega's). Bij twijfel: begin met u.\n- Spellen: zeg de Nederlandse letters langzaam: *a, be, ce, de, e, ef, ge, ha, i, je...*","group":"Spreken","sets":[{"instr":"Lees de dialogen hardop met een partner. Wissel van rol en let op de tip.","hint":"","items":[{"t":"dlg","title":"Kennismaken op een feestje","sit":"Twee mensen ontmoeten elkaar op een verjaardag.","lines":[{"sp":"Sam","nl":"Hoi, ik ben Sam. Ken jij Eva ook?","en":"Hi, I'm Sam. Do you know Eva too?"},{"sp":"Lisa","nl":"Nee, nog niet. Ik ben Lisa. Leuk je te ontmoeten.","en":"No, not yet. I'm Lisa. Nice to meet you."},{"sp":"Sam","nl":"Ja, ook leuk. Waar kom je vandaan?","en":"Yes, nice to meet you too. Where are you from?"},{"sp":"Lisa","nl":"Ik kom uit Spanje, maar ik woon al drie jaar in Utrecht.","en":"I'm from Spain, but I've lived in Utrecht for three years."},{"sp":"Sam","nl":"Oh, dat is leuk. Wat doe je in Utrecht?","en":"Oh, that's nice. What do you do in Utrecht?"},{"sp":"Lisa","nl":"Ik werk in een ziekenhuis. En jij?","en":"I work in a hospital. And you?"},{"sp":"Sam","nl":"Ik ben leraar. Ik geef les op een middelbare school.","en":"I'm a teacher. I teach at a secondary school."},{"sp":"Lisa","nl":"Wat leuk! Dat lijkt me eigenlijk een mooi beroep.","en":"How nice! That actually seems like a lovely profession to me."},{"sp":"Sam","nl":"Ja, het is druk, maar ik vind het heerlijk.","en":"Yes, it's busy, but I love it."},{"sp":"Lisa","nl":"Zullen we straks nog even praten? Ik haal eerst iets te drinken.","en":"Shall we talk a bit more later? I'll get something to drink first."},{"sp":"Sam","nl":"Graag, tot straks!","en":"Gladly, see you later!"}],"tip":"Klemtoon: zeg *Waar* kom je vandaan? met nadruk op 'waar' en laat je stem aan het eind omhoog gaan. Bij 'Ik ben *Lisa*' valt de nadruk op de naam.","id":"sd1-1e277dd1"},{"t":"dlg","title":"Formeel of informeel","sit":"Een nieuwe patiënt komt bij de huisarts en praat met de assistent.","lines":[{"sp":"Assistent","nl":"Goedemorgen. Waarmee kan ik u helpen?","en":"Good morning. How can I help you?"},{"sp":"Patiënt","nl":"Goedemorgen. Ik heb een afspraak om negen uur.","en":"Good morning. I have an appointment at nine."},{"sp":"Assistent","nl":"Wat is uw naam, alstublieft?","en":"What is your name, please?"},{"sp":"Patiënt","nl":"Ik heet Jansen. Maar mijn vrienden zeggen gewoon Jan.","en":"My name is Jansen. But my friends just say Jan."},{"sp":"Assistent","nl":"Dan zeg ik toch maar meneer Jansen. Mag ik uw geboortedatum?","en":"Then I'll just say Mr Jansen. May I have your date of birth?"},{"sp":"Patiënt","nl":"Natuurlijk. Die is 12 maart 1985.","en":"Of course. It's 12 March 1985."},{"sp":"Assistent","nl":"Dank u wel. Gaat u maar even zitten in de wachtkamer.","en":"Thank you. Please have a seat in the waiting room."},{"sp":"Patiënt","nl":"Dank u. Hoe lang moet ik wachten?","en":"Thank you. How long do I have to wait?"},{"sp":"Assistent","nl":"Niet lang, ongeveer vijf minuten.","en":"Not long, about five minutes."},{"sp":"Patiënt","nl":"Prima, dan ga ik even zitten.","en":"Fine, then I'll sit down for a bit."}],"tip":"Let op u en uw: houd je toon beleefd en rustig. Bij 'alstublieft' ligt de klemtoon op de laatste lettergreep: alstu*blieft*. Zeg het ritmisch: al-stu-*blieft*.","id":"sd1-a71d1393"},{"t":"dlg","title":"Je naam spellen","sit":"Iemand belt om een afspraak te maken en moet zijn naam spellen.","lines":[{"sp":"Medewerker","nl":"Goedemiddag, praktijk De Boer. Met Anna.","en":"Good afternoon, De Boer practice. Anna speaking."},{"sp":"Beller","nl":"Goedemiddag. Ik wil graag een afspraak maken.","en":"Good afternoon. I would like to make an appointment."},{"sp":"Medewerker","nl":"Dat kan. Hoe heet u?","en":"That's possible. What is your name?"},{"sp":"Beller","nl":"Mijn naam is Van der Veen.","en":"My name is Van der Veen."},{"sp":"Medewerker","nl":"Kunt u dat even spellen, alstublieft?","en":"Could you spell that, please?"},{"sp":"Beller","nl":"Ja hoor. V, a, n, d, e, r, V, e, e, n.","en":"Sure. V, a, n, d, e, r, V, e, e, n."},{"sp":"Medewerker","nl":"Dus Van der Veen met twee e's in Veen?","en":"So Van der Veen with two e's in Veen?"},{"sp":"Beller","nl":"Precies. En mijn voornaam is Pieter, P-i-e-t-e-r.","en":"Exactly. And my first name is Pieter, P-i-e-t-e-r."},{"sp":"Medewerker","nl":"Dank u. Wat is uw telefoonnummer?","en":"Thank you. What is your telephone number?"},{"sp":"Beller","nl":"Nul zes, twaalf vierendertig, achtenvijftig, zesenzeventig.","en":"Zero six, twelve thirty-four, fifty-eight, seventy-six."},{"sp":"Medewerker","nl":"Nul zes, twaalf, vierendertig, achtenvijftig, zesenzeventig. Klopt dat?","en":"Zero six, twelve, thirty-four, fifty-eight, seventy-six. Is that right?"},{"sp":"Beller","nl":"Ja, dat klopt. Dank u wel.","en":"Yes, that's right. Thank you."}],"tip":"Zeg telefoonnummers in groepjes van twee cijfers met een korte pauze. Je stem gaat omhoog bij het laatste cijfer van elk groepje en omlaag aan het eind van het nummer.","id":"sd1-b61d2a5c"}]}]},{"id":"sd2","title":"In de klas en de les","rule":"- Gebruik vaste zinnen om te vragen: **Kunt u dat herhalen?** / **Wat betekent ...?** / **Hoe zeg je ... in het Nederlands?** / **Kunt u wat langzamer praten?**\n- Spreek in hele zinnen, maar kort. Liever \"Ik snap het niet\" dan stil blijven.\n- **Klemtoon**: in vragen valt de nadruk meestal op het vraagwoord of het belangrijkste woord: \"Wat *betekent* dat?\" / \"Kunt u dat her*ha*len?\"\n- Bij het huiswerk en de toets kun je kort antwoorden: Ja, ik ben klaar. / Nee, nog niet.","group":"Spreken","sets":[{"instr":"Lees de dialogen hardop. Speel ze daarna na met je eigen woorden.","hint":"","items":[{"t":"dlg","title":"Kunt u dat herhalen?","sit":"De docent legt iets uit en een student snapt het niet meteen.","lines":[{"sp":"Docent","nl":"Goedemorgen allemaal. Pak jullie boek en sla pagina twaalf open.","en":"Good morning everyone. Take your book and open page twelve."},{"sp":"Student","nl":"Sorry, kunt u dat herhalen? Welke pagina?","en":"Sorry, could you repeat that? Which page?"},{"sp":"Docent","nl":"Pagina twaalf. Oefening drie.","en":"Page twelve. Exercise three."},{"sp":"Student","nl":"Dank u wel. En wat betekent 'opschrijven'?","en":"Thank you. And what does 'opschrijven' mean?"},{"sp":"Docent","nl":"Dat is 'to write down'. Schrijf de antwoorden op in je schrift.","en":"That is 'to write down'. Write the answers in your notebook."},{"sp":"Student","nl":"Mag ik een pen lenen? Ik ben mijn pen vergeten.","en":"May I borrow a pen? I forgot my pen."},{"sp":"Docent","nl":"Natuurlijk, hier is een pen. Zijn jullie klaar?","en":"Of course, here is a pen. Are you ready?"},{"sp":"Student","nl":"Nog niet helemaal. Kunt u wat langzamer praten?","en":"Not quite yet. Could you speak a bit more slowly?"},{"sp":"Docent","nl":"Ja hoor, geen probleem. Dan lees ik de zin nog een keer.","en":"Yes, no problem. Then I'll read the sentence once more."},{"sp":"Student","nl":"Nu snap ik het. Dank u wel.","en":"Now I understand. Thank you."}],"tip":"Zeg 'kunt u dat her*ha*len?' met een stijgende toon aan het eind. Je klinkt dan beleefd en geïnteresseerd, niet boos.","id":"sd2-75dadf99"},{"t":"dlg","title":"Het huiswerk","sit":"Twee studenten praten na de les over het huiswerk.","lines":[{"sp":"Mina","nl":"Heb jij het huiswerk al gemaakt?","en":"Have you already done the homework?"},{"sp":"Tom","nl":"Nee, nog niet. Ik heb gisteren gewerkt en was erg moe.","en":"No, not yet. I worked yesterday and was very tired."},{"sp":"Mina","nl":"Het is niet moeilijk. We moeten tien zinnen schrijven.","en":"It's not difficult. We have to write ten sentences."},{"sp":"Tom","nl":"Over welk onderwerp? Ik weet het niet meer.","en":"About which topic? I don't remember."},{"sp":"Mina","nl":"Over je week. Wat doe je op maandag, op dinsdag, enzovoort.","en":"About your week. What you do on Monday, on Tuesday, and so on."},{"sp":"Tom","nl":"O ja, nu weet ik het weer. Wanneer moeten we het inleveren?","en":"Oh yes, now I remember. When do we have to hand it in?"},{"sp":"Mina","nl":"Donderdag, voor de les begint.","en":"Thursday, before the class starts."},{"sp":"Tom","nl":"Dan heb ik nog twee dagen. Maar ik begin vanavond al.","en":"Then I still have two days. But I'll start this evening."},{"sp":"Mina","nl":"Goed idee. Als je een vraag hebt, kun je me appen.","en":"Good idea. If you have a question, you can text me."},{"sp":"Tom","nl":"Dank je wel, dat is lief. Tot donderdag!","en":"Thank you, that's kind. See you Thursday!"}],"tip":"Zeg dagen van de week met nadruk op de eerste lettergreep: *maan*dag, *dins*dag, *woens*dag, *don*derdag, *vrij*dag. Zo klinkt het natuurlijk.","id":"sd2-240ef12f"},{"t":"dlg","title":"Een toets en een afspraak","sit":"De student praat met de docent na de les.","lines":[{"sp":"Student","nl":"Pardon, mevrouw, mag ik u iets vragen?","en":"Excuse me, may I ask you something?"},{"sp":"Docent","nl":"Natuurlijk, zeg het maar.","en":"Of course, go ahead."},{"sp":"Student","nl":"Wanneer is de volgende toets?","en":"When is the next test?"},{"sp":"Docent","nl":"Die is op vrijdag de vijftiende, in het lokaal naast de kantine.","en":"It's on Friday the fifteenth, in the classroom next to the canteen."},{"sp":"Student","nl":"Moet ik veel leren?","en":"Do I have to study a lot?"},{"sp":"Docent","nl":"Je moet hoofdstuk drie en vier goed kennen. Ook de woordenlijst.","en":"You have to know chapters three and four well. Also the vocabulary list."},{"sp":"Student","nl":"En mag ik een woordenboek gebruiken?","en":"And may I use a dictionary?"},{"sp":"Docent","nl":"Nee, dat mag niet. Maar je mag wel een pen en papier meenemen.","en":"No, that's not allowed. But you may bring a pen and paper."},{"sp":"Student","nl":"Oké, dank u. Ik zie u dinsdag in de les.","en":"Okay, thank you. I'll see you on Tuesday in class."},{"sp":"Docent","nl":"Tot dinsdag, en succes met leren!","en":"See you Tuesday, and good luck studying!"}],"tip":"Let op de woorden 'moet' en 'mag': geef ze nadruk als je regels noemt. Zeg 'dat mag *niet*' met een duidelijke nadruk op 'niet'.","id":"sd2-a6ae7002"}]}]},{"id":"sd3","title":"Familie, huis en wonen","rule":"- Beschrijf kort en concreet: \"Ik woon in een klein appartement met twee kamers.\"\n- **Klemtoon** in lange woorden: *slaap*kamer, *woon*kamer, *bad*kamer, *keu*ken. Meestal valt de klemtoon op de eerste lettergreep van het eerste deel.\n- Gebruik **hoor**, **eigenlijk** en **toch** spaarzaam, om vriendelijk of zachter te klinken: \"Dat is niet erg, hoor.\"\n- Vragen over huren en buren: begin met \"Mag ik ... vragen?\" of \"Is het mogelijk dat ...?\" Dat klinkt beleefd.","group":"Spreken","sets":[{"instr":"Lees de dialogen hardop. Let op klemtoon en melodie.","hint":"","items":[{"t":"dlg","title":"Mijn familie","sit":"Twee collega's praten in de pauze over hun gezin.","lines":[{"sp":"Femke","nl":"Heb jij broers of zussen, Jeroen?","en":"Do you have brothers or sisters, Jeroen?"},{"sp":"Jeroen","nl":"Ja, ik heb een oudere zus en een jongere broer.","en":"Yes, I have an older sister and a younger brother."},{"sp":"Femke","nl":"Wonen ze ook in Nederland?","en":"Do they also live in the Netherlands?"},{"sp":"Jeroen","nl":"Mijn zus woont in Rotterdam. Mijn broer studeert in Amsterdam.","en":"My sister lives in Rotterdam. My brother studies in Amsterdam."},{"sp":"Femke","nl":"Wat leuk. Heb je zelf ook kinderen?","en":"How nice. Do you have children yourself?"},{"sp":"Jeroen","nl":"Ja, een dochter van vijf en een zoon van twee.","en":"Yes, a daughter of five and a son of two."},{"sp":"Femke","nl":"Dat is druk, zeker met je werk.","en":"That's busy, especially with your work."},{"sp":"Jeroen","nl":"Ja, maar mijn vrouw werkt vier dagen, dus we helpen elkaar.","en":"Yes, but my wife works four days, so we help each other."},{"sp":"Femke","nl":"En wonen je ouders ook in de buurt?","en":"And do your parents live nearby too?"},{"sp":"Jeroen","nl":"Ja, mijn moeder woont tien minuten fietsen hier vandaan. Ze past vaak op.","en":"Yes, my mother lives ten minutes by bike from here. She often babysits."},{"sp":"Femke","nl":"Dat is fijn! Dan hebben jullie wat hulp.","en":"That's nice! Then you have some help."}],"tip":"Zeg familiewoorden met duidelijke klemtoon: *zus*, *broer*, *dochter*, *moe*der. Bij een lijst ('een zus en een broer') gaat je stem omhoog bij het eerste item en omlaag bij het laatste.","id":"sd3-a4547add"},{"t":"dlg","title":"Een huis huren","sit":"Iemand belt over een kamer die te huur is.","lines":[{"sp":"Student","nl":"Goedemiddag, ik bel over de kamer op Marktstraat 14. Is die nog beschikbaar?","en":"Good afternoon, I'm calling about the room at Marktstraat 14. Is it still available?"},{"sp":"Verhuurder","nl":"Ja, die is nog vrij. Hij is twintig vierkante meter.","en":"Yes, it's still free. It's twenty square metres."},{"sp":"Student","nl":"Wat kost de kamer per maand?","en":"What does the room cost per month?"},{"sp":"Verhuurder","nl":"Vierhonderdvijftig euro, inclusief gas, water en licht.","en":"Four hundred fifty euros, including gas, water and electricity."},{"sp":"Student","nl":"En deel ik de keuken en de badkamer?","en":"And do I share the kitchen and the bathroom?"},{"sp":"Verhuurder","nl":"Ja, met nog twee andere huisgenoten. Het zijn aardige mensen.","en":"Yes, with two other housemates. They are nice people."},{"sp":"Student","nl":"Is er een tuin of balkon?","en":"Is there a garden or balcony?"},{"sp":"Verhuurder","nl":"Er is een kleine tuin achter het huis.","en":"There is a small garden behind the house."},{"sp":"Student","nl":"Mag ik de kamer deze week komen bekijken?","en":"May I come and see the room this week?"},{"sp":"Verhuurder","nl":"Ja, woensdag na zes uur past goed. Kunt u dan?","en":"Yes, Wednesday after six works well. Can you then?"},{"sp":"Student","nl":"Ja, dat kan. Dan ben ik er om zes uur.","en":"Yes, that's possible. Then I'll be there at six."}],"tip":"Getallen als 'vierhonderdvijftig' hebben klemtoon op *vier* en op *vijf*. Oefen: *vier*honderd*vijf*tig. Zeg 'euro' met klemtoon op *eu*: *eu*ro.","id":"sd3-8685f345"},{"t":"dlg","title":"Met de buren","sit":"Twee buren praten in het trappenhuis.","lines":[{"sp":"Buurvrouw","nl":"Goedemorgen! Ben jij de nieuwe buurman?","en":"Good morning! Are you the new neighbour?"},{"sp":"Buurman","nl":"Ja, ik ben vorige week verhuisd. Ik heet Daan.","en":"Yes, I moved last week. My name is Daan."},{"sp":"Buurvrouw","nl":"Welkom! Ik woon op nummer 6, naast jou. Ik ben Karin.","en":"Welcome! I live at number 6, next to you. I'm Karin."},{"sp":"Buurman","nl":"Leuk je te ontmoeten. Ik hoop dat ik niet te veel lawaai maak.","en":"Nice to meet you. I hope I'm not making too much noise."},{"sp":"Buurvrouw","nl":"Een beetje, vooral 's avonds, maar het is niet erg, hoor.","en":"A little, especially in the evening, but it's not a problem."},{"sp":"Buurman","nl":"Sorry, dat wist ik niet. Ik let er voortaan op.","en":"Sorry, I didn't know that. I'll pay attention from now on."},{"sp":"Buurvrouw","nl":"Geen zorgen. Heb je al een sleutel voor de fietsenstalling?","en":"No worries. Do you already have a key for the bike shed?"},{"sp":"Buurman","nl":"Nee, nog niet. Waar kan ik die krijgen?","en":"No, not yet. Where can I get one?"},{"sp":"Buurvrouw","nl":"Bij de huismeester, op de begane grond. Hij is er elke ochtend.","en":"At the caretaker's, on the ground floor. He's there every morning."},{"sp":"Buurman","nl":"Dank je wel, Karin. Ik ga er meteen heen.","en":"Thanks, Karin. I'll go there right away."}],"tip":"Probeer 'hoor' zacht en vriendelijk uit te spreken, met een lichte daling: 'het is niet *erg*, hoor.' Het woord 'hoor' zelf heeft geen sterke nadruk.","id":"sd3-c8d7e17f"}]}]},{"id":"sd4","title":"Eten en drinken","rule":"- Bestel beleefd: **Mag ik een ... , alstublieft?** / **Ik wil graag ...** / **Mag ik de rekening?** Zeg altijd \"alstublieft\" of \"dank u wel\".\n- **Klemtoon**: in een bestelling krijgt het product de nadruk: \"Een *kof*fie en een stuk *ap*peltaart.\"\n- Betalen: \"Kan ik pinnen?\" / \"Ik betaal contant.\" / \"Apart of samen?\" Cijfers en prijzen duidelijk uitspreken: \"twee euro vijftig\".\n- Hoor je iets niet? Zeg: Sorry, kunt u dat herhalen?","group":"Spreken","sets":[{"instr":"Lees de dialogen hardop. Gebruik daarna je eigen bestelling.","hint":"","items":[{"t":"dlg","title":"In het café","sit":"Twee vrienden bestellen iets bij de bar.","lines":[{"sp":"Ober","nl":"Goedemiddag. Wat mag het zijn?","en":"Good afternoon. What can I get you?"},{"sp":"Lotte","nl":"Mag ik een cappuccino, alstublieft?","en":"May I have a cappuccino, please?"},{"sp":"Ober","nl":"Natuurlijk. En voor u, meneer?","en":"Of course. And for you, sir?"},{"sp":"Ruben","nl":"Ik wil graag een kopje thee en een glas water.","en":"I would like a cup of tea and a glass of water."},{"sp":"Ober","nl":"Welke thee wilt u? Wij hebben groene, zwarte en kruidenthee.","en":"Which tea would you like? We have green, black and herbal tea."},{"sp":"Ruben","nl":"Doe maar groene thee.","en":"Green tea is fine."},{"sp":"Ober","nl":"Wilt u er iets bij eten? Wij hebben appeltaart en broodjes.","en":"Would you like something to eat with it? We have apple pie and sandwiches."},{"sp":"Lotte","nl":"Een stuk appeltaart, graag. Met slagroom.","en":"A piece of apple pie, please. With whipped cream."},{"sp":"Ober","nl":"Prima. Dat is dan samen elf euro twintig.","en":"Fine. That is eleven euros twenty together."},{"sp":"Ruben","nl":"Kunnen we pinnen?","en":"Can we pay by card?"},{"sp":"Ober","nl":"Ja hoor, geen probleem.","en":"Yes, no problem."}],"tip":"Bij bestellen krijgt het product de klemtoon: een cappuc*ci*no, een stuk *ap*peltaart. Zeg 'doe *maar*' kort en luchtig, dat klinkt heel Nederlands.","id":"sd4-60ab15f0"},{"t":"dlg","title":"In het restaurant","sit":"Een gezin eet in een restaurant en vraagt om de rekening.","lines":[{"sp":"Ober","nl":"Goedenavond. Hebt u gereserveerd?","en":"Good evening. Do you have a reservation?"},{"sp":"Vader","nl":"Ja, op naam van Visser, voor vier personen.","en":"Yes, in the name of Visser, for four people."},{"sp":"Ober","nl":"Dat klopt. Komt u maar mee. Hier is de kaart.","en":"That's right. Come with me. Here is the menu."},{"sp":"Moeder","nl":"Wat is de dagschotel vandaag?","en":"What is the dish of the day?"},{"sp":"Ober","nl":"Gebakken vis met aardappelen en groenten.","en":"Fried fish with potatoes and vegetables."},{"sp":"Moeder","nl":"Dat klinkt lekker. Dan neem ik de vis.","en":"That sounds good. Then I'll take the fish."},{"sp":"Vader","nl":"Ik neem de biefstuk, en de kinderen willen friet met kip.","en":"I'll take the steak, and the kids want fries with chicken."},{"sp":"Ober","nl":"Wilt u er iets bij drinken?","en":"Would you like something to drink with it?"},{"sp":"Vader","nl":"Twee keer water, een cola en een glas rode wijn, graag.","en":"Two waters, one cola and a glass of red wine, please."},{"sp":"Ober","nl":"Komt eraan.","en":"Coming up."},{"sp":"Vader","nl":"Mag ik straks de rekening? We willen apart betalen.","en":"May I have the bill later? We want to pay separately."}],"tip":"Bij een opsomming ('twee keer *wa*ter, een *co*la en een glas *wijn*') gaat je stem omhoog bij elk item en omlaag bij het laatste. Zeg 'Eet *sma*kelijk' met klemtoon op *sma*.","id":"sd4-1be894d7"},{"t":"dlg","title":"In de supermarkt","sit":"Een klant praat met een medewerker en bij de kassa.","lines":[{"sp":"Klant","nl":"Pardon, waar vind ik de melk?","en":"Excuse me, where can I find the milk?"},{"sp":"Medewerker","nl":"Bij de zuivel, in gang vier. Naast de kaas.","en":"In the dairy, in aisle four. Next to the cheese."},{"sp":"Klant","nl":"Dank u wel. En hebt u ook glutenvrij brood?","en":"Thank you. And do you also have gluten-free bread?"},{"sp":"Medewerker","nl":"Ja, bij het brood, links bij de ingang.","en":"Yes, at the bakery shelf, on the left by the entrance."},{"sp":"Klant","nl":"Super. Hoeveel kost een kilo appels?","en":"Great. How much is a kilo of apples?"},{"sp":"Medewerker","nl":"Twee euro negenennegentig. Vandaag zijn ze in de aanbieding.","en":"Two euros ninety-nine. They are on offer today."},{"sp":"Kassamedewerker","nl":"Goedemiddag. Wilt u een tas?","en":"Good afternoon. Would you like a bag?"},{"sp":"Klant","nl":"Nee, dank u, ik heb zelf een tas mee.","en":"No, thank you, I have my own bag."},{"sp":"Kassamedewerker","nl":"Dat is dan eenentwintig euro vijftig. Pint u of betaalt u contant?","en":"That is twenty-one euros fifty. Do you pay by card or cash?"},{"sp":"Klant","nl":"Ik pin. Hier is mijn pas.","en":"I'll pay by card. Here is my card."},{"sp":"Kassamedewerker","nl":"Prima. Fijne dag nog!","en":"Fine. Have a nice day!"}],"tip":"Zeg prijzen duidelijk: 'twee *eu*ro *ne*genennegen*tig'. Let op de klemtoon in de getallen en laat je stem omlaag gaan aan het eind van de prijs.","id":"sd4-8b744a46"}]}]},{"id":"sd5","title":"Winkelen","rule":"- Vraag om hulp: **Mag ik even iets vragen?** / **Hebt u dit ook in een andere maat?** / **Mag ik dit passen?**\n- **Klemtoon**: noem de maat of kleur sterk: \"Maat *me*dium\" / \"Hebt u dit in *blauw*?\"\n- Prijs en betalen: \"Wat kost dit?\" / \"Ik pin.\" / \"Kan ik dit ruilen?\" Zeg \"alstublieft\" en \"dank u wel\".","group":"Spreken","sets":[{"instr":"Lees de dialogen hardop. Wissel van rol en varieer kleur, maat en prijs.","hint":"","items":[{"t":"dlg","title":"Kleren kopen","sit":"Een klant zoekt een trui en vraagt hulp.","lines":[{"sp":"Klant","nl":"Goedemiddag, mag ik even iets vragen?","en":"Good afternoon, may I ask something?"},{"sp":"Verkoper","nl":"Natuurlijk. Waarmee kan ik u helpen?","en":"Of course. How can I help you?"},{"sp":"Klant","nl":"Ik zoek een warme trui, het liefst in donkerblauw.","en":"I'm looking for a warm sweater, preferably in dark blue."},{"sp":"Verkoper","nl":"Deze is mooi, en hij is van wol. Welke maat hebt u?","en":"This one is nice, and it's made of wool. What size are you?"},{"sp":"Klant","nl":"Ik denk maat medium. Mag ik hem passen?","en":"I think size medium. May I try it on?"},{"sp":"Verkoper","nl":"Ja hoor, de paskamer is achterin links.","en":"Yes, the fitting room is at the back on the left."},{"sp":"Klant","nl":"Hij is een beetje te klein. Hebt u deze ook in large?","en":"It's a bit too small. Do you have this in large too?"},{"sp":"Verkoper","nl":"Even kijken. Ja, hier is een large.","en":"Let me check. Yes, here is a large."},{"sp":"Klant","nl":"Die past goed. Wat kost hij?","en":"That fits well. What does it cost?"},{"sp":"Verkoper","nl":"Negenenveertig euro vijfennegentig. Op dit moment hebben we korting.","en":"Forty-nine euros ninety-five. We have a discount at the moment."},{"sp":"Klant","nl":"Dan neem ik hem. Dank u wel!","en":"Then I'll take it. Thank you!"}],"tip":"Klemtoon bij maten en kleuren: *me*dium, *lar*ge, *don*kerblauw. Zeg 'Hij is een beetje te *klein*' met een lichte daling aan het eind.","id":"sd5-69670dc4"},{"t":"dlg","title":"Pinnen bij de kassa","sit":"De klant betaalt, maar de pinpas werkt niet meteen.","lines":[{"sp":"Kassamedewerker","nl":"Dat is dan achtenzestig euro tachtig.","en":"That is sixty-eight euros eighty."},{"sp":"Klant","nl":"Ik pin. Kan ik contactloos betalen?","en":"I'll pay by card. Can I pay contactless?"},{"sp":"Kassamedewerker","nl":"Ja, houd uw pas maar tegen het apparaat.","en":"Yes, just hold your card against the machine."},{"sp":"Klant","nl":"Hij werkt niet. Wat is er aan de hand?","en":"It's not working. What's going on?"},{"sp":"Kassamedewerker","nl":"Wilt u het nog eens proberen met uw pincode?","en":"Would you like to try again with your PIN?"},{"sp":"Klant","nl":"Ja, een moment. Nu staat er 'betaling geslaagd'.","en":"Yes, one moment. Now it says 'payment successful'."},{"sp":"Kassamedewerker","nl":"Prima. Wilt u de bon mee?","en":"Fine. Would you like the receipt?"},{"sp":"Klant","nl":"Ja, graag, want ik wil misschien iets ruilen.","en":"Yes, please, because I might want to exchange something."},{"sp":"Kassamedewerker","nl":"Dat kan binnen veertien dagen, met de bon.","en":"That's possible within fourteen days, with the receipt."},{"sp":"Klant","nl":"Goed om te weten. Dank u wel en fijne dag.","en":"Good to know. Thank you and have a nice day."},{"sp":"Kassamedewerker","nl":"Dank u wel, tot ziens!","en":"Thank you, goodbye!"}],"tip":"Geef bij 'pin' en 'bon' duidelijke klemtoon. Zeg 'Wat is er aan de *hand*?' met een stijgende toon aan het begin en een kleine daling op 'hand'.","id":"sd5-39779066"},{"t":"dlg","title":"Iets terugbrengen","sit":"Een klant brengt een jas terug en wil ruilen.","lines":[{"sp":"Klant","nl":"Goedemorgen. Ik wil graag deze jas terugbrengen.","en":"Good morning. I would like to return this jacket."},{"sp":"Verkoper","nl":"Goedemorgen. Is er iets mis mee?","en":"Good morning. Is there something wrong with it?"},{"sp":"Klant","nl":"Nee, hij is eigenlijk te groot. Ik heb maat 38 nodig, geen 40.","en":"No, he is actually too big. I need size 38, not 40."},{"sp":"Verkoper","nl":"Hebt u de bon nog?","en":"Do you still have the receipt?"},{"sp":"Klant","nl":"Ja, hier is hij. Ik heb de jas vorige week gekocht.","en":"Yes, here it is. I bought the jacket last week."},{"sp":"Verkoper","nl":"Dat is goed. Wilt u het geld terug of een andere jas?","en":"That's fine. Do you want your money back or another jacket?"},{"sp":"Klant","nl":"Ik wil liever een andere jas. Hebt u deze ook in maat 38?","en":"I'd rather have another jacket. Do you have this in size 38 too?"},{"sp":"Verkoper","nl":"Even kijken. Ja, er is er nog één in zwart. Is dat goed?","en":"Let me check. Yes, there is one left in black. Is that okay?"},{"sp":"Klant","nl":"Zwart is prima. Moet ik iets bijbetalen?","en":"Black is fine. Do I have to pay extra?"},{"sp":"Verkoper","nl":"Nee, de prijs is hetzelfde. Hier is uw nieuwe jas.","en":"No, the price is the same. Here is your new jacket."},{"sp":"Klant","nl":"Dank u wel. Dat was snel!","en":"Thank you. That was quick!"}],"tip":"Zeg 'Is er iets *mis* mee?' met nadruk op 'mis'. Bij 'te *groot*, niet te *klein*' geef je het contrast aan met nadruk.","id":"sd5-cc764dd6"}]}]},{"id":"sd6","title":"Spreken: reizen en vervoer","rule":"- Spreek rustig en duidelijk: **Een enkele reis naar Utrecht, alstublieft.**\n- Zeg de bestemming met klemtoon: naar *Rot*terdam, van *spoor* *twee*.\n- Als je iets niet verstaat, vraag: **Kunt u dat herhalen?** of **Sorry, wat zei u?**\n- Bij een vraag gaat je stem aan het einde omhoog.","group":"Spreken","sets":[{"instr":"Lees de dialogen hardop. Speel daarna beide rollen.","hint":"","items":[{"t":"dlg","title":"Een kaartje kopen","sit":"Bij het loket op het station koop je een treinkaartje.","lines":[{"sp":"A","nl":"Goedemorgen, kan ik u helpen?","en":"Good morning, can I help you?"},{"sp":"B","nl":"Ja, ik wil graag een kaartje naar Utrecht.","en":"Yes, I would like a ticket to Utrecht."},{"sp":"A","nl":"Enkele reis of retour?","en":"Single or return?"},{"sp":"B","nl":"Retour, alstublieft. Wat kost dat?","en":"Return, please. How much is that?"},{"sp":"A","nl":"Dat is twintig euro en tien cent.","en":"That is twenty euros and ten cents."},{"sp":"B","nl":"Mag ik met mijn pinpas betalen?","en":"May I pay with my debit card?"},{"sp":"A","nl":"Natuurlijk. Houd uw pas maar tegen de lezer.","en":"Of course. Just hold your card against the reader."},{"sp":"B","nl":"Van welk perron vertrekt de trein?","en":"From which platform does the train leave?"},{"sp":"A","nl":"Van perron vier, over tien minuten.","en":"From platform four, in ten minutes."},{"sp":"B","nl":"Dank u wel. Fijne dag!","en":"Thank you. Have a nice day!"}],"tip":"Klemtoon op de belangrijke woorden: een *kaar*tje naar *U*trecht, re*tour*, per*ron* *vier*. De vraag Enkele reis of retour? gaat bij 'of' even omhoog en bij 'retour' omlaag.","id":"sd6-28e0b5e3"},{"t":"dlg","title":"De trein heeft vertraging","sit":"Op het perron: de trein is te laat en je vraagt een medereiziger om hulp.","lines":[{"sp":"A","nl":"Sorry, weet u waarom de trein er nog niet is?","en":"Sorry, do you know why the train isn't here yet?"},{"sp":"B","nl":"Er is vertraging. Er staat vijftien minuten op het bord.","en":"There is a delay. The board says fifteen minutes."},{"sp":"A","nl":"Oh nee, dan mis ik mijn overstap in Amersfoort.","en":"Oh no, then I will miss my connection in Amersfoort."},{"sp":"B","nl":"Waar moet u naartoe?","en":"Where do you have to go?"},{"sp":"A","nl":"Naar Zwolle. Ik heb om half tien een afspraak.","en":"To Zwolle. I have an appointment at half past nine."},{"sp":"B","nl":"Dan kunt u misschien beter de bus nemen.","en":"Then maybe you can better take the bus."},{"sp":"A","nl":"Welke bus gaat daarheen?","en":"Which bus goes there?"},{"sp":"B","nl":"Dat weet ik niet. Vraag het maar aan de man bij de informatie.","en":"I don't know. Just ask the man at the information desk."},{"sp":"A","nl":"Goed idee. Dank u wel voor de hulp.","en":"Good idea. Thank you for the help."},{"sp":"B","nl":"Graag gedaan. Ik hoop dat het lukt!","en":"You're welcome. I hope it works out!"}],"tip":"Klemtoon: ver*tra*ging, *over*stap, *Zwol*le. In 'Oh nee' gaat je stem omlaag: je bent teleurgesteld. Zeg 'Sorry' vriendelijk, met de stem omhoog.","id":"sd6-c83a905a"},{"t":"dlg","title":"De weg vragen","sit":"Je bent in een stad en zoekt de bushalte. Je vraagt de weg aan iemand op straat.","lines":[{"sp":"A","nl":"Pardon, mag ik u iets vragen?","en":"Excuse me, may I ask you something?"},{"sp":"B","nl":"Ja, zeg het maar.","en":"Yes, go ahead."},{"sp":"A","nl":"Waar is de dichtstbijzijnde bushalte?","en":"Where is the nearest bus stop?"},{"sp":"B","nl":"Ga hier rechtdoor tot aan het stoplicht.","en":"Go straight ahead here as far as the traffic light."},{"sp":"A","nl":"En dan?","en":"And then?"},{"sp":"B","nl":"Dan sla je linksaf. De halte is naast de supermarkt.","en":"Then you turn left. The stop is next to the supermarket."},{"sp":"A","nl":"Is het ver lopen?","en":"Is it far to walk?"},{"sp":"B","nl":"Nee, ongeveer vijf minuten. Of je pakt de fiets.","en":"No, about five minutes. Or you take the bike."},{"sp":"A","nl":"Ik heb geen fiets, dus ik loop.","en":"I don't have a bike, so I'll walk."},{"sp":"B","nl":"Succes! Het is echt vlakbij.","en":"Good luck! It's really close by."}],"tip":"Bij 'rechtdoor', 'linksaf' en 'rechtsaf' ligt de klemtoon op het tweede deel: links*af*, rechts*af*, recht*door*. Spreek de richting duidelijk uit.","id":"sd6-e93f93f0"}]}]},{"id":"sd7","title":"Spreken: afspraken, tijd en agenda","rule":"- Zeg de tijd met klemtoon op het getal: om *half* *drie*, om *kwart over* *negen*.\n- Een afspraak maken: **Zullen we ... afspreken?** / **Schikt het u om ...?**\n- Verzetten kan beleefd: **Kan ik de afspraak verzetten naar ...?**\n- Herhaal de dag en de tijd aan het einde, zo weet je zeker dat het klopt.","group":"Spreken","sets":[{"instr":"Lees de dialogen hardop. Speel daarna beide rollen.","hint":"","items":[{"t":"dlg","title":"Bellen voor een afspraak","sit":"Je belt het kantoor van de tandarts en maakt een afspraak.","lines":[{"sp":"A","nl":"Tandartspraktijk De Linde, goedemiddag.","en":"Dental practice De Linde, good afternoon."},{"sp":"B","nl":"Goedemiddag, met Sanne Bakker. Ik wil graag een afspraak maken.","en":"Good afternoon, this is Sanne Bakker. I would like to make an appointment."},{"sp":"A","nl":"Wanneer schikt het u?","en":"When would suit you?"},{"sp":"B","nl":"Het liefst in de ochtend, want dan werk ik niet.","en":"Preferably in the morning, because then I don't work."},{"sp":"A","nl":"Dinsdag om half tien is er plek. Is dat goed?","en":"There is room on Tuesday at half past nine. Is that fine?"},{"sp":"B","nl":"Ja, dat is prima.","en":"Yes, that's fine."},{"sp":"A","nl":"Kunt u uw geboortedatum even zeggen?","en":"Can you say your date of birth?"},{"sp":"B","nl":"Natuurlijk, ik ben geboren op twaalf mei negentienhonderd negentig.","en":"Of course, I was born on the twelfth of May nineteen ninety."},{"sp":"A","nl":"Dank u. Dan zie ik u dinsdag om half tien.","en":"Thank you. Then I'll see you on Tuesday at half past nine."},{"sp":"B","nl":"Tot dinsdag, dag mevrouw!","en":"See you Tuesday, goodbye!"}],"tip":"Op de telefoon spreek je iets langzamer. Klemtoon: *dins*dag, *half* *tien*, ge*boor*tedatum. Als je instemt ('Ja, dat is *pri*ma') gaat je stem omlaag.","id":"sd7-77e29238"},{"t":"dlg","title":"Een afspraak verzetten","sit":"Je vriend en jij wilt afspreken, maar het past niet.","lines":[{"sp":"A","nl":"Hoi Mo, zullen we donderdag afspreken?","en":"Hi Mo, shall we meet on Thursday?"},{"sp":"B","nl":"Hoi Lisa! Hoe laat dan?","en":"Hi Lisa! What time then?"},{"sp":"A","nl":"Om zeven uur bij het station?","en":"At seven o'clock at the station?"},{"sp":"B","nl":"Oh, dat is jammer. Ik moet dan werken tot acht uur.","en":"Oh, that's a pity. I have to work until eight then."},{"sp":"A","nl":"Dan doen we het later. Past negen uur?","en":"Then we do it later. Does nine o'clock work?"},{"sp":"B","nl":"Eigenlijk liever een andere dag. Kan het vrijdag?","en":"Actually I'd rather another day. Is Friday possible?"},{"sp":"A","nl":"Vrijdag ga ik naar mijn ouders. Zaterdag dan?","en":"On Friday I go to my parents. Saturday then?"},{"sp":"B","nl":"Ja, zaterdag is goed. Rond twee uur?","en":"Yes, Saturday is good. Around two o'clock?"},{"sp":"A","nl":"Perfect. Ik zet het in mijn agenda.","en":"Perfect. I'll put it in my agenda."},{"sp":"B","nl":"Top, tot zaterdag!","en":"Great, see you Saturday!"}],"tip":"Klemtoon op de dag en de tijd: *don*derdag, *za*terdag, *twee* uur. Bij 'Oh, dat is *jam*mer' laat je de stem dalen. Bij het voorstel 'Zaterdag dan?' gaat de stem omhoog.","id":"sd7-4ee46fd7"},{"t":"dlg","title":"Wat staat er in je agenda?","sit":"Twee collega's bekijken samen hun week.","lines":[{"sp":"A","nl":"Heb jij volgende week tijd voor een vergadering?","en":"Do you have time next week for a meeting?"},{"sp":"B","nl":"Even kijken in mijn agenda. Maandag ben ik er niet.","en":"Let me look in my agenda. On Monday I'm not here."},{"sp":"A","nl":"Dinsdag dan?","en":"Tuesday then?"},{"sp":"B","nl":"Dinsdag heb ik om tien uur een afspraak, maar daarna ben ik vrij.","en":"On Tuesday I have an appointment at ten, but after that I'm free."},{"sp":"A","nl":"Dan zeg ik kwart over twaalf, na de lunch.","en":"Then I'll say quarter past twelve, after lunch."},{"sp":"B","nl":"Hoe lang duurt het?","en":"How long does it take?"},{"sp":"A","nl":"Een uur, denk ik. Tot kwart over één.","en":"An hour, I think. Until quarter past one."},{"sp":"B","nl":"Prima. Stuur je een uitnodiging?","en":"Fine. Will you send an invitation?"},{"sp":"A","nl":"Ja, dat doe ik nu meteen.","en":"Yes, I'll do that right now."},{"sp":"B","nl":"Dank je, dan zie ik je dinsdag.","en":"Thank you, then I'll see you Tuesday."}],"tip":"Tijden: *kwart* over *twaalf*, *kwart* over *één*. Zeg ze in een vloeiende zin. Lees ze eerst langzaam en daarna sneller.","id":"sd7-6308d46c"}]}]},{"id":"sd8","title":"Spreken: gezondheid","rule":"- Zeg wat er is: **Ik heb hoofdpijn / keelpijn / koorts.**\n- Gebruik **Hoe lang al?** en **Sinds gisteren** voor de tijd.\n- Wees duidelijk bij de apotheek: **Hoe vaak moet ik dit nemen?**\n- Vraag om herhaling als je iets niet begrijpt: **Kunt u dat nog een keer zeggen?**","group":"Spreken","sets":[{"instr":"Lees de dialogen hardop. Speel daarna beide rollen.","hint":"","items":[{"t":"dlg","title":"Bij de huisarts","sit":"Je hebt al drie dagen last van je keel en gaat naar de huisarts.","lines":[{"sp":"A","nl":"Goedemorgen, wat is er aan de hand?","en":"Good morning, what's the matter?"},{"sp":"B","nl":"Ik heb al drie dagen keelpijn en ik voel me ziek.","en":"I have had a sore throat for three days and I feel ill."},{"sp":"A","nl":"Hebt u ook koorts gehad?","en":"Have you also had a fever?"},{"sp":"B","nl":"Gisteravond had ik achtendertig graden.","en":"Last night I had thirty-eight degrees."},{"sp":"A","nl":"Doet het pijn als u slikt?","en":"Does it hurt when you swallow?"},{"sp":"B","nl":"Ja, vooral 's morgens. En ik hoest een beetje.","en":"Yes, especially in the morning. And I cough a bit."},{"sp":"A","nl":"Ik kijk even in uw keel. Mond open, alstublieft.","en":"I'll take a look at your throat. Open your mouth, please."},{"sp":"B","nl":"Aaa. Is het ernstig?","en":"Aaah. Is it serious?"},{"sp":"A","nl":"Nee, het is een gewone verkoudheid. Rust goed uit en drink veel thee.","en":"No, it's an ordinary cold. Rest well and drink a lot of tea."},{"sp":"B","nl":"Dank u wel, dokter.","en":"Thank you, doctor."}],"tip":"Klemtoon: *keel*pijn, *koorts*, ver*kou*dheid. Bij de vraag 'Is het *ern*stig?' gaat je stem omhoog en klink je bezorgd.","id":"sd8-5e802fe0"},{"t":"dlg","title":"Bij de apotheek","sit":"Je haalt medicijnen bij de apotheek.","lines":[{"sp":"A","nl":"Goedemiddag, ik kom mijn recept ophalen.","en":"Good afternoon, I've come to pick up my prescription."},{"sp":"B","nl":"Wat is uw naam en geboortedatum?","en":"What is your name and date of birth?"},{"sp":"A","nl":"Ik ben Tim de Vries, geboren op drie maart tweeduizend.","en":"I am Tim de Vries, born on the third of March two thousand."},{"sp":"B","nl":"Dank u. Hier zijn uw tabletten.","en":"Thank you. Here are your tablets."},{"sp":"A","nl":"Hoe vaak moet ik die nemen?","en":"How often do I have to take them?"},{"sp":"B","nl":"Drie keer per dag, na het eten, met een glas water.","en":"Three times a day, after eating, with a glass of water."},{"sp":"A","nl":"En hoe lang moet ik ze nemen?","en":"And how long do I have to take them?"},{"sp":"B","nl":"Een week. En heeft u een allergie?","en":"A week. And do you have an allergy?"},{"sp":"A","nl":"Nee, gelukkig niet.","en":"No, luckily not."},{"sp":"B","nl":"Goed. Beterschap, meneer De Vries!","en":"Good. Get well soon, Mr. De Vries!"}],"tip":"Klemtoon bij getallen en tijd: *drie* keer per *dag*, na het *e*ten. Bij '*Be*terschap' ligt de klemtoon op 'be'. Zeg het warm en vriendelijk.","id":"sd8-fd426ec6"},{"t":"dlg","title":"Naar de kapper","sit":"Je bent bij de kapper voor een nieuw kapsel.","lines":[{"sp":"A","nl":"Hoi, heb je een afspraak?","en":"Hi, do you have an appointment?"},{"sp":"B","nl":"Ja, om vier uur, op naam van Noor.","en":"Yes, at four o'clock, in the name of Noor."},{"sp":"A","nl":"Kom maar zitten. Wat wil je laten doen?","en":"Come and sit down. What would you like done?"},{"sp":"B","nl":"Ik wil mijn haar korter. Ongeveer drie centimeter eraf.","en":"I'd like my hair shorter. About three centimetres off."},{"sp":"A","nl":"En de pony ook?","en":"And the fringe too?"},{"sp":"B","nl":"Nee, die laat ik zo. Mijn nek doet pijn, dus ik wil liever niet lang zitten.","en":"No, I'll leave that as it is. My neck hurts, so I'd rather not sit long."},{"sp":"A","nl":"Geen probleem, ik ben snel. Eerst even je haar wassen.","en":"No problem, I'm quick. First I'll wash your hair."},{"sp":"B","nl":"Prima. Is het water niet te warm?","en":"Fine. Isn't the water too warm?"},{"sp":"A","nl":"Zo goed? Zo, klaar. Wat vind je ervan?","en":"Good like this? There, done. What do you think of it?"},{"sp":"B","nl":"Mooi! Wat kost het?","en":"Lovely! What does it cost?"}],"tip":"Klemtoon op de wensen: ik wil mijn haar *kor*ter, *drie* centi*me*ter eraf. Bij de vraag 'Wat vind je *er*van?' gaat de stem omhoog.","id":"sd8-eff2f019"}]}]},{"id":"sd9","title":"Spreken: werk, hobby's en vrije tijd","rule":"- Vertel kort en concreet: **Ik werk bij een bank. Ik sport graag.**\n- Gebruik graag, soms, vaak, nooit: ze geven kleur aan je zin.\n- Een uitnodiging: **Heb je zin om mee te gaan?** / **Wil je ... komen?**\n- Reageer vriendelijk: **Leuk!** / **Helaas kan ik niet.**","group":"Spreken","sets":[{"instr":"Lees de dialogen hardop. Speel daarna beide rollen.","hint":"","items":[{"t":"dlg","title":"Praten met een collega","sit":"Het is pauze en je praat met een nieuwe collega.","lines":[{"sp":"A","nl":"Hoi, ik ben Kees. Werk jij ook op de afdeling verkoop?","en":"Hi, I'm Kees. Do you also work in the sales department?"},{"sp":"B","nl":"Ja, sinds twee weken. Ik ben Mira.","en":"Yes, for two weeks now. I'm Mira."},{"sp":"A","nl":"Leuk! Hoe bevalt het werk tot nu toe?","en":"Nice! How do you like the work so far?"},{"sp":"B","nl":"Goed, de collega's zijn aardig. Alleen de vergaderingen zijn lang.","en":"Good, the colleagues are nice. Only the meetings are long."},{"sp":"A","nl":"Ja, dat klopt. Ga je mee lunchen?","en":"Yes, that's true. Are you coming for lunch?"},{"sp":"B","nl":"Graag, ik heb mijn brood al op. Waar eten jullie meestal?","en":"Gladly, I've already eaten my sandwich. Where do you usually eat?"},{"sp":"A","nl":"Meestal in de kantine, soms in het park.","en":"Usually in the canteen, sometimes in the park."},{"sp":"B","nl":"Het weer is mooi vandaag, dus het park lijkt me leuk.","en":"The weather is nice today, so the park sounds good to me."},{"sp":"A","nl":"Prima. Ik pak even mijn jas.","en":"Fine. I'll just grab my coat."},{"sp":"B","nl":"Oké, ik wacht hier.","en":"Okay, I'll wait here."}],"tip":"Klemtoon: col*le*ga's, ver*ga*dering, kan*ti*ne. Spreek 'Leuk!' enthousiast uit, met een hoge toon aan het begin.","id":"sd9-495583c2"},{"t":"dlg","title":"Sport en hobby's","sit":"Twee vrienden praten over wat ze in hun vrije tijd doen.","lines":[{"sp":"A","nl":"Wat doe je eigenlijk in je vrije tijd?","en":"What do you actually do in your free time?"},{"sp":"B","nl":"Ik voetbal op zaterdag en ik fiets veel. En jij?","en":"I play football on Saturday and I cycle a lot. And you?"},{"sp":"A","nl":"Ik zwem twee keer per week en ik lees graag.","en":"I swim twice a week and I like to read."},{"sp":"B","nl":"Wat lees je nu?","en":"What are you reading now?"},{"sp":"A","nl":"Een Nederlandse roman. Het is nog wat moeilijk, maar leuk.","en":"A Dutch novel. It is still a bit difficult, but fun."},{"sp":"B","nl":"Dat is goed voor je Nederlands! Kook je ook graag?","en":"That's good for your Dutch! Do you like cooking too?"},{"sp":"A","nl":"Nee, dat vind ik niet leuk. Ik eet liever buiten de deur.","en":"No, I don't like that. I'd rather eat out."},{"sp":"B","nl":"Dan moeten we een keer samen uit eten.","en":"Then we should go out for dinner together sometime."},{"sp":"A","nl":"Goed idee! Wanneer heb jij tijd?","en":"Good idea! When do you have time?"},{"sp":"B","nl":"Volgende week woensdag, bijvoorbeeld.","en":"Next Wednesday, for example."}],"tip":"Klemtoon op de activiteit: ik *zwem* twee keer per *week*, ik *lees* graag. Bij 'Goed i*dee*!' kies je een vrolijke, hoge toon.","id":"sd9-9670f0b4"},{"t":"dlg","title":"Iemand uitnodigen","sit":"Je nodigt een buurvrouw uit voor het weekend.","lines":[{"sp":"A","nl":"Hallo Anja, heb je zin om zaterdag bij ons te komen eten?","en":"Hello Anja, do you feel like coming to eat at our place on Saturday?"},{"sp":"B","nl":"Wat leuk! Hoe laat?","en":"How nice! What time?"},{"sp":"A","nl":"Rond zes uur. We maken soep en pasta.","en":"Around six o'clock. We're making soup and pasta."},{"sp":"B","nl":"Heerlijk! Mag ik iets meenemen?","en":"Lovely! May I bring something?"},{"sp":"A","nl":"Een dessert, als je wilt. Maar het hoeft niet.","en":"A dessert, if you like. But it isn't necessary."},{"sp":"B","nl":"Ik maak appeltaart. Mijn zoon komt ook mee, is dat goed?","en":"I'll make apple pie. My son is coming along too, is that okay?"},{"sp":"A","nl":"Natuurlijk, hij is welkom. Houdt hij van soep?","en":"Of course, he is welcome. Does he like soup?"},{"sp":"B","nl":"Ja hoor, hij eet alles.","en":"Yes sure, he eats everything."},{"sp":"A","nl":"Dan zie ik jullie zaterdag. Ik stuur mijn adres even.","en":"Then I'll see you Saturday. I'll send you my address."},{"sp":"B","nl":"Super, tot zaterdag!","en":"Great, see you Saturday!"}],"tip":"Uitnodigen klinkt vriendelijk als je stem omhoog en omlaag beweegt. Klemtoon: heb je *zin* om te *ko*men *e*ten? Bij 'Wat *leuk*!' is de toon hoog.","id":"sd9-5d5a2c82"}]}]},{"id":"sd10","title":"Spreken: weer, vakantie, verleden en regelzaken","rule":"- In een gesprek over gisteren gebruik je vaak het perfectum: **Ik heb gewerkt. Ik ben naar Utrecht gegaan.**\n- Vraag: **Wat heb je gedaan?** / **Waar ben je geweest?**\n- Bij de bank, de post of de gemeente: **Ik wil graag ...** en **Heeft u een afspraak nodig?**\n- Klemtoon op de belangrijkste informatie: *wat* je deed en *waar*.","group":"Spreken","sets":[{"instr":"Lees de dialogen hardop. Speel daarna beide rollen.","hint":"","items":[{"t":"dlg","title":"Over het weer","sit":"Twee buren praten buiten over het weer.","lines":[{"sp":"A","nl":"Goedemorgen! Wat een mooi weer vandaag, hè?","en":"Good morning! What nice weather today, isn't it?"},{"sp":"B","nl":"Ja, heerlijk. Gisteren heeft het de hele dag geregend.","en":"Yes, lovely. Yesterday it rained the whole day."},{"sp":"A","nl":"Dat klopt. Ik ben helemaal nat geworden op mijn fiets.","en":"That's right. I got completely wet on my bike."},{"sp":"B","nl":"Wat vervelend! Heb je geen regenjas?","en":"How annoying! Don't you have a raincoat?"},{"sp":"A","nl":"Jawel, maar ik heb hem thuis laten liggen.","en":"I do, but I left it at home."},{"sp":"B","nl":"Morgen wordt het zonnig, zegt de weerman.","en":"Tomorrow it will be sunny, says the weatherman."},{"sp":"A","nl":"Gelukkig. Hoeveel graden wordt het?","en":"Luckily. How many degrees will it be?"},{"sp":"B","nl":"Ongeveer twintig, maar 's avonds is het koud.","en":"About twenty, but in the evening it's cold."},{"sp":"A","nl":"Dan ga ik morgen lekker naar het park.","en":"Then tomorrow I'll go to the park."},{"sp":"B","nl":"Veel plezier, en een fijne dag nog!","en":"Have fun, and have a nice day!"}],"tip":"Klemtoon: *mooi* weer, ge*reg*end, *zon*nig. Als je vraagt 'hè?', gaat de stem aan het eind omhoog, zoals in 'Wat een mooi weer, hè?'","id":"sd10-36904a2a"},{"t":"dlg","title":"Wat heb je gedaan?","sit":"Na de vakantie praten twee collega's over wat ze hebben gedaan.","lines":[{"sp":"A","nl":"Welkom terug! Hoe was je vakantie?","en":"Welcome back! How was your holiday?"},{"sp":"B","nl":"Heel fijn, dank je. Ik ben twee weken in Spanje geweest.","en":"Very nice, thanks. I was in Spain for two weeks."},{"sp":"A","nl":"Wat heb je daar gedaan?","en":"What did you do there?"},{"sp":"B","nl":"We hebben veel gezwommen en we hebben lekker gegeten.","en":"We swam a lot and we ate well."},{"sp":"A","nl":"Hebben jullie ook iets bezocht?","en":"Did you visit anything too?"},{"sp":"B","nl":"Ja, we hebben een oud kasteel gezien en we hebben veel foto's gemaakt.","en":"Yes, we saw an old castle and we took a lot of photos."},{"sp":"A","nl":"Klinkt geweldig. Hoe zijn jullie gereisd?","en":"Sounds great. How did you travel?"},{"sp":"B","nl":"We zijn met het vliegtuig gegaan en daarna met de trein.","en":"We went by plane and then by train."},{"sp":"A","nl":"Was het weer goed?","en":"Was the weather good?"},{"sp":"B","nl":"Prima, het was elke dag zonnig. En jij, waar ben jij geweest?","en":"Great, it was sunny every day. And you, where were you?"}],"tip":"Bij het perfectum ligt de klemtoon op het voltooid deelwoord: we hebben veel ge*zwom*men, we hebben lekker ge*e*ten. Bij vragen met 'wat' of 'waar' gaat de stem aan het eind omlaag.","id":"sd10-a8ef4f39"},{"t":"dlg","title":"Bij de bank, de post en de gemeente","sit":"Je regelt een paar dingen in één ochtend.","lines":[{"sp":"A","nl":"Goedemorgen, ik wil graag een pakje versturen naar Duitsland.","en":"Good morning, I would like to send a parcel to Germany."},{"sp":"B","nl":"Zet het maar op de weegschaal. Het kost zes euro vijftig.","en":"Just put it on the scale. It costs six euros fifty."},{"sp":"A","nl":"Prima. Mag ik ook een postzegel voor deze brief?","en":"Fine. May I also have a stamp for this letter?"},{"sp":"B","nl":"Alstublieft. Is dat alles?","en":"Here you are. Is that all?"},{"sp":"A","nl":"Ja, dank u. Weet u waar de bank is?","en":"Yes, thank you. Do you know where the bank is?"},{"sp":"B","nl":"Aan de overkant, naast de bakker.","en":"Across the road, next to the baker."},{"sp":"A","nl":"Goedemorgen, ik wil graag een rekening openen.","en":"Good morning, I would like to open an account."},{"sp":"B","nl":"Heeft u uw paspoort en een bewijs van inschrijving bij de gemeente?","en":"Do you have your passport and proof of registration with the municipality?"},{"sp":"A","nl":"Ja, hier zijn ze. Wanneer krijg ik mijn pinpas?","en":"Yes, here they are. When do I get my debit card?"},{"sp":"B","nl":"Binnen vijf werkdagen, per post.","en":"Within five working days, by post."}],"tip":"Klemtoon: een *pak*je naar *Duits*land, een *re*kening openen, een *pas*poort. Spreek de bedragen en de tijd duidelijk uit: *zes* euro *vijf*tig, *vijf* werkdagen.","id":"sd10-8cb6d511"}]}]},{"id":"ss1","title":"Shadowing: klanken & klemtoon","rule":"**Hoe lees je de sterretjes?** Wat tussen asterisken staat, is het beklemtoonde deel: zeg dat harder, langer en iets hoger. (Stress marking: the part between asterisks is the stressed syllable.)\n- Voorbeeld: Ik *woon* in Amster*dam*. (I live in Amsterdam.)\n- Meerdere lettergrepen: het sterretje staat om de beklemtoonde lettergreep: *ta*fel, ge*zel*lig.\n- Niet-beklemtoonde stukken, zoals -en en -e, zijn kort en zacht (bijna \"uh\").\n- Samengestelde woorden: klemtoon meestal op het eerste deel: *fiets*pad, *zie*kenhuis.\n- Scheidbare werkwoorden: klemtoon op het voorvoegsel: *op*staan, *aan*komen.\n- Shadowing: luister, en zeg direct hardop mee op dezelfde snelheid en met dezelfde melodie.","group":"Spreken","sets":[{"instr":"Luister en zeg direct mee. Let op lange en korte klinkers.","hint":"Lange klinkers (aa, ee, oo, uu) zijn echt lang; korte klinkers (a, e, i, o, u) zijn kort en scherp.","items":[{"t":"sh","title":"Lange en korte klinkers","lines":[{"nl":"De *maan* schijnt vanavond.","en":"The moon is shining tonight."},{"nl":"Mijn *man* werkt vandaag.","en":"My husband is working today."},{"nl":"Ik *eet* graag *vis*.","en":"I like eating fish."},{"nl":"Hij *koopt* een *kop* koffie.","en":"He buys a cup of coffee."},{"nl":"Het *boek* ligt op de *ta*fel.","en":"The book is on the table."},{"nl":"Wij *zien* de *zon*.","en":"We see the sun."},{"nl":"Ik *laat* de *kat* binnen.","en":"I let the cat in."},{"nl":"De *bus* is te *laat*.","en":"The bus is too late."},{"nl":"Zij heeft een *hek* om de tuin.","en":"She has a fence around the garden."},{"nl":"Ik loop naar de *lucht*haven.","en":"I walk to the airport."}],"tip":"Maak lange klinkers echt lang (maan, eet, koopt) en korte klinkers kort en scherp (man, kat, kop).","id":"ss1-70d6b115"}]},{"instr":"Luister en zeg direct mee. Let op de tweeklanken.","hint":"ui, eu, ij/ei en au/ou glijden van de ene klank naar de andere; ze zijn geen enkele klinkers.","items":[{"t":"sh","title":"Tweeklanken: ui, eu, ij, ei, au, ou","lines":[{"nl":"Ik woon in een *huis* met een *tuin*.","en":"I live in a house with a garden."},{"nl":"Wat een *leuk* *huis*!","en":"What a nice house!"},{"nl":"Op *vrij*dag ben ik *vrij*.","en":"On Friday I am free."},{"nl":"Het *ei* is nog *rauw*.","en":"The egg is still raw."},{"nl":"Ik heb *pijn* in mijn *keel*.","en":"I have a pain in my throat."},{"nl":"Het is *koud* en het *re*gent.","en":"It is cold and it is raining."},{"nl":"Ik *houd* van *bruin* brood.","en":"I like brown bread."},{"nl":"Mijn *au*to is *blauw*.","en":"My car is blue."},{"nl":"Hij is *blij* met zijn *fiets*.","en":"He is happy with his bike."},{"nl":"De *mouw* van mijn jas is nat.","en":"The sleeve of my coat is wet."}],"tip":"ui is geen 'ow' en geen 'oy': ronde lippen, begin als 'eu' en glijd naar 'uu'. ij/ei klinken hetzelfde.","id":"ss1-6728a08a"}]},{"instr":"Luister en zeg direct mee. Let op g, ch, sch en r.","hint":"De g en ch komen diep uit de keel, met wrijving. Bij sch spreek je s + ch uit.","items":[{"t":"sh","title":"g, ch, sch en r","lines":[{"nl":"Ik *ga* *graag* naar *Gro*ningen.","en":"I like going to Groningen."},{"nl":"Het *gras* is *groen*.","en":"The grass is green."},{"nl":"Ik *lach* om een *grap*.","en":"I laugh at a joke."},{"nl":"Mijn *doch*ter is *acht*.","en":"My daughter is eight."},{"nl":"Ik *zoek* de *school*.","en":"I am looking for the school."},{"nl":"Het *school*plein is *schoon*.","en":"The schoolyard is clean."},{"nl":"Hij *schrijft* een *brief*.","en":"He is writing a letter."},{"nl":"Ik *rij* *graag* in de *re*gen.","en":"I like riding in the rain."},{"nl":"*Rob* *rent* *rond* het *park*.","en":"Rob runs around the park."},{"nl":"Mijn *broer* heeft *drie* *ker*sen.","en":"My brother has three cherries."}],"tip":"g en ch zijn niet zo hard als in het Duits, maar wel met wrijving. De Nederlandse r mag voorin (rollend) of achterin (keel) klinken.","id":"ss1-98c743cc"}]},{"instr":"Luister en zeg direct mee. Let op de zachte -en en -e en op d/t.","hint":"In -en en -e is de klinker
