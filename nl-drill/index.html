bijna 'uh' en de n valt vaak weg. Een d aan het einde klinkt als een t.","items":[{"t":"sh","title":"Zachte -en, -e en eind-d","lines":[{"nl":"Wij *e*ten *brood* met *kaas*.","en":"We eat bread with cheese."},{"nl":"De *bo*men *staan* in de *tuin*.","en":"The trees are in the garden."},{"nl":"Mijn *vrien*den *ko*men *mor*gen.","en":"My friends are coming tomorrow."},{"nl":"Een *gro*te *ta*fel en een *klei*ne *stoel*.","en":"A big table and a small chair."},{"nl":"De *kin*deren *spe*len *bui*ten.","en":"The children are playing outside."},{"nl":"Ik heb een *hond* en een *kat*.","en":"I have a dog and a cat."},{"nl":"Het *land* is *plat*.","en":"The land is flat."},{"nl":"Dat is een *goed* *boek*.","en":"That is a good book."},{"nl":"Mijn *bed* staat *naast* het *raam*.","en":"My bed is next to the window."}],"tip":"Zeg -en en -e kort en zacht: 'bo-muh', 'gro-tuh'. Hond, land, goed en bed eindigen op een t-klank.","id":"ss1-aea3191f"}]},{"instr":"Luister en zeg direct mee. Let op de klemtoon in samengestelde en scheidbare werkwoorden.","hint":"Samengesteld woord: meestal klemtoon op het eerste deel. Scheidbaar werkwoord: klemtoon op het voorvoegsel.","items":[{"t":"sh","title":"Klemtoon in samengestelde woorden en scheidbare werkwoorden","lines":[{"nl":"Ik ga naar het *zie*kenhuis.","en":"I am going to the hospital."},{"nl":"Het *trein*station is dichtbij.","en":"The train station is nearby."},{"nl":"Mijn *fiets*sleutel is weg.","en":"My bike key is gone."},{"nl":"Zij werkt in een *kle*renwinkel.","en":"She works in a clothes shop."},{"nl":"Ik sta om zeven uur *op*.","en":"I get up at seven o'clock."},{"nl":"Ik bel je morgen *op*.","en":"I'll call you tomorrow."},{"nl":"De trein komt om tien over drie *aan*.","en":"The train arrives at ten past three."},{"nl":"Wij doen het licht *uit*.","en":"We turn off the light."},{"nl":"Zij doet de deur *o*pen.","en":"She opens the door."},{"nl":"Ik neem een boek *mee*.","en":"I take a book with me."}],"tip":"In een scheidbaar werkwoord hoor je het voorvoegsel duidelijk: *op*, *aan*, *uit*, *mee*. In een samenstelling hoor je het eerste deel: *fiets*sleutel.","id":"ss1-6a3ab868"}]},{"instr":"Luister en zeg direct mee. Let op de minimale paren.","hint":"Eén klinker verandert de betekenis. Maak het verschil duidelijk hoorbaar.","items":[{"t":"sh","title":"Minimale paren: korte en lange klinker","lines":[{"nl":"Ik wil niets *zeg*gen.","en":"I don't want to say anything."},{"nl":"Die hulp is een *ze*gen.","en":"That help is a blessing."},{"nl":"Mijn *man* is thuis.","en":"My husband is at home."},{"nl":"De *maan* is mooi.","en":"The moon is beautiful."},{"nl":"Er ligt een *tak* in de tuin.","en":"There is a branch in the garden."},{"nl":"Dit is een moeilijke *taak*.","en":"This is a difficult task."},{"nl":"Zij draagt een *rok*.","en":"She is wearing a skirt."},{"nl":"Ik *rook* niet.","en":"I don't smoke."},{"nl":"Ik ben niet *boos*.","en":"I am not angry."},{"nl":"Er is een *bos* achter het huis.","en":"There is a forest behind the house."}],"tip":"zeggen (korte e) en zegen (lange e); tak en taak verschillen in de klinker. Zeg zo duidelijk mogelijk.","id":"ss1-d8f4f0db"}]}]},{"id":"ss2","title":"Shadowing: zinsmelodie & zinsklemtoon","rule":"**Zinsmelodie** (intonation): de stem beweegt over de hele zin.\n- Mededeling: de stem zakt aan het einde. Ik woon in *Ut*recht. (↘)\n- Ja/nee-vraag: de stem stijgt aan het einde. Woon je in *Ut*recht? (↗)\n- Vraagwoord-vraag (wie, wat, waar...): meestal dalend. *Waar* woon je? (↘)\n- Opsomming: stijgend bij elk item, dalend bij het laatste: *brood*, *kaas* en *melk*.\n- Zinsklemtoon: *niet* en *geen* krijgen vaak nadruk; de belangrijkste informatie wordt het sterkst benadrukt.\n- Sterretjes *…* tonen waar de nadruk ligt. (Asterisks mark the stressed syllable or word.)","group":"Spreken","sets":[{"instr":"Luister en zeg direct mee. Let op het verschil tussen mededeling en vraag.","hint":"Mededeling: stem omlaag aan het einde. Vraag: stem omhoog.","items":[{"t":"sh","title":"Mededeling en vraag","lines":[{"nl":"Ik *woon* in Utrecht.","en":"I live in Utrecht."},{"nl":"Woon jij ook in *Ut*recht?","en":"Do you also live in Utrecht?"},{"nl":"Het is *koud* buiten.","en":"It is cold outside."},{"nl":"Is het *koud* buiten?","en":"Is it cold outside?"},{"nl":"Je hebt *dorst*.","en":"You are thirsty."},{"nl":"Heb je *dorst*?","en":"Are you thirsty?"},{"nl":"Hij komt van*daag*.","en":"He is coming today."},{"nl":"Komt hij van*daag*?","en":"Is he coming today?"},{"nl":"Dat is jouw *fiets*.","en":"That is your bike."},{"nl":"Is dat jouw *fiets*?","en":"Is that your bike?"}],"tip":"Zelfde woorden, ander einde: laat de stem zakken bij een mededeling en stijgen bij een vraag.","id":"ss2-ed55ab7c"}]},{"instr":"Luister en zeg direct mee. Let op de stijgende melodie bij ja/nee-vragen.","hint":"Een ja/nee-vraag begint met het werkwoord en eindigt met een stijgende toon.","items":[{"t":"sh","title":"Ja/nee-vragen","lines":[{"nl":"Heb je *hon*ger?","en":"Are you hungry?"},{"nl":"Ben je *moe*?","en":"Are you tired?"},{"nl":"Kun je me *hel*pen?","en":"Can you help me?"},{"nl":"Wil je *thee*?","en":"Do you want tea?"},{"nl":"Woon je in *Rot*terdam?","en":"Do you live in Rotterdam?"},{"nl":"Spreek je *En*gels?","en":"Do you speak English?"},{"nl":"Is de *win*kel *o*pen?","en":"Is the shop open?"},{"nl":"Hebben jullie een *ta*fel *vrij*?","en":"Do you have a table free?"},{"nl":"Mag ik *bin*nenkomen?","en":"May I come in?"}],"tip":"Het werkwoord staat vooraan; de stem gaat omhoog op de laatste beklemtoonde lettergreep.","id":"ss2-c231358f"}]},{"instr":"Luister en zeg direct mee. Let op de dalende melodie bij vraagwoord-vragen.","hint":"Bij wie, wat, waar, wanneer, hoe, waarom en welk valt de stem meestal aan het einde.","items":[{"t":"sh","title":"Vraagwoord-vragen","lines":[{"nl":"*Wie* ben jij?","en":"Who are you?"},{"nl":"*Wat* wil je *drin*ken?","en":"What would you like to drink?"},{"nl":"*Waar* woon je?","en":"Where do you live?"},{"nl":"Wan*neer* begint de *les*?","en":"When does the class start?"},{"nl":"Hoe*veel* *kost* dat?","en":"How much does that cost?"},{"nl":"*Hoe* laat is het?","en":"What time is it?"},{"nl":"Waa*rom* ben je te *laat*?","en":"Why are you late?"},{"nl":"*Welk* boek wil je *le*zen?","en":"Which book do you want to read?"},{"nl":"*Hoe* heet je *zus*?","en":"What is your sister's name?"}],"tip":"Het vraagwoord krijgt de eerste nadruk; de melodie zakt naar het einde van de zin.","id":"ss2-c7b97fff"}]},{"instr":"Luister en zeg direct mee. Let op de melodie bij opsommingen.","hint":"Bij elk item in de lijst gaat de stem een beetje omhoog; bij het laatste item zakt hij.","items":[{"t":"sh","title":"Opsommingen","lines":[{"nl":"Ik koop *brood*, *kaas*, *melk* en *ei*eren.","en":"I buy bread, cheese, milk and eggs."},{"nl":"We hebben *ap*pels, *pe*ren, ba*na*nen en *dui*ven.","en":"We have apples, pears, bananas and grapes."},{"nl":"Zij spreekt *Ne*derlands, *En*gels en *Frans*.","en":"She speaks Dutch, English and French."},{"nl":"Ik *eet*, ik *drink* en ik *slaap*.","en":"I eat, I drink and I sleep."},{"nl":"Ik werk op *maan*dag, *dins*dag en *don*derdag.","en":"I work on Monday, Tuesday and Thursday."},{"nl":"We gaan naar Pa*rijs*, Ber*lijn* en *Ro*me.","en":"We are going to Paris, Berlin and Rome."},{"nl":"Hij heeft een *hond*, een *kat* en twee *vo*gels.","en":"He has a dog, a cat and two birds."},{"nl":"Neem een *jas*, een *muts* en *hand*schoenen mee.","en":"Take a coat, a hat and gloves."},{"nl":"Ik *lees*, ik *kook* en ik *fiets* graag.","en":"I like reading, cooking and cycling."}],"tip":"Houd de lijst vloeiend: omhoog, omhoog, omhoog, en bij het laatste woord omlaag.","id":"ss2-44501478"}]},{"instr":"Luister en zeg direct mee. Let op de nadruk bij niet en geen.","hint":"Niet en geen krijgen vaak extra nadruk, vooral als je iets corrigeert of tegenover iets zet.","items":[{"t":"sh","title":"Nadruk met niet en geen","lines":[{"nl":"Ik heb *geen* tijd.","en":"I have no time."},{"nl":"Ik ben *niet* moe.","en":"I am not tired."},{"nl":"Dat is *niet* mijn *fiets*.","en":"That is not my bike."},{"nl":"Ik heb *geen* hond, ik heb een *kat*.","en":"I don't have a dog, I have a cat."},{"nl":"Hij komt *niet* vandaag, maar *mor*gen.","en":"He is not coming today, but tomorrow."},{"nl":"Ik drink *geen* koffie, ik drink *thee*.","en":"I don't drink coffee, I drink tea."},{"nl":"Wij gaan *niet* naar huis.","en":"We are not going home."},{"nl":"Het is *niet* duur.","en":"It is not expensive."},{"nl":"Zij heeft *geen* kinderen.","en":"She has no children."},{"nl":"Ik woon *niet* in Rotterdam, maar in *Ut*recht.","en":"I don't live in Rotterdam, but in Utrecht."}],"tip":"Zeg niet/geen duidelijk harder; daarna volgt vaak het woord dat je ertegenover zet.","id":"ss2-f038ae68"}]},{"instr":"Luister en zeg direct mee. Let op zinnen met twee werkwoorden.","hint":"Het tweede werkwoord staat achteraan. De nadruk ligt vaak op het laatste inhoudswoord.","items":[{"t":"sh","title":"Hoofdzin met twee werkwoorden","lines":[{"nl":"Ik wil een *kop* koffie *drin*ken.","en":"I want to drink a cup of coffee."},{"nl":"Zij moet *vroeg* *op*staan.","en":"She has to get up early."},{"nl":"Wij gaan morgen *wer*ken.","en":"We are going to work tomorrow."},{"nl":"Hij heeft de *brief* ge*schre*ven.","en":"He has written the letter."},{"nl":"Ik ben naar *school* ge*fiets*t.","en":"I cycled to school."},{"nl":"Je mag hier niet par*ke*ren.","en":"You may not park here."},{"nl":"Zij heeft een *boek* ge*le*zen.","en":"She has read a book."},{"nl":"We willen een *huis* *ko*pen.","en":"We want to buy a house."},{"nl":"Ik kan goed *zwem*men.","en":"I can swim well."}],"tip":"Het eerste werkwoord is kort en zwak; het tweede werkwoord of het object vlak ervoor krijgt de nadruk.","id":"ss2-02894f58"}]}]},{"id":"ss3","title":"Shadowing: alledaagse zinnen","rule":"**Alledaagse zinnen per situatie.** Oefen complete zinnen die je elke dag nodig hebt.\n- Sterretjes *…* tonen de klemtoon: zeg die lettergreep of dat woord het duidelijkst. (Asterisks mark stress.)\n- Let ook op de melodie: mededeling omlaag, ja/nee-vraag omhoog.\n- Zeg de zinnen eerst langzaam, daarna op normaal tempo.\n- Gebruik 'u' bij onbekenden en in winkels; 'je' bij vrienden en collega's.","group":"Spreken","sets":[{"instr":"Luister en zeg direct mee. Situatie: begroeten en kennismaken.","hint":"Gebruik een vriendelijke, open toon.","items":[{"t":"sh","title":"Begroeten en kennismaken","lines":[{"nl":"Goede*mor*gen, hoe *gaat* het?","en":"Good morning, how are you?"},{"nl":"*Goed*, dank je. En *jij*?","en":"Fine, thank you. And you?"},{"nl":"Mag ik me *voor*stellen? Ik *heet* Daan.","en":"May I introduce myself? I'm Daan."},{"nl":"Aange*naam*, ik ben *Fa*tima.","en":"Pleased to meet you, I'm Fatima."},{"nl":"Leuk je te ont*moe*ten!","en":"Nice to meet you!"},{"nl":"Waar *kom* je van*daan*?","en":"Where are you from?"},{"nl":"Ik kom uit *Spa*nje.","en":"I come from Spain."},{"nl":"*Wel*kom in *Ne*derland!","en":"Welcome to the Netherlands!"},{"nl":"Tot *straks*!","en":"See you later!"},{"nl":"Fijne *dag* nog!","en":"Have a nice day!"}],"tip":"Hoge, vriendelijke toon bij het begroeten; de naam krijgt altijd nadruk.","id":"ss3-095e44e8"}]},{"instr":"Luister en zeg direct mee. Situatie: winkel en café.","hint":"Beleefde vragen met 'mag ik', 'kan ik' en 'graag'.","items":[{"t":"sh","title":"In de winkel en het café","lines":[{"nl":"Kan ik u *hel*pen?","en":"Can I help you?"},{"nl":"Ik *zoek* een *tas*.","en":"I am looking for a bag."},{"nl":"Wat *kost* dit?","en":"What does this cost?"},{"nl":"Mag ik *pin*nen?","en":"May I pay by card?"},{"nl":"Hebt u ook een *an*dere *maat*?","en":"Do you also have another size?"},{"nl":"Ik *neem* het.","en":"I'll take it."},{"nl":"Een *kop*je koffie, alstu*blieft*.","en":"A cup of coffee, please."},{"nl":"Mag ik de *re*kening?","en":"May I have the bill?"},{"nl":"Hebt u een *ta*fel voor *twee*?","en":"Do you have a table for two?"},{"nl":"Ik neem een *brood*je kaas.","en":"I'll have a cheese sandwich."}],"tip":"Zeg 'alstublieft' en 'graag' met een vriendelijke, stijgende of vlakke toon.","id":"ss3-e7c82fab"}]},{"instr":"Luister en zeg direct mee. Situatie: bij de dokter.","hint":"Zeg wat je voelt; de klacht krijgt de nadruk.","items":[{"t":"sh","title":"Bij de dokter en de apotheek","lines":[{"nl":"Ik heb *pijn* in mijn *rug*.","en":"I have a pain in my back."},{"nl":"Ik voel me niet *goed*.","en":"I don't feel well."},{"nl":"Ik heb *koorts* en ik *hoest*.","en":"I have a fever and I cough."},{"nl":"Hoe *lang* heeft u al *last*?","en":"How long have you had trouble?"},{"nl":"Sinds *gis*teren.","en":"Since yesterday."},{"nl":"U moet *rust* nemen.","en":"You must rest."},{"nl":"Neem er *twee* per *dag*.","en":"Take two a day."},{"nl":"Ik maak een af*spraak*.","en":"I'll make an appointment."},{"nl":"Heeft u een re*cept*?","en":"Do you have a prescription?"},{"nl":"Ik haal mijn *pil*len bij de apo*theek*.","en":"I pick up my pills at the pharmacy."}],"tip":"De klacht (pijn, koorts, hoest) is het belangrijkste woord: zeg het met nadruk.","id":"ss3-c43992a1"}]},{"instr":"Luister en zeg direct mee. Situatie: vervoer.","hint":"Korte, duidelijke vragen op het station en in de bus.","items":[{"t":"sh","title":"Trein, bus en fiets","lines":[{"nl":"Van welk *spoor* vertrekt de *trein*?","en":"From which platform does the train leave?"},{"nl":"Een *kaar*tje naar *Zwol*le, alstu*blieft*.","en":"A ticket to Zwolle, please."},{"nl":"Wanneer ver*trekt* de *vol*gende *trein*?","en":"When does the next train leave?"},{"nl":"De trein heeft ver*tra*ging.","en":"The train is delayed."},{"nl":"Ik moet in *Ut*recht *o*verstappen.","en":"I have to change in Utrecht."},{"nl":"Is deze *plek* *vrij*?","en":"Is this seat free?"},{"nl":"Waar is de *hal*te?","en":"Where is the stop?"},{"nl":"Ik *fiets* naar mijn *werk*.","en":"I cycle to my work."},{"nl":"Ik *check* in met mijn *kaart*.","en":"I check in with my card."},{"nl":"Dit is de *laat*ste *hal*te.","en":"This is the last stop."}],"tip":"Let op de scheidbare werkwoorden: *o*verstappen heeft klemtoon op het voorvoegsel.","id":"ss3-1987ac87"}]},{"instr":"Luister en zeg direct mee. Situatie: telefoon, afspraak en uitnodiging.","hint":"Beleefd en duidelijk; let op de stijgende toon bij vragen.","items":[{"t":"sh","title":"Telefoon, afspraak en uitnodiging","lines":[{"nl":"Met *Jan* de *Vries*, goedemiddag.","en":"This is Jan de Vries, good afternoon."},{"nl":"Kan ik *Eva* spreken?","en":"Can I speak to Eva?"},{"nl":"Een *mo*mentje, alstu*blieft*.","en":"One moment, please."},{"nl":"Ik *bel* later nog even.","en":"I'll call again later."},{"nl":"Past *dins*dag u *goed*?","en":"Does Tuesday suit you?"},{"nl":"Dat komt *goed* *uit*.","en":"That suits me fine."},{"nl":"Ik kan he*laas* *niet*.","en":"Unfortunately I can't."},{"nl":"Ik nodig je *uit* voor mijn ver*jaar*dag.","en":"I invite you to my birthday."},{"nl":"Leuk, ik *kom* graag!","en":"Nice, I'd love to come!"},{"nl":"Tot *za*terdag!","en":"See you Saturday!"}],"tip":"Bij een afspraak krijgen de dag en de tijd de nadruk. 'Helaas niet' klinkt vriendelijk als je de stem laat zakken.","id":"ss3-ff2f3b4a"}]},{"instr":"Luister en zeg direct mee. Situatie: tijd en getallen.","hint":"Getallen en tijdstippen duidelijk en met nadruk uitspreken.","items":[{"t":"sh","title":"Tijd en getallen","lines":[{"nl":"Hoe *laat* is het?","en":"What time is it?"},{"nl":"Het is *half* *drie*.","en":"It is half past two."},{"nl":"Het is *kwart* over *vier*.","en":"It is a quarter past four."},{"nl":"Ik sta om *half* *zeven* op.","en":"I get up at half past six."},{"nl":"Dat is *vijf*tien *eu*ro.","en":"That is fifteen euros."},{"nl":"Mijn *huis*nummer is *veer*tien.","en":"My house number is fourteen."},{"nl":"Ik kom om *tien* over *twee*.","en":"I come at ten past two."},{"nl":"We zien elkaar om *kwart* voor *acht*.","en":"We'll meet at a quarter to eight."},{"nl":"Het is *maan*dag *vijf*tien *mei*.","en":"It is Monday <script>
(function(){
"use strict";
var D=window.DRILLS||{grammar:[],writing:[],speaking:[]};
var KEY="nl-oefenboek-v1";
var TABS=[["grammar","Grammatica"],["writing","Schrijven"],["speaking","Spreken"],["progress","Voortgang"]];
var GRADED={fill:1,mc:1,fix:1,tr:1,order:1};

/* ---------- storage ---------- */
var mem=null;
function load(){try{var r=localStorage.getItem(KEY);if(r)return JSON.parse(r)}catch(e){}return mem||{p:{},ui:{}}}
var S=load(); S.p=S.p||{}; S.ui=S.ui||{}; S.ui.units=S.ui.units||{};
var saveT=null;
function flush(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
window.addEventListener("pagehide",flush);document.addEventListener("visibilitychange",function(){if(document.hidden)flush()});
function save(){mem=S;clearTimeout(saveT);saveT=setTimeout(function(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}},250)}
var P=S.p, UI=S.ui;
if(!UI.tab)UI.tab="grammar";
var filter="all", transient={ord:{},hide:{},en:{}}, MIX=null, resetArm=false;

/* ---------- index ---------- */
var IDX={};
["grammar","writing","speaking"].forEach(function(sec){
  D[sec].forEach(function(u){u.sec=sec;var n=0;u.sets.forEach(function(s){s.items.forEach(function(it){n++;it.n0=n;IDX[it.id]={it:it,u:u}})});u.total=n});
});

/* ---------- helpers ---------- */
function esc(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;")}
function fmt(s){
  var t=esc(s).replace(/\*\*(.+?)\*\*/g,"<b>$1</b>").replace(/\*(.+?)\*/g,'<b class="st">$1</b>').replace(/`(.+?)`/g,"<code>$1</code>");
  return t.split("\n").map(function(l){return l.replace(/^- /,"• ")}).join("<br>");
}
function stress(s){return esc(s).replace(/\*(.+?)\*/g,'<b class="st">$1</b>')}
function norm(s,cs){s=String(s||"");if(!cs)s=s.toLowerCase();return s.replace(/[’‘`´]/g,"'").replace(/[.,!?;:"“”()«»…]/g,"").replace(/\s+/g," ").trim()}
function flat(s,cs){return norm(s,cs).normalize("NFD").replace(/[̀-ͯ]/g,"")}
function cmp(user,alts,cs){
  var u=norm(user,cs),f=flat(user,cs);
  if(!u)return 0;
  for(var i=0;i<alts.length;i++)if(norm(alts[i],cs)===u)return 2;
  for(i=0;i<alts.length;i++)if(flat(alts[i],cs)===f)return 1;
  return 0;
}
function rng(str){var h=1779033703^str.length;for(var i=0;i<str.length;i++){h=Math.imul(h^str.charCodeAt(i),3432918353);h=h<<13|h>>>19}
  return function(){h=Math.imul(h^h>>>16,2246822507);h=Math.imul(h^h>>>13,3266489909);h^=h>>>16;return (h>>>0)/4294967296}}
function shuffle(a,r){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(r()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
function $(s,r){return (r||document).querySelector(s)}
function $$(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s))}
function toast(m){var t=$("#toast");t.textContent=m;t.classList.add("show");clearTimeout(toast.t);toast.t=setTimeout(function(){t.classList.remove("show")},3200)}
function isDone(it){
  var s=P[it.id];if(!s)return false;
  if(GRADED[it.t])return s.s==="c";
  if(it.t==="wr")return !!s.done;
  if(it.t==="dlg")return !!(s.t&&s.t[0]&&s.t[1]&&s.t[2]);
  if(it.t==="sh"){return !!s.t&&it.lines.every(function(_,i){return s.t[i]})}
  return false;
}
function isWrong(it){var s=P[it.id];return !!(s&&GRADED[it.t]&&s.s==="w")}
function unitStat(u){var d=0,w=0;u.sets.forEach(function(s){s.items.forEach(function(it){if(isDone(it))d++;else if(isWrong(it))w++})});return {d:d,w:w,t:u.total}}

/* ---------- speech ---------- */
var voice=null, token=0;
function pickVoice(){
  if(!("speechSynthesis" in window))return null;
  var v=speechSynthesis.getVoices();
  for(var i=0;i<v.length;i++)if(/^nl/i.test(v[i].lang))return v[i];
  return null;
}
if("speechSynthesis" in window){speechSynthesis.onvoiceschanged=function(){voice=pickVoice()}}
function speak(text,rate,done){
  if(!("speechSynthesis" in window)){toast("Dit apparaat kan geen spraak afspelen.");if(done)done();return}
  voice=voice||pickVoice();
  if(!voice&&!speak.warned){speak.warned=1;toast("Geen Nederlandse stem gevonden; het geluid kan anders klinken.")}
  var u=new SpeechSynthesisUtterance(text.replace(/\*/g,""));
  u.lang="nl-NL";if(voice)u.voice=voice;u.rate=rate||1;
  u.onend=function(){if(done)done()};u.onerror=function(){if(done)done()};
  speechSynthesis.speak(u);
}
function stopSpeech(){token++;if("speechSynthesis" in window)speechSynthesis.cancel()}
function playLines(lines,hideRole){
  stopSpeech();var my=token,i=0;
  (function next(){
    if(my!==token||i>=lines.length)return;
    var l=lines[i++];
    if(hideRole&&l.sp===hideRole){setTimeout(next,1500+l.nl.split(" ").length*450)}
    else speak(l.nl,1,next);
  })();
}

/* ---------- item rendering ---------- */
function mark(st){
  if(st==="c")return '<div class="res c">✓ Goed</div>';
  if(st==="w")return '<div class="res w">✗ Nog niet</div>';
  return "";
}
function answerText(a){return a.split("|").map(esc).join(" / ")}
function renderFill(it,s){
  var parts=it.p.split("___"),vals=(s&&s.v)||[],locked=s&&s.s,html="";
  if(parts.length===1){
    html+='<p class="p">'+fmt(it.p)+'</p><input class="ans full" data-i="0" autocomplete="off" autocapitalize="off" spellcheck="false" value="'+esc(vals[0]||"")+'"'+(locked?" readonly":"")+'>';
  }else{
    html+='<p class="p">';
    parts.forEach(function(pt,i){
      html+=fmt(pt);
      if(i<parts.length-1)html+='<input class="ans inl" data-i="'+i+'" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="invulvak '+(i+1)+'" value="'+esc(vals[i]||"")+'"'+(locked?" readonly":"")+'>';
    });
    html+="</p>";
  }
  return html;
}
function renderOrder(it,s){
  var words=it.a.split(" "),r=rng(it.id);
  var order=words.map(function(_,i){return i}),sh=shuffle(order,r),k=0;
  while(sh.join()===order.join()&&words.length>1&&k++<5)sh=shuffle(order,r);
  var placed=transient.ord[it.id]||[],locked=s&&s.s;
  var h='<p class="p en">'+fmt(it.p||"Zet de woorden in de goede volgorde.")+'</p>';
  if(locked){h+='<div class="tiles">'+(s.v||"").split(" ").map(function(w){return '<span class="tile" style="cursor:default">'+esc(w)+'</span>'}).join("")+'</div>';return h}
  h+='<div class="tiles" aria-label="jouw zin">'+(placed.length?placed.map(function(i,pos){return '<button class="tile" data-act="untile" data-pos="'+pos+'">'+esc(words[i])+'</button>'}).join(""):'<span class="ph">Tik op de woorden hieronder…</span>')+'</div>';
  h+='<div class="tiles src">'+sh.filter(function(i){return placed.indexOf(i)<0}).map(function(i){return '<button class="tile" data-act="tile" data-i="'+i+'">'+esc(words[i])+'</button>'}).join("")+'</div>';
  return h;
}
function renderMC(it,s){
  var opts=shuffle([it.a].concat(it.o),rng(it.id)),locked=s&&s.s;
  return '<p class="p">'+fmt(it.p)+'</p><div class="opts">'+opts.map(function(o,i){
    var c="opt";if(locked){if(o===it.a)c+=" right";else if(o===s.v)c+=" pick"}
    return '<button class="'+c+'" data-act="mc" data-v="'+esc(o)+'"'+(locked?" disabled":"")+'>'+esc(o)+'</button>'}).join("")+'</div>';
}
function renderWR(it,s){
  s=s||{};var r=s.r||[],d=s.d||"";
  var wc=d.trim()?d.trim().split(/\s+/).length:0;
  var h='<h4 class="tt">'+esc(it.title)+'</h4><p class="p" style="line-height:1.6">'+fmt(it.p)+'</p>';
  h+='<span class="lab">Controleer jezelf</span><ul class="reqs">'+it.reqs.map(function(q,i){return '<li><label><input type="checkbox" data-act="req" data-i="'+i+'"'+(r[i]?" checked":"")+'><span>'+fmt(q)+'</span></label></li>'}).join("")+'</ul>';
  h+='<textarea class="ans" data-act="draft" placeholder="Schrijf hier je tekst…" spellcheck="false">'+esc(d)+'</textarea>';
  h+='<div class="acts"><span class="wc'+(wc>=it.min?" ok":"")+'">'+wc+' / '+it.min+' woorden</span><span style="flex:1"></span><button class="btn sm'+(s.done?" on":"")+'" data-act="done">'+(s.done?"✓ Klaar":"Markeer als klaar")+'</button></div>';
  h+='<details class="mdl"><summary>Voorbeeldtekst (kijk pas na het schrijven)</summary><div class="tx">'+esc(it.model)+'</div></details>';
  return h;
}
function renderDLG(it,s){
  s=s||{};var t=s.t||[],hid=transient.hide[it.id],en=transient.en[it.id];
  var roles=[];it.lines.forEach(function(l){if(roles.indexOf(l.sp)<0)roles.push(l.sp)});
  var h='<h4 class="tt">'+esc(it.title)+'</h4><p class="sit">'+fmt(it.sit)+'</p>';
  h+='<div class="acts" style="margin:0 0 6px"><button class="btn sm pri" data-act="playall">▶ Speel af</button><button class="btn sm" data-act="stop">■ Stop</button>';
  roles.forEach(function(r){h+='<button class="btn sm'+(hid===r?" on":"")+'" data-act="hide" data-v="'+esc(r)+'">Ik ben '+esc(r)+'</button>'});
  h+='<button class="btn sm'+(en?" on":"")+'" data-act="en">EN</button></div>';
  if(hid)h+='<p class="sit" style="margin:2px 0 6px">Jij speelt <b>'+esc(hid)+'</b>: jouw regels zijn verborgen. Na de computerstem krijg je tijd om zelf te antwoorden.</p>';
  h+='<div class="dl">'+it.lines.map(function(l,i){
    var hidden=hid&&l.sp===hid;
    return '<div class="ln'+(hidden?" hid":"")+'"><span class="sp-l">'+esc(l.sp)+'</span><span class="nl">'+(hidden?'<button class="btn sm" data-act="reveal" data-i="'+i+'">toon</button>':esc(l.nl))+'</span><span class="pls"><button class="pl" data-act="play" data-i="'+i+'" aria-label="afspelen">▶</button></span>'+(en?'<span class="en-l">'+esc(l.en)+'</span>':'')+'</div>'}).join("")+'</div>';
  if(it.tip)h+='<div class="tip">'+fmt(it.tip)+'</div>';
  var labs=["Ik heb het hardop gelezen","Ik heb mezelf opgenomen (telefoon)","Ik heb mijn opname vergeleken met de stem"];
  h+='<ul class="reqs">'+labs.map(function(q,i){return '<li><label><input type="checkbox" data-act="tick" data-i="'+i+'"'+(t[i]?" checked":"")+'><span>'+q+'</span></label></li>'}).join("")+'</ul>';
  return h;
}
function renderSH(it,s){
  s=s||{};var t=s.t||[],en=transient.en[it.id];
  var h='<h4 class="tt">'+esc(it.title)+'</h4>';
  if(it.tip)h+='<div class="tip">'+fmt(it.tip)+'</div>';
  h+='<div class="acts" style="margin:0 0 4px"><button class="btn sm'+(en?" on":"")+'" data-act="en">EN</button><span class="wc">Luister, herhaal direct na de stem, neem jezelf op. <b>Vet</b> = beklemtoonde klank.</span></div>';
  h+='<div class="dl">'+it.lines.map(function(l,i){
    return '<div class="ln" style="grid-template-columns:auto 1fr auto"><label><input type="checkbox" data-act="tick" data-i="'+i+'"'+(t[i]?" checked":"")+' aria-label="regel '+(i+1)+' geoefend"></label><span class="nl">'+stress(l.nl)+'</span><span class="pls"><button class="pl" data-act="play" data-i="'+i+'" aria-label="afspelen">▶</button><button class="pl" data-act="slow" data-i="'+i+'" aria-label="langzaam afspelen" title="langzaam">🐢</button></span>'+(en?'<span class="en-l">'+esc(l.en)+'</span>':'')+'</div>'}).join("")+'</div>';
  return h;
}
function renderCard(it,n){
  var s=P[it.id],st=GRADED[it.t]?(s&&s.s)||"":(isDone(it)?"c":""),inner="",foot="";
  if(it.t==="fill")inner=renderFill(it,s);
  else if(it.t==="mc")inner=renderMC(it,s);
  else if(it.t==="fix")inner='<span class="lab">Verbeter de zin</span><div class="wrongs">'+esc(it.p)+'</div><input class="ans full" data-i="0" autocomplete="off" autocapitalize="off" spellcheck="false" value="'+esc((s&&s.v)||it.p)+'"'+(s&&s.s?" readonly":"")+'>';
  else if(it.t==="tr")inner='<span class="lab">Vertaal naar het Nederlands</span><p class="p en">'+fmt(it.p)+'</p><input class="ans full" data-i="0" autocomplete="off" autocapitalize="off" spellcheck="false" value="'+esc((s&&s.v)||"")+'"'+(s&&s.s?" readonly":"")+'>';
  else if(it.t==="order")inner=renderOrder(it,s);
  else if(it.t==="wr")inner=renderWR(it,s);
  else if(it.t==="dlg")inner=renderDLG(it,s);
  else if(it.t==="sh")inner=renderSH(it,s);
  if(GRADED[it.t]){
    var acts="";
    if(!(s&&s.s)){
      if(it.t!=="mc")acts+='<button class="btn sm pri" data-act="check">Controleer</button>';
      acts+='<button class="btn sm" data-act="show">Toon antwoord</button>';
    }else{
      acts+=mark(s.s);
      if(s.s==="w"){
        acts+='<button class="btn sm" data-act="again">Opnieuw</button>';
        acts+='<button class="btn sm" data-act="mine" title="Mijn antwoord is ook goed">Mijn antwoord is ook goed</button>';
      }else acts+='<button class="btn sm" data-act="again">Opnieuw</button>';
    }
    foot='<div class="acts">'+acts+'</div>';
    if(s&&s.s){
      if(s.s==="w"||it.t==="mc"||s.o||s.l)foot+='<p class="ans-line">Antwoord: <b>'+answerText(it.t==="order"?[it.a].concat(it.alts?it.alts.split("|"):[]).join("|"):it.a.replace(/;/g," · "))+'</b></p>';
      if(s.l)foot+='<div class="note">Let op de accenten of het trema: <b>'+esc(it.a.split("|")[0])+'</b></div>';
      if(it.n)foot+='<div class="note">'+fmt(it.n)+'</div>';
    }
  }
  return '<article class="it '+st+'" data-id="'+it.id+'" data-n="'+n+'"><div class="n">'+n+'</div><div class="bd">'+inner+foot+'</div></article>';
}
function refresh(id){
  var el=$('.it[data-id="'+id+'"]');if(!el)return;
  var t=document.createElement("div");t.innerHTML=renderCard(IDX[id].it,el.dataset.n);
  el.replaceWith(t.firstChild);chrome();
}

/* ---------- grading ---------- */
function gradeCard(card,id){
  var it=IDX[id].it,s=P[id]||(P[id]={}),inputs=$$("input.ans",card),vals=inputs.map(function(i){return i.value}),ok=0,loose=0;
  if(it.t==="fill"){
    var parts=it.a.split(";");ok=1;
    parts.forEach(function(pt,i){var r=cmp(vals[i]||"",pt.split("|"));if(r===0)ok=0;if(r===1)loose=1});
  }else if(it.t==="fix"||it.t==="tr"){
    var r=cmp(vals[0]||"",it.a.split("|"),it.t==="fix");ok=r>0?1:0;loose=r===1?1:0;
  }else if(it.t==="order"){
    var placed=transient.ord[id]||[],w=it.a.split(" "),joined=placed.map(function(i){return w[i]}).join(" ");
    vals=joined;var r2=cmp(joined,[it.a].concat(it.alts?it.alts.split("|"):[]));ok=r2>0?1:0;
    if(!placed.length){toast("Zet eerst de woorden neer.");return}
  }
  if(it.t!=="order"&&vals.every(function(v){return !v.trim()})){toast("Vul eerst een antwoord in.");return}
  s.a=(s.a||0)+1;s.v=vals;s.s=ok?"c":"w";s.l=loose&&ok?1:0;delete s.o;
  save();refresh(id);
}
function bind(){
  var root=$("#main");
  root.addEventListener("click",onClick);
  root.addEventListener("change",onChange);
  root.addEventListener("input",onInput);
  root.addEventListener("keydown",function(e){
    if(e.key==="Enter"&&e.target.matches("input.ans")){var c=e.target.closest(".it");if(c&&!P[c.dataset.id]?.s)gradeCard(c,c.dataset.id)}
  });
  $("#tabs").addEventListener("click",function(e){var b=e.target.closest("button[data-v]");if(b){stopSpeech();UI.tab=b.dataset.v;filter="all";save();render()}});
  $("#side").addEventListener("click",function(e){var b=e.target.closest("button[data-u]");if(b)openUnit(UI.tab,b.dataset.u)});
}
function openUnit(sec,id,f){stopSpeech();UI.units[sec]=id;UI.tab=sec;filter=f||"all";MIX=null;save();render();window.scrollTo({top:0})}
function onInput(e){
  var t=e.target;
  if(t.matches('textarea[data-act="draft"]')){
    var c=t.closest(".it"),id=c.dataset.id,s=P[id]||(P[id]={});s.d=t.value;save();
    var it=IDX[id].it,wc=t.value.trim()?t.value.trim().split(/\s+/).length:0,el=$(".wc",c);
    el.textContent=wc+" / "+it.min+" woorden";el.classList.toggle("ok",wc>=it.min);
  }
}
function onChange(e){
  var t=e.target,c=t.closest(".it");if(!c)return;var id=c.dataset.id,s=P[id]||(P[id]={}),i=+t.dataset.i;
  if(t.dataset.act==="req"){s.r=s.r||[];s.r[i]=t.checked;save()}
  else if(t.dataset.act==="tick"){s.t=s.t||[];s.t[i]=t.checked;save();chrome();var done=isDone(IDX[id].it);c.classList.toggle("c",done)}
}
function onClick(e){
  var el=e.target.closest("[data-act],[data-go]");if(!el)return;
  var act=el.dataset.act,card=el.closest(".it"),id=card&&card.dataset.id,it=id&&IDX[id]&&IDX[id].it;
  if(el.dataset.go){var g=el.dataset.go.split("/");openUnit(g[0],g[1],g[2]);return}
  if(act==="check")gradeCard(card,id);
  else if(act==="show"){var s=P[id]||(P[id]={});s.a=(s.a||0)+1;s.s="w";s.o=1;s.v=it.t==="order"?"":$$("input.ans",card).map(function(i){return i.value});save();refresh(id)}
  else if(act==="again"){var s2=P[id];if(s2){delete s2.s;delete s2.v;delete s2.l;delete s2.o}delete transient.ord[id];save();refresh(id)}
  else if(act==="mine"){var s3=P[id];s3.s="c";s3.o=1;save();refresh(id)}
  else if(act==="mc"){var s4=P[id]||(P[id]={});s4.a=(s4.a||0)+1;s4.v=el.dataset.v;s4.s=el.dataset.v===it.a?"c":"w";save();refresh(id)}
  else if(act==="tile"){(transient.ord[id]=transient.ord[id]||[]).push(+el.dataset.i);refresh(id)}
  else if(act==="untile"){transient.ord[id].splice(+el.dataset.pos,1);refresh(id)}
  else if(act==="done"){var s5=P[id]||(P[id]={});s5.done=!s5.done;save();refresh(id)}
  else if(act==="play"){speak(it.lines[+el.dataset.i].nl,1)}
  else if(act==="slow"){speak(it.lines[+el.dataset.i].nl,.6)}
  else if(act==="playall"){playLines(it.lines,transient.hide[id])}
  else if(act==="stop"){stopSpeech()}
  else if(act==="hide"){stopSpeech();transient.hide[id]=transient.hide[id]===el.dataset.v?null:el.dataset.v;refresh(id)}
  else if(act==="reveal"){var l=it.lines[+el.dataset.i];el.parentNode.textContent=l.nl}
  else if(act==="en"){transient.en[id]=!transient.en[id];refresh(id)}
  else if(act==="filter"){filter=el.dataset.v;render()}
  else if(act==="retry"){var u=curUnit();u.sets.forEach(function(s){s.items.forEach(function(x){var p=P[x.id];if(p&&p.s==="w"){delete p.s;delete p.v;delete p.l;delete p.o}})});filter="todo";save();render()}
  else if(act==="resetunit"){
    if(el.dataset.arm){var u2=curUnit();u2.sets.forEach(function(s){s.items.forEach(function(x){delete P[x.id];delete transient.ord[x.id]})});filter="all";save();render()}
    else{el.dataset.arm=1;el.textContent="Zeker? Klik nogmaals";setTimeout(function(){if(el.isConnected){delete el.dataset.arm;el.textContent="Unit resetten"}},3500)}
  }
  else if(act==="mix"){buildMix();render()}
  else if(act==="resetall"){resetArm=true;render()}
  else if(act==="resetno"){resetArm=false;render()}
  else if(act==="resetyes"){Object.keys(P).forEach(function(k){delete P[k]});transient.ord={};MIX=null;resetArm=false;save();render()}
}

/* ---------- views ---------- */
function curUnit(){var list=D[UI.tab];var id=UI.units[UI.tab];return list.filter(function(u){return u.id===id})[0]||list[0]}
function chrome(){
  // update sidebar counts, select and unit bar without losing inputs
  if(UI.tab==="progress"){return}
  var list=D[UI.tab],cu=curUnit();
  $$("#side button[data-u]").forEach(function(b){var u=list.filter(function(x){return x.id===b.dataset.u})[0],st=unitStat(u);$(".ct",b).textContent=st.d+"/"+st.t;b.classList.toggle("full",st.d===st.t&&st.t>0)});
  $$("#mobsel option").forEach(function(o){var u=list.filter(function(x){return x.id===o.value})[0];if(u){var st=unitStat(u);o.textContent=u.title+"  ("+st.d+"/"+st.t+")"}});
  var st=unitStat(cu),bar=$("#ubar");if(bar){bar.style.width=(st.t?100*st.d/st.t:0)+"%";$("#ucount").textContent=st.d+" van "+st.t+" klaar"+(st.w?" · "+st.w+" fout":"")}
}
function renderTabs(){
  $("#tabs").innerHTML=TABS.map(function(t){return '<button role="tab" data-v="'+t[0]+'" aria-selected="'+(UI.tab===t[0])+'">'+t[1]+'</button>'}).join("");
}
function renderSide(){
  var list=D[UI.tab],cu=curUnit(),h="",g="";
  list.forEach(function(u){
    if(u.group!==g){g=u.group;h+='<div class="grp">'+esc(g)+'</div>'}
    var st=unitStat(u);
    h+='<button class="ub'+(st.d===st.t&&st.t?" full":"")+'" data-u="'+u.id+'"'+(u.id===cu.id?' aria-current="true"':"")+'><span>'+esc(u.title)+'</span><span class="ct">'+st.d+'/'+st.t+'</span></button>';
  });
  $("#side").innerHTML=h;
}
function unitView(){
  var u=curUnit();if(!u)return '<div class="empty">Nog geen oefeningen in dit onderdeel.</div>';
  var idx=D[UI.tab].indexOf(u),st=unitStat(u);
  var h='<div class="mob"><select id="mobsel" aria-label="Kies onderwerp">'+D[UI.tab].map(function(x){var s=unitStat(x);return '<option value="'+x.id+'"'+(x.id===u.id?" selected":"")+'>'+esc(x.title)+'  ('+s.d+'/'+s.t+')</option>'}).join("")+'</select></div>';
  h+='<div class="uh"><h2>'+esc(u.title)+'</h2><div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="'+st.t+'" aria-valuenow="'+st.d+'"><i id="ubar" style="width:'+(st.t?100*st.d/st.t:0)+'%"></i></div>';
  h+='<div class="meta"><span id="ucount">'+st.d+' van '+st.t+' klaar'+(st.w?' · '+st.w+' fout':'')+'</span><span class="sp"></span>';
  [["all","Alles"],["todo","Nog te doen"],["wrong","Fout"]].forEach(function(f){h+='<button class="btn sm'+(filter===f[0]?" on":"")+'" data-act="filter" data-v="'+f[0]+'">'+f[1]+'</button>'});
  h+='<button class="btn sm" data-act="retry">Herhaal fouten</button><button class="btn sm dng" data-act="resetunit">Unit resetten</button></div></div>';
  if(u.rule)h+='<details class="rule" open><summary>Regel &amp; uitleg</summary><div class="rb">'+fmt(u.rule)+'</div></details>';
  var shown=0;
  u.sets.forEach(function(s,si){
    var items=s.items.filter(function(it){return filter==="all"||(filter==="todo"&&!isDone(it))||(filter==="wrong"&&isWrong(it))});
    if(!items.length)return;shown+=items.length;
    h+='<section class="set"><h3>Oefening '+(si+1)+'</h3><p class="instr">'+fmt(s.instr)+'</p>'+(s.hint?'<p class="hint">'+fmt(s.hint)+'</p>':"")+items.map(function(it){return renderCard(it,it.n0)}).join("")+'</section>';
  });
  if(!shown)h+='<div class="empty">'+(filter==="wrong"?"Geen foute antwoorden. Goed bezig!":"Alles in deze unit is klaar. Goed gedaan!")+'</div>';
  var prev=D[UI.tab][idx-1],next=D[UI.tab][idx+1];
  h+='<div class="acts" style="margin-top:24px;justify-content:space-between">'+(prev?'<button class="btn" data-go="'+UI.tab+'/'+prev.id+'">← '+esc(prev.title)+'</button>':'<span></span>')+(next?'<button class="btn pri" data-go="'+UI.tab+'/'+next.id+'">'+esc(next.title)+' →</button>':'')+'</div>';
  return h;
}
function buildMix(){
  var pool=[];
  ["grammar","writing"].forEach(function(sec){D[sec].forEach(function(u){u.sets.forEach(function(s){s.items.forEach(function(it){if(GRADED[it.t]&&!(P[it.id]&&P[it.id].s==="c"))pool.push(it.id)})})})});
  MIX=shuffle(pool,Math.random).slice(0,20);
}
function progressView(){
  var tot=0,done=0,wrong=0,rows="",weak=[];
  var secs={grammar:"Grammatica",writing:"Schrijven",speaking:"Spreken"},cards="";
  Object.keys(secs).forEach(function(sec){
    var t=0,d=0,w=0;
    D[sec].forEach(function(u){var st=unitStat(u);t+=st.t;d+=st.d;w+=st.w;
      rows+='<tr><td>'+esc(secs[sec])+'</td><td>'+esc(u.title)+'</td><td class="r">'+st.d+'/'+st.t+'</td><td class="r">'+(st.w||"–")+'</td><td><button class="btn sm" data-go="'+sec+'/'+u.id+'">Oefen</button></td></tr>';
      if(st.w)weak.push({sec:sec,u:u,w:st.w})});
    tot+=t;done+=d;wrong+=w;
    cards+='<div class="cd"><span class="lab">'+secs[sec]+'</span><div class="big">'+d+'<small style="font-size:15px;color:var(--ink2);font-weight:400"> / '+t+'</small></div><div class="bar"><i style="width:'+(t?100*d/t:0)+'%"></i></div></div>';
  });
  weak.sort(function(a,b){return b.w-a.w});
  var h='<div class="uh"><h2>Voortgang</h2></div><div class="cards"><div class="cd"><span class="lab">Totaal</span><div class="big">'+(tot?Math.round(100*done/tot):0)+'%</div><div class="bar"><i style="width:'+(tot?100*done/tot:0)+'%"></i></div><div class="wc" style="margin-top:6px">'+done+' van '+tot+' klaar · '+wrong+' fout</div></div>'+cards+'</div>';
  h+='<h3 class="sec">Gemengde herhaling</h3><p class="hint" style="color:var(--ink2);margin:0 0 8px">20 willekeurige oefeningen (grammatica + vertalen) die je nog niet goed hebt.</p><button class="btn pri" data-act="mix">'+(MIX?"Nieuwe set":"Start herhaling")+'</button>';
  if(MIX){h+=MIX.length?'<div>'+MIX.map(function(id,i){return renderCard(IDX[id].it,i+1)}).join("")+'</div>':'<div class="empty" style="margin-top:12px">Alles is al goed. Knap!</div>'}
  h+='<h3 class="sec">Zwakke plekken</h3>';
  h+=weak.length?'<div class="acts">'+weak.slice(0,6).map(function(w){return '<button class="btn" data-go="'+w.sec+'/'+w.u.id+'/wrong">'+esc(w.u.title)+' · '+w.w+' fout</button>'}).join("")+'</div>':'<p class="hint" style="color:var(--ink2)">Nog geen fouten. Begin met oefenen.</p>';
  h+='<h3 class="sec">Alle onderdelen</h3><div style="overflow-x:auto"><table class="stat"><thead><tr><th>Deel</th><th>Unit</th><th class="r">Klaar</th><th class="r">Fout</th><th></th></tr></thead><tbody>'+rows+'</tbody></table></div>';
  h+='<h3 class="sec">Opnieuw beginnen</h3>';
  h+=resetArm?'<p>Dit wist al je antwoorden en teksten op dit apparaat.</p><div class="acts"><button class="btn dng" data-act="resetyes">Ja, alles wissen</button><button class="btn" data-act="resetno">Annuleren</button></div>':'<button class="btn dng" data-act="resetall">Alles resetten</button>';
  h+='<p class="hint" style="color:var(--ink2);margin-top:18px;font-size:13.5px">Je voortgang wordt in deze browser op dit apparaat bewaard. Opnemen kan niet in deze pagina: gebruik de opname-app van je telefoon.</p>';
  return h;
}
function render(){
  renderTabs();
  var main=$("#main"),prog=UI.tab==="progress";
  $("#layout").classList.toggle("single",prog);
  $("#side").style.display=prog?"none":"";
  if(prog){main.innerHTML=progressView()}
  else{renderSide();main.innerHTML=unitView();var ms=$("#mobsel");if(ms)ms.addEventListener("change",function(){openUnit(UI.tab,ms.value)})}
}
bind();render();
window.__nl={norm:norm,flat:flat,cmp:cmp};
})();
</script>
</body>
