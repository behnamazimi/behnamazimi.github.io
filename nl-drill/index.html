<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nederlands Oefenboek</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=DM+Sans:wght@400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f7fa;--surface:#fff;--ink:#17203a;--ink2:#4a5472;--line:#dde1ec;
  --accent:#1f4fd8;--accent-ink:#fff;--accent-soft:#e6ecfd;
  --tulip:#c2185b;--tulip-soft:#fde8f0;
  --good:#1b7f4b;--good-soft:#e2f5ea;--bad:#b3261e;--bad-soft:#fdeceb;--warn:#8a5a00;--warn-soft:#fff3d6;
  --shadow:0 1px 2px rgba(23,32,58,.06);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0f1424;--surface:#171e33;--ink:#e8ecf8;--ink2:#a3adc8;--line:#2a3350;
    --accent:#7aa2ff;--accent-ink:#0f1424;--accent-soft:#1e2a4d;
    --tulip:#ff7eb3;--tulip-soft:#3a1c2b;
    --good:#5fd39a;--good-soft:#12301f;--bad:#ff8a80;--bad-soft:#3a1815;--warn:#f2c36b;--warn-soft:#33280f;
    --shadow:none;
  }
}
:root[data-theme="dark"]{
  --bg:#0f1424;--surface:#171e33;--ink:#e8ecf8;--ink2:#a3adc8;--line:#2a3350;
  --accent:#7aa2ff;--accent-ink:#0f1424;--accent-soft:#1e2a4d;
  --tulip:#ff7eb3;--tulip-soft:#3a1c2b;
  --good:#5fd39a;--good-soft:#12301f;--bad:#ff8a80;--bad-soft:#3a1815;--warn:#f2c36b;--warn-soft:#33280f;
  --shadow:none;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.55 "DM Sans",system-ui,-apple-system,Segoe UI,sans-serif}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1120px;margin:0 auto;padding:0 16px}
header.top{padding:20px 0 8px}
header.top h1{font:700 26px/1.15 "Bricolage Grotesque",sans-serif;margin:0;letter-spacing:-.01em}
header.top h1 span{color:var(--tulip)}
header.top p{margin:4px 0 0;color:var(--ink2);font-size:14px}
nav.tabs{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);display:flex;gap:4px;overflow-x:auto;padding:8px 0 0}
nav.tabs button{background:none;border:0;border-bottom:3px solid transparent;padding:8px 14px 9px;font-weight:600;color:var(--ink2);cursor:pointer;white-space:nowrap;border-radius:6px 6px 0 0}
nav.tabs button[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent)}
nav.tabs button:hover{background:var(--accent-soft)}
.layout{display:grid;grid-template-columns:260px minmax(0,1fr);gap:24px;padding:20px 0 60px}
.layout.single{grid-template-columns:minmax(0,1fr)}
aside.side{position:sticky;top:58px;align-self:start;max-height:calc(100vh - 70px);overflow:auto;padding-right:4px}
.grp{font:500 11px/1 "DM Mono",monospace;text-transform:uppercase;letter-spacing:.08em;color:var(--tulip);margin:16px 8px 6px}
.grp:first-child{margin-top:0}
.ub{display:flex;justify-content:space-between;gap:8px;width:100%;text-align:left;background:none;border:0;padding:7px 8px;border-radius:8px;cursor:pointer;color:var(--ink);font-size:14.5px}
.ub:hover{background:var(--accent-soft)}
.ub[aria-current="true"]{background:var(--accent);color:var(--accent-ink)}
.ub .ct{font:400 12px "DM Mono",monospace;opacity:.75;white-space:nowrap;align-self:center}
.ub.full .ct::before{content:"✓ "}
.mob{display:none;gap:8px;margin-bottom:14px}
.mob select{flex:1;min-width:0;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.btn{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px 13px;cursor:pointer;font-weight:500;font-size:14.5px}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.sm{padding:4px 10px;font-size:13px}
.btn.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.btn.dng{color:var(--bad)}
.btn[disabled]{opacity:.5;cursor:default}
.uh h2{font:700 24px/1.2 "Bricolage Grotesque",sans-serif;margin:0 0 10px}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--good);width:0;transition:width .3s}
.meta{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;margin:8px 0 14px;color:var(--ink2);font-size:14px}
.meta .sp{flex:1}
details.rule{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--tulip);border-radius:10px;padding:2px 14px;margin:14px 0;box-shadow:var(--shadow)}
details.rule summary{cursor:pointer;font-weight:600;padding:9px 0;color:var(--tulip)}
details.rule .rb{padding:0 0 12px;font-size:15px}
code{font:400 .92em "DM Mono",monospace;background:var(--accent-soft);padding:1px 5px;border-radius:5px}
.set{margin:26px 0 8px}
.set h3{font:600 12px/1.3 "DM Mono",monospace;text-transform:uppercase;letter-spacing:.07em;color:var(--accent);margin:0 0 4px}
.set .instr{font-weight:600;margin:0 0 2px}
.set .hint{color:var(--ink2);font-size:14px;margin:0 0 10px}
.it{display:flex;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:8px 0;box-shadow:var(--shadow)}
.it.c{border-color:var(--good);background:linear-gradient(0deg,var(--good-soft),var(--good-soft)),var(--surface)}
.it.w{border-color:var(--bad);background:linear-gradient(0deg,var(--bad-soft),var(--bad-soft)),var(--surface)}
.it .n{font:500 12px/1.9 "DM Mono",monospace;color:var(--ink2);min-width:22px;text-align:right}
.it .bd{flex:1;min-width:0}
.p{margin:0 0 8px;font-size:17px;line-height:1.9}
.p.en{color:var(--ink);}
.lab{font:500 11px "DM Mono",monospace;text-transform:uppercase;letter-spacing:.06em;color:var(--ink2);display:block;margin-bottom:2px}
input.ans,textarea.ans{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 9px;font-size:16px;min-width:0}
input.ans.inl{width:9em;max-width:100%;margin:0 3px;border-radius:6px;padding:3px 7px}
input.ans.full{width:100%}
textarea.ans{width:100%;min-height:150px;resize:vertical;line-height:1.5}
input.ans:disabled,input.ans[readonly]{opacity:.9}
.acts{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:6px}
.res{font-weight:600;display:flex;gap:6px;align-items:baseline;flex-wrap:wrap}
.res.c{color:var(--good)}.res.w{color:var(--bad)}
.ans-line{margin:4px 0 0;font-size:15.5px}
.ans-line b{color:var(--good)}
.note{margin:4px 0 0;font-size:14px;color:var(--ink2);border-left:3px solid var(--warn);padding-left:9px;background:var(--warn-soft);border-radius:0 6px 6px 0;padding-top:2px;padding-bottom:2px}
.wrongs{background:var(--bad-soft);border:1px dashed var(--bad);border-radius:8px;padding:6px 10px;margin:0 0 8px;font-size:17px}
.opts{display:grid;gap:6px}
.opt{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 12px;cursor:pointer;font-size:16px}
.opt:hover:not([disabled]){border-color:var(--accent);background:var(--accent-soft)}
.opt.right{border-color:var(--good);background:var(--good-soft);font-weight:600}
.opt.right::after{content:"  ✓"}
.opt.pick{border-color:var(--bad);background:var(--bad-soft)}
.opt.pick::after{content:"  ✗"}
.tiles{display:flex;flex-wrap:wrap;gap:6px;min-height:44px;padding:6px;border:1px dashed var(--line);border-radius:8px;margin-bottom:8px;align-items:center}
.tiles.src{border-style:solid;background:var(--bg)}
.tile{background:var(--accent-soft);border:1px solid var(--accent);color:var(--ink);border-radius:8px;padding:5px 11px;cursor:pointer;font-size:16px}
.tile:hover{background:var(--accent);color:var(--accent-ink)}
.tiles .ph{color:var(--ink2);font-size:14px;padding:0 4px}
.reqs{list-style:none;margin:0 0 10px;padding:0}
.reqs li{margin:4px 0}
.reqs label{display:flex;gap:8px;align-items:flex-start;cursor:pointer;font-size:15.5px}
input[type=checkbox]{width:18px;height:18px;margin-top:3px;accent-color:var(--accent);flex:none}
.wc{font:400 13px "DM Mono",monospace;color:var(--ink2)}
.wc.ok{color:var(--good)}
details.mdl{margin-top:10px;border:1px solid var(--line);border-radius:8px;padding:2px 12px;background:var(--bg)}
details.mdl summary{cursor:pointer;font-weight:600;padding:7px 0;color:var(--accent)}
details.mdl .tx{padding:0 0 10px;white-space:pre-wrap;font-size:16px}
.tt{font:600 18px/1.3 "Bricolage Grotesque",sans-serif;margin:0 0 2px}
.sit{color:var(--ink2);font-size:14.5px;margin:0 0 10px}
.dl{margin:8px 0}
.ln{display:grid;grid-template-columns:auto 1fr auto;gap:2px 10px;align-items:start;padding:7px 0;border-top:1px solid var(--line)}
.ln:first-child{border-top:0}
.sp-l{font:500 12px/2 "DM Mono",monospace;color:var(--tulip);min-width:1.6em}
.nl{font-size:17px}
b.st{color:var(--tulip);text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:3px}
.en-l{grid-column:2;color:var(--ink2);font-size:14px}
.ln.hid .nl{color:var(--ink2);font-style:italic}
.pl{background:none;border:1px solid var(--line);border-radius:99px;width:34px;height:34px;cursor:pointer;color:var(--accent);font-size:14px;flex:none}
.pl:hover{background:var(--accent-soft)}
.pls{display:flex;gap:6px}
.tip{background:var(--tulip-soft);border-radius:8px;padding:7px 11px;font-size:14.5px;margin:8px 0}
.stat{width:100%;border-collapse:collapse;font-size:14.5px}
.stat th,.stat td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line)}
.stat th{font:500 11px "DM Mono",monospace;text-transform:uppercase;letter-spacing:.06em;color:var(--ink2)}
.stat td.r{text-align:right;font-family:"DM Mono",monospace;font-size:13px;white-space:nowrap}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin:14px 0}
.cd{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px}
.cd .big{font:700 28px/1.1 "Bricolage Grotesque",sans-serif}
.cd .bar{margin-top:8px}
h3.sec{font:700 18px "Bricolage Grotesque",sans-serif;margin:26px 0 8px}
.empty{color:var(--ink2);padding:20px;text-align:center;border:1px dashed var(--line);border-radius:12px}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:99px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw;z-index:20}
#toast.show{opacity:1}
@media (max-width:820px){
  .layout{grid-template-columns:minmax(0,1fr);gap:0}
  aside.side{display:none}
  .mob{display:flex}
  .p{font-size:16.5px}
  input.ans.inl{width:7.5em}
}
</style>
</head>

<div class="wrap">
  <header class="top">
    <h1>Nederlands <span>Oefenboek</span></h1>
    <p>Grammatica, schrijven en spreken · A1 → A2 · gebaseerd op jouw aantekeningen</p>
  </header>
  <nav class="tabs" id="tabs" role="tablist"></nav>
  <div class="layout" id="layout">
    <aside class="side" id="side" aria-label="Onderwerpen"></aside>
    <main id="main"></main>
  </div>
</div>
<div id="toast" role="status" aria-live="polite"></div>
<script>window.DRILLS={"grammar":[{"id":"art","title":"Lidwoorden: de / het / een","rule":"**de** en **het** = bepaald (the). **een** = onbepaald (a/an), voor **de**- en **het**-woorden.\n- Eerste keer: **een** (Ik heb een hond). Daarna bekend: **de/het** (De hond is groot).\n- **Meervoud** is altijd **de**: het huis → de huizen, het meisje → de meisjes.\n- **het**: verkleinwoorden op **-je** (het meisje, het huisje, het kopje), woorden op **-ment** (het appartement), **-um** (het museum, het centrum), **-isme** (het toerisme), talen (het Nederlands) en windrichtingen (het noorden).\n- **de**: meer dan de helft van de woorden; ook cijfers (de negen), letters (de L), rivieren en bergen (de Rijn, de Nijl), mannen en vrouwen (de man, de vrouw).\n- Geen regel voor elk woord: leer het woord **met** zijn lidwoord (het huis, de tafel, het boek, de stad).\n- Let op: **een** blijft hetzelfde: een kopje (het kopje), een tafel (de tafel).","group":"Grammatica","sets":[{"instr":"Vul het lidwoord in: **de** of **het**.","hint":"Tip: -je, -ment, -um en talen zijn het-woorden. Meervoud is altijd de.","items":[{"t":"fill","p":"___ meisje woont naast ons.","a":"Het","n":"-je: altijd het (het meisje).","id":"art-39fa87ab"},{"t":"fill","p":"___ stad is mooi in de zomer.","a":"De","n":"de stad","id":"art-cb3a91ba"},{"t":"fill","p":"___ museum is open van tien tot vijf.","a":"Het","n":"-um: het museum.","id":"art-668cdc64"},{"t":"fill","p":"___ appartement heeft twee kamers.","a":"Het","n":"-ment: het appartement.","id":"art-04eae297"},{"t":"fill","p":"___ fiets staat voor de deur.","a":"De","n":"de fiets","id":"art-1db56eab"},{"t":"fill","p":"___ huisje is klein, maar gezellig.","a":"Het","n":"-je: het huisje.","id":"art-e7d894c7"},{"t":"fill","p":"___ centrum is druk op zaterdag.","a":"Het","n":"-um: het centrum.","id":"art-5a441ba8"},{"t":"fill","p":"___ negen is mijn geluksgetal.","a":"De","n":"Cijfers zijn de-woorden: de negen.","id":"art-f1a243e6"},{"t":"fill","p":"___ Nederlands is niet moeilijk.","a":"Het","n":"Talen zijn het-woorden: het Nederlands.","id":"art-057637cd"},{"t":"fill","p":"___ noorden is koud in de winter.","a":"Het","n":"Windrichtingen zijn het-woorden.","id":"art-2e2c05ad"},{"t":"fill","p":"___ moeder van Anna werkt in een ziekenhuis.","a":"De","n":"de moeder","id":"art-38571d6e"},{"t":"fill","p":"___ instrument ligt in de kast.","a":"Het","n":"-ment: het instrument.","id":"art-dd18c78f"}]},{"instr":"Vul in: **een**, **de** of **het**.","hint":"Eerste keer genoemd = een. Daarna = de of het.","items":[{"t":"fill","p":"Ik heb ___ hond. ___ hond heet Max.","a":"een;De","n":"Eerst een, daarna de.","id":"art-b1182606"},{"t":"fill","p":"Ik koop ___ boek. ___ boek is spannend.","a":"een;Het","n":"het boek","id":"art-21dc8ebc"},{"t":"fill","p":"Er staat ___ tafel in de kamer. ___ tafel is van hout.","a":"een;De","n":"de tafel","id":"art-45b54528"},{"t":"fill","p":"Ik zie ___ meisje. ___ meisje fietst naar school.","a":"een;Het","n":"het meisje (-je)","id":"art-9bade6df"},{"t":"fill","p":"Ik lees ___ krant. ___ krant is van gisteren.","a":"een;De","n":"de krant","id":"art-5e4d9fad"},{"t":"fill","p":"Er woont ___ man naast mij. ___ man is aardig.","a":"een;De","n":"de man","id":"art-e9d61c98"},{"t":"fill","p":"___ appels zijn goedkoop vandaag.","a":"De","n":"Meervoud: altijd de.","id":"art-69e8a738"},{"t":"fill","p":"Ik wil ___ kopje koffie, alstublieft.","a":"een","n":"Ook bij een het-woord is het onbepaalde lidwoord een.","id":"art-39d78c8e"}]},{"instr":"Kies het goede antwoord.","hint":"","items":[{"t":"mc","p":"Welk woord is een het-woord?","a":"het centrum","o":["de straat","de tafel"],"n":"-um: het centrum.","id":"art-ba808692"},{"t":"mc","p":"Welk woord is een het-woord?","a":"het appartement","o":["de kamer","de vrouw"],"n":"-ment: het appartement.","id":"art-11127857"},{"t":"mc","p":"Welk woord is een het-woord?","a":"het meisje","o":["de jongen","de man"],"n":"-je: altijd het.","id":"art-890d5e85"},{"t":"mc","p":"___ Rijn is een rivier in Europa.","a":"De","o":["Het","Een"],"n":"Rivieren: de Rijn, de Nijl.","id":"art-e121f3de"},{"t":"mc","p":"___ huizen in mijn straat zijn oud.","a":"De","o":["Het","Een"],"n":"Meervoud: altijd de.","id":"art-e21629b3"},{"t":"mc","p":"Ik leer ___ Spaans.","a":"het","o":["de","een"],"n":"Talen zijn het-woorden: het Spaans.","id":"art-44461aed"},{"t":"mc","p":"Er is ___ supermarkt in mijn straat.","a":"een","o":["de","het"],"n":"Na 'er is' komt iets nieuws: een.","id":"art-2396b491"},{"t":"mc","p":"___ westen van Nederland is druk.","a":"Het","o":["De","Een"],"n":"Windrichtingen: het westen, het noorden.","id":"art-07b5a1a1"},{"t":"mc","p":"Wat is het meervoud van 'het kind', met lidwoord?","a":"de kinderen","o":["het kinderen","een kinderen"],"n":"Meervoud: altijd de.","id":"art-2c42cac5"},{"t":"mc","p":"Wat klopt?","a":"Het meisje heet Sara.","o":["De meisje heet Sara.","Het meisjes heet Sara."],"n":"meisje = het (-je).","id":"art-6f72136c"}]},{"instr":"Verbeter de fout.","hint":"","items":[{"t":"fix","p":"De meisje woont in Utrecht.","a":"Het meisje woont in Utrecht.","n":"-je: altijd het.","id":"art-c60d726f"},{"t":"fix","p":"Het stad is groot.","a":"De stad is groot.","n":"de stad","id":"art-2309330d"},{"t":"fix","p":"Ik heb een auto. Het auto is rood.","a":"Ik heb een auto. De auto is rood.","n":"de auto","id":"art-c1890294"},{"t":"fix","p":"De appartement is klein.","a":"Het appartement is klein.","n":"-ment: het.","id":"art-a96751e3"},{"t":"fix","p":"Het boeken liggen op tafel.","a":"De boeken liggen op tafel.","n":"Meervoud: altijd de.","id":"art-d9b299a2"},{"t":"fix","p":"Het Rijn is lang.","a":"De Rijn is lang.","n":"Rivieren: de.","id":"art-9e4fdd5d"}]},{"instr":"Vertaal naar het Nederlands.","hint":"","items":[{"t":"tr","p":"The girl is nice.","a":"Het meisje is aardig.|Het meisje is leuk.|Het meisje is lief.","n":"het meisje","id":"art-c1c76d47"},{"t":"tr","p":"I have a dog. The dog is big.","a":"Ik heb een hond. De hond is groot.","n":"Eerst een, daarna de.","id":"art-e3b99e12"},{"t":"tr","p":"The museum is open.","a":"Het museum is open.","n":"-um: het.","id":"art-0f503026"},{"t":"tr","p":"The books are expensive.","a":"De boeken zijn duur.","n":"Meervoud: de.","id":"art-365bea07"},{"t":"tr","p":"There is a bakery in the street.","a":"Er is een bakker in de straat.|Er is een bakkerij in de straat.","n":"een, de straat","id":"art-6cd9d91d"},{"t":"tr","p":"The centre is busy.","a":"Het centrum is druk.","n":"-um: het.","id":"art-43e545b2"}]},{"instr":"Zet de woorden in de goede volgorde.","hint":"","items":[{"t":"order","a":"Het museum is vandaag gesloten.","alts":"Vandaag is het museum gesloten.","p":"The museum is closed today.","n":"","id":"art-f693c92f"},{"t":"order","a":"De boeken liggen op de tafel.","alts":"Op de tafel liggen de boeken.","p":"The books are on the table.","n":"","id":"art-9af0d1da"},{"t":"order","a":"Ik heb een hond en een kat.","alts":"","p":"I have a dog and a cat.","n":"","id":"art-3751339a"},{"t":"order","a":"Het kindje slaapt in een klein bed.","alts":"","p":"The little child sleeps in a small bed.","n":"","id":"art-7deb7dbc"},{"t":"order","a":"De stad heeft een mooi centrum.","alts":"","p":"The city has a beautiful centre.","n":"","id":"art-c18ace80"},{"t":"order","a":"Het appartement heeft een groot balkon.","alts":"","p":"The apartment has a big balcony.","n":"","id":"art-97f7368c"},{"t":"order","a":"Ik woon in het noorden van Nederland.","alts":"In het noorden van Nederland woon ik.","p":"I live in the north of the Netherlands.","n":"","id":"art-8a20d6a7"},{"t":"order","a":"Een meisje woont naast het museum.","alts":"Naast het museum woont een meisje.","p":"A girl lives next to the museum.","n":"","id":"art-1d33f600"},{"t":"order","a":"De fietsen staan voor het huis.","alts":"Voor het huis staan de fietsen.","p":"The bikes are in front of the house.","n":"","id":"art-8d5986f8"},{"t":"order","a":"Er staat een tafel in de kamer.","alts":"In de kamer staat een tafel.","p":"There is a table in the room.","n":"","id":"art-4de8fda7"}]}]},{"id":"plur","title":"Meervoud (plural)","rule":"Meestal: **-en** of **-s**. Een paar woorden: **-'s** of **-eren**.\n- **-en**: één lettergreep of klemtoon achteraan: de krant → de kranten, de student → de studenten.\n- **-s**: eindigt op **-e, -el, -er, -en, -em, -ie**: de tafel → de tafels, de dokter → de dokters. Ook bij **-je**: het meisje → de meisjes.\n- **-'s**: eindigt op **a, i, o, u, y**: de auto → de auto's, de baby → de baby's, de paraplu → de paraplu's.\n- **Lange klinker** (aa, ee, oo, uu) in open lettergreep: één klinker weg: de boot → de boten, de straat → de straten. Eindigt het woord op -ee: de zee → de zeeën, het idee → de ideeën.\n- **Korte klinker**: medeklinker verdubbelen: de man → de mannen, de bus → de bussen, de les → de lessen.\n- **s → z** en **f → v**: het huis → de huizen, de reis → de reizen, de brief → de brieven.\n- **-eren**: het kind → de kinderen, het ei → de eieren, het blad → de bladeren. Onregelmatig: de stad → de steden, het schip → de schepen, het glas → de glazen, de dag → de dagen.","group":"Grammatica","sets":[{"instr":"Vul het meervoud in.","hint":"Let op: -en of -s? Korte of lange klinker?","items":[{"t":"fill","p":"Er staan drie ___ (tafel) in de kamer.","a":"tafels","n":"-el: -s.","id":"plur-2c359d02"},{"t":"fill","p":"In de straat zijn veel ___ (winkel).","a":"winkels","n":"-el: -s.","id":"plur-95c56cde"},{"t":"fill","p":"De ___ (krant) liggen op tafel.","a":"kranten","n":"Eén lettergreep: -en.","id":"plur-b1958d24"},{"t":"fill","p":"Ik zie twee ___ (boot) op het water.","a":"boten","n":"Lange klinker: één o weg.","id":"plur-a114a915"},{"t":"fill","p":"Er lopen drie ___ (man) in het park.","a":"mannen","n":"Korte klinker: nn.","id":"plur-139f1a2e"},{"t":"fill","p":"Wij hebben vier ___ (stoel).","a":"stoelen","n":"Eén lettergreep: -en.","id":"plur-44ed35b1"},{"t":"fill","p":"Veel ___ (student) wonen in Utrecht.","a":"studenten","n":"Klemtoon achteraan: s in the city are expensive.","n":"","id":"plur-c9fc30cd"},{"t":"order","a":"Wij hebben twee honden en drie katten.","alts":"","p":"We have two dogs and three cats.","n":"","id":"plur-10882bc3"},{"t":"order","a":"Er liggen veel bladeren in het park.","alts":"In het park liggen veel bladeren.","p":"There are many leaves in the park.","n":"","id":"plur-472cc327"}]}]},{"id":"pres","title":"Tegenwoordige tijd (present tense)","rule":"**Stam** = infinitief zonder **-en**: werken → **werk**, wonen → **woon**.\n- **ik** + stam: ik werk · **jij/u/hij/zij/het** + stam + **-t**: jij werkt, u werkt, hij werkt · **wij/jullie/zij (they)** + infinitief: wij werken, jullie werken, zij werken.\n- **Inversie**: bij **jij** valt de -t weg: Jij werkt → **Werk jij?** (maar: **Werkt hij?**, **Werkt u?**). Met je: Werk je?\n- **Lange klinker** (open lettergreep): maken → ik **maak**, lopen → ik **loop**, wonen → ik **woon**, eten → ik **eet**.\n- **v → f, z → s**: schrijven → ik schrijf, blijven → ik blijf, leven → ik leef; reizen → ik reis, lezen → ik lees.\n- **Dubbele medeklinker** wordt één: stoppen → ik stop, kennen → ik ken, vallen → ik val.\n- Eindigt de stam op **-t**: geen tweede t: praten → hij praat, eten → hij eet, zitten → hij zit.\n- Gebruik: gewoonte (Ik werk elke dag), nu (Ik werk nu), toekomst (Morgen werk ik niet).","group":"Grammatica","sets":[{"instr":"Vul de goede vorm in.","hint":"Stam + -t bij hij/zij/het, jij en u. Wij/jullie/zij: infinitief.","items":[{"t":"fill","p":"Ik ___ (werken) in een winkel.","a":"werk","n":"ik + stam","id":"pres-b3e5bf82"},{"t":"fill","p":"Jij ___ (wonen) in Utrecht.","a":"woont","n":"jij + stam + t","id":"pres-6882ca67"},{"t":"fill","p":"Hij ___ (werken) bij de gemeente.","a":"werkt","n":"hij + stam + t","id":"pres-4695642d"},{"t":"fill","p":"Wij ___ (spelen) voetbal.","a":"spelen","n":"wij + infinitief","id":"pres-6247fa91"},{"t":"fill","p":"Anna ___ (koken) vandaag.","a":"kookt","n":"Stam: kook (lange klinker). Anna = zij: kookt.","id" e, wij zullen (Zullen we? Zal ik?)\n- Betekenis: willen = want, kunnen = can, moeten = must, mogen = may/allowed, zullen = shall.\n- Na een modaal werkwoord **geen \"te\"**: Ik wil werken (niet: te werken).\n- **Onregelmatig** (ik / hij / wij): gaan: ga / gaat / gaan · doen: doe / doet / doen · staan: sta / staat / staan · zitten: zit / zit / zitten · weten: weet / weet / weten · zeggen: zeg / zegt / zeggen · komen: kom / komt / komen · zien: zie / ziet / zien · geven: geef / geeft / geven · nemen: neem / neemt / nemen.","group":"Grammatica","sets":[{"instr":"Vul het modale werkwoord in.","hint":"willen, kunnen, moeten, mogen, zullen: let op de infinitief aan het eind.","items":[{"t":"fill","p":"Ik ___ (willen) een kop koffie.","a":"wil","n":"ik wil","id":"mod-be154817"},{"t":"fill","p":"Jij ___ (kunnen) goed zwemmen.","a":"kunt|kan","n":"jij kunt of jij kan","id":"mod-fbe48ac7"},{"t":"fill","p":"Hij ___ (moeten) vandaag werken.","a":"moet","n":"hij moet","id":"mod-54bab776"},{"t":"fill","p":"___ ik (mogen) binnenkomen?","a":"Mag","n":"ik mag","id":"mod-c10065f1"},{"t":"fill","p":"Wij ___ (willen) naar het strand.","a":"willen","n":"wij willen","id":"mod-58ddb7a4"},{"t":"fill","p":"Jullie ___ (moeten) om acht uur op school zijn.","a":"moeten","n":"jullie moeten","id":"mod-591fdc23"},{"t":"fill","p":"___ we (zullen) een kopje koffie drinken?","a":"Zullen","n":"Zullen we?","id":"mod-9ec20752"},{"t":"fill","p":"Anna ___ (kunnen) niet komen.","a":"kan","n":"zij kan","id":"mod-00b9bf2a"},{"t":"fill","p":"Je ___ (mogen) hier niet roken.","a":"mag","n":"je mag","id":"mod-2f7f490b"},{"t":"fill","p":"___ je (kunnen) mij helpen?","a":"Kun|Kan","n":"Kun je? of Kan je?","id":"mod-67e1ab28"},{"t":"fill","p":"Ik wil nu naar huis ___ (gaan).","a":"gaan","n":"Infinitief aan het eind.","id":"mod-c7af4214"},{"t":"fill","p":"Zij moet morgen vroeg ___ (komen).","a":"komen","n":"Infinitief aan het eind.","id":"mod-d421a3e1"}]},{"instr":"Vul de onregelmatige werkwoorden in.","hint":"","i sloten lettergreep** = klinker blijft in het woord zelf met twee letters als hij lang is: maan, boom, straat; korte klinker: man, bom.\n- Meervoud: man -> **mannen** (dubbele medeklinker), maan -> **manen** (één a). Ook: s -> z (huis -> **huizen**), f -> v (brief -> **brieven**).\n- **dt-regel**: ik word, hij **wordt**, jij **wordt**; ik vind, hij **vindt**; wij worden. Stam op -t: hij praat (geen extra t).\n- **'t kofschip**: stam op t, k, f, s, ch, p -> **-t / -te(n)**: gekookt, gefietst, gewerkt. Anders **-d / -de(n)**: gewoond, geleerd, woonde.\n- **ei / ij** klinken hetzelfde: trein, klein, mijn, tijd. **au / ou**: auto, blauw, koud, vrouw. **ui**: huis. **sch**: school. **ng / nk**: bang, bank.\n- **Trema** (scheidt klinkers): ideeën, zeeën, knieën. **Apostrof**: auto's, foto's, baby's, opa's; 's morgens, 's avonds.\n- **Hoofdletters**: namen, landen, steden, talen (Nederlands), zinsbegin. **Kleine letter**: dagen en maanden (maandag, mei).\n- **Afbreken**: bij de lettergreep: ta-fel, lo-pen, man-nen, ont-bijt.","group":"Grammatica","sets":[{"instr":"Schrijf het meervoud.","hint":"Open of gesloten lettergreep? s -> z, f -> v aan het eind.","items":[{"t":"fill","p":"de man -> de ___","a":"mannen","n":"Korte klinker: dubbele n.","id":"spel-6b45abb9"},{"t":"fill","p":"de maan -> de ___","a":"manen","n":"Lange klinker: één a.","id":"spel-81bac8bd"},{"t":"fill","p":"het bed -> de ___","a":"bedden","n":"","id":"spel-43d1da36"},{"t":"fill","p":"de boom -> de ___","a":"bomen","n":"Lange klinker: één o.","id":"spel-192b1b3a"},{"t":"fill","p":"het huis -> de ___","a":"huizen","n":"s wordt z.","id":"spel-8f1c14b9"},{"t":"fill","p":"de brief -> de ___","a":"brieven","n":"f wordt v.","id":"spel-78e10104"}]},{"instr":"Vul het werkwoord in: let op de dt-regel!","hint":"Stam + t bij hij/zij/het en jij (in een gewone zin). Eindigt de stam al op t? Dan geen tweede t.","items":[{"t":"fill","p":"Hij ___ (worden) morgen veertig.","a":"wordt","n":"Stam word + t = wordt.","id":"spel ch TV.","n":"","id":"spel-9b11e0d5"},{"t":"order","a":"Mijn opa's wonen in Duitsland.","alts":"","p":"My grandfathers live in Germany.","n":"","id":"spel-628e997e"},{"t":"order","a":"Wij hebben gisteren lekker gekookt.","alts":"Gisteren hebben wij lekker gekookt.","p":"We cooked nicely yesterday.","n":"","id":"spel-267deb83"},{"t":"order","a":"Zij vindt de school erg leuk.","alts":"","p":"She thinks the school is great.","n":"","id":"spel-6eb9899e"},{"t":"order","a":"Ik ben bang voor de grote hond.","alts":"","p":"I am afraid of the big dog.","n":"","id":"spel-190588b2"},{"t":"order","a":"Het is vandaag maandag.","alts":"Vandaag is het maandag.","p":"Today is Monday.","n":"","id":"spel-bfa9558e"},{"t":"order","a":"Hij heeft gisteren de hele dag gewerkt.","alts":"Gisteren heeft hij de hele dag gewerkt.","p":"He worked all day yesterday.","n":"","id":"spel-ae6a6a04"},{"t":"order","a":"De trein naar Rotterdam is te laat.","alts":"","p":"The train to Rotterdam is late.","n":"","id":"spel-93a535b0"}]}]},{"id":"klein","title":"Kleine woorden en verbindingswoorden","rule":"**Hoofdzin + hoofdzin** (normale volgorde: onderwerp + werkwoord): **en, maar, of, want, dus**.\n- Ik ben moe, **dus** ik ga naar bed. Ik ga naar bed, **want** ik ben moe. Het is mooi, **maar** het is koud.\n**Bijzin** (werkwoord **achteraan**): **omdat, dat, als, of** (= whether), terwijl, voordat.\n- Ik blijf thuis, **omdat** ik ziek **ben**. Ik denk **dat** hij thuis **is**. **Als** het regent, **blijf** ik thuis (bijzin eerst -> daarna werkwoord).\n**Tijdwoorden vooraan** -> werkwoord op plaats 2 (inversie): **Eerst** eet ik, **daarna** ga ik slapen. **Toen** ging hij naar huis. **Misschien** komt hij.\n- **al** (already), **nog** (still/yet), **even** (a moment), **alleen** (only), **ook** (also).\n- **graag** (gladly) en **liever** (rather): Ik drink graag thee, maar ik drink **liever** koffie.\n- **zo, erg, heel** (very): erg moe, heel leuk. **wel / toch**: Het regent, maar ik ga **toch** fietsen. "id":"v-werk-0cdcfde3"},{"t":"fill","p":"De brief ligt in de ___ (mailbox).","a":"brievenbus","n":"","id":"v-werk-53f86e15"},{"t":"fill","p":"Ik betaal met mijn ___ (bank card).","a":"bankpas|pinpas","n":"","id":"v-werk-2d83c98f"},{"t":"fill","p":"Ik heb geld op mijn ___ (bank account).","a":"bankrekening","n":"","id":"v-werk-dcbcd2e9"}]},{"instr":"Kies het goede antwoord.","hint":"","items":[{"t":"mc","p":"___ kapper is aardig.","a":"De","o":["Het","Dit"],"n":"de kapper","id":"v-werk-6666a701"},{"t":"mc","p":"___ ziekenhuis is vlakbij.","a":"Het","o":["De","Die"],"n":"het ziekenhuis","id":"v-werk-a31a62ac"},{"t":"mc","p":"___ afspraak is om tien uur.","a":"De","o":["Het","Dat"],"n":"de afspraak","id":"v-werk-fd3c7a71"},{"t":"mc","p":"Een arts werkt in het ___.","a":"ziekenhuis","o":["restaurant","postkantoor","station"],"n":"","id":"v-werk-3cf439cc"},{"t":"mc","p":"Ik ___ de brief in de brievenbus.","a":"doe","o":["ben","maak","heb"],"n":"","id":"v-werk-34e11cd0"},{"t":"mc","p":"Ik wil mijn haar laten ___.","a":"knippen","o":["knip","geknipt","knipte"],"n":"laten + infinitief","id":"v-werk-dbb177ed"},{"t":"mc","p":"De cardioloog onderzoekt het ___.","a":"hart","o":["brein","longen","huid"],"n":"","id":"v-werk-d3104880"},{"t":"mc","p":"Wie knipt je haar?","a":"De kapper","o":["De cardioloog","De ober"],"n":"","id":"v-werk-fc202e73"}]},{"instr":"Zet de woorden in de goede volgorde.","hint":"","items":[{"t":"order","a":"Ik heb morgen een afspraak bij de kapper.","alts":"Morgen heb ik een afspraak bij de kapper.","p":"I have an appointment at the hairdresser's tomorrow.","n":"","id":"v-werk-147352a4"},{"t":"order","a":"Ik schrijf de afspraak in mijn agenda.","alts":"","p":"I write the appointment in my diary.","n":"","id":"v-werk-003a4258"},{"t":"order","a":"Heeft u volgende week een plekje?","alts":"Heb je volgende week een plekje?","p":"Do you have a spot next week?","n":"","id":"v-werk-351b454c"},{"t":"order","a":"Ik wil graag mijn haar laten knippen.","alts":"Ik wil mijn haar graag laten knippen.","p":"I would like to have my hair cut.","n":"","id":"v-werk-9b85dfc6"},{"t":"order","a":"Wat neem ik mee naar het ziekenhuis?","alts":"","p":"What do I take to the hospital?","n":"","id":"v-werk-b20277eb"},{"t":"order","a":"Ik ga met de taxi naar het ziekenhuis.","alts":"Met de taxi ga ik naar het ziekenhuis.","p":"I go to the hospital by taxi.","n":"","id":"v-werk-241e6abe"},{"t":"order","a":"De brief ligt in de brievenbus.","alts":"","p":"The letter is in the mailbox.","n":"","id":"v-werk-e76d06ce"},{"t":"order","a":"Waar moet jij heen?","alts":"Waar moet jij naartoe?","p":"Where do you have to go?","n":"","id":"v-werk-3e3cff02"}]},{"instr":"Verbeter de fout.","hint":"","items":[{"t":"fix","p":"Het kapper is druk.","a":"De kapper is druk.","n":"de kapper","id":"v-werk-a27701c2"},{"t":"fix","p":"De ziekenhuis is groot.","a":"Het ziekenhuis is groot.","n":"het ziekenhuis","id":"v-werk-7ad7c877"},{"t":"fix","p":"Ik wil mijn haar laten knip.","a":"Ik wil mijn haar laten knippen.","n":"laten + infinitief","id":"v-werk-71e1f836"},{"t":"fix","p":"Ik lees de brief en ik zie dat ik heb een afspraak.","a":"Ik lees de brief en ik zie dat ik een afspraak heb.","n":"bijzin: werkwoord aan het eind","id":"v-werk-95b28023"},{"t":"fix","p":"Ik heb de afspraak in mijn agenda schrijven.","a":"Ik heb de afspraak in mijn agenda geschreven.","n":"perfectum: geschreven","id":"v-werk-b65c8942"}]},{"instr":"Vertaal naar het Nederlands.","hint":"","items":[{"t":"tr","p":"I have an appointment.","a":"Ik heb een afspraak.","n":"","id":"v-werk-ff09464e"},{"t":"tr","p":"Noted!","a":"Staat genoteerd!|Genoteerd!","n":"","id":"v-werk-16f8f09a"},{"t":"tr","p":"Do you have a spot next Monday?","a":"Heeft u volgende maandag een plekje?|Heb je volgende maandag een plekje?|Hebt u volgende maandag een plekje?|Heb jij volgende maandag een plekje?|Heeft u maandag een plekje?|Heb je maandag een plekje?","n":"","id":"v-werk-cb2995e9"},{"t":"tr","p":"I write the appointment in my diary.","a":"Ik schrijf de afspraak in mijn agenda.","n":"","id":"v-werk-5aed5f12"},{"t":"tr","p":"How do you go to the hospital?","a":"Hoe ga je naar het ziekenhuis?|Hoe gaat u naar het ziekenhuis?|Hoe ga jij naar het ziekenhuis?","n":"","id":"v-werk-55b59df0"},{"t":"tr","p":"I take my ID with me.","a":"Ik neem mijn legitimatie mee.|Ik neem mijn identiteitskaart mee.|Ik neem mijn id-kaart mee.","n":"","id":"v-werk-9d929b94"},{"t":"tr","p":"The letter is in the envelope.","a":"De brief is in de envelop.|De brief zit in de envelop.","n":"","id":"v-werk-ed485f93"}]}]}],"writing":[{"id":"wt1","title":"Vertalen 1: werkwoorden in de tegenwoordige tijd","rule":"Vertaal naar het Nederlands. Schrijf hele zinnen met hoofdletter en punt (of vraagteken).\n- **zijn**: ik ben, je/jij bent, hij/zij/ze is, wij/we zijn, jullie zijn, zij/ze zijn. Bij **u**: u bent.\n- **hebben**: ik heb, je/jij hebt (maar: **heb je?**), hij heeft, wij hebben.\n- Gewone werkwoorden: stam + -t bij hij/zij/het: ik woon, hij **woont**, wij wonen. Bij **je/jij** na het werkwoord valt de -t weg: **woon je?**\n- **de** of **het**: de vrouw, het huis (leer het lidwoord bij elk woord).\n- Beroep zonder lidwoord: Ik ben leraar. (= I am a teacher.)\n- Je mag meer dan een goede vertaling geven; als er twee kloppen, is elke goed.","group":"Schrijven","sets":[{"instr":"Vertaal: zijn en hebben.","hint":"ben / bent / is / zijn; heb / hebt / heeft / hebben","items":[{"t":"tr","p":"I am a teacher.","a":"Ik ben leraar.|Ik ben lerares.|Ik ben docent.|Ik ben docente.","n":"","id":"wt1-2be993af"},{"t":"tr","p":"You are tired. (informal)","a":"Je bent moe.|Jij bent moe.","n":"","id":"wt1-36154be0"},{"t":"tr","p":"He has a dog.","a":"Hij heeft een hond.","n":"","id":"wt1-f9639440"},{"t":"tr","p":"We are at home.","a":"We zijn thuis.|Wij zijn thuis.","n":"","id":"wt1-a3209643"},{"t":"tr","p":"They have two children.","a":"Ze hebben twee kinderen.|Zij hebben twee kinderen.","n":"","id":"wt1-8a9e10e0"},{"t":"tr","p":"Are you Mr Jansen? (formal)","a":"Bent u meneer Jansen?|Bent u de heer Jansen?","n":"","id":"wt1-2cbb1216"},{"t":"tr","p":"Do you have a bike? (informal)","a":"Heb je een fiets?|Heb jij een fiets?","n":"Na je/jij na het werkwoord: geen -t (heb je, niet hebt je).","id":"wt1-2f8ff9a7"},{"t":"tr","p":"She is very nice.","a":"Ze is erg aardig.|Ze is erg lief.|Ze is erg leuk.|Ze is heel aardig.|Ze is heel lief.|Ze is heel leuk.|Zij is erg aardig.|Zij is erg lief.|Zij is erg leuk.|Zij is heel aardig.|Zij is heel lief.|Zij is heel leuk.","n":"","id":"wt1-ec5bfaa7"}]},{"instr":"Vertaal: wonen, werken, heten.","hint":"ik woon, hij woont; woon je?","items":[{"t":"tr","p":"My name is Anna.","a":"Ik heet Anna.|Mijn naam is Anna.","n":"","id":"wt1-716d8d28"},{"t":"tr","p":"What is your name? (informal)","a":"Hoe heet je?|Hoe heet jij?","n":"","id":"wt1-6b8fd21c"},{"t":"tr","p":"I live in Rotterdam.","a":"Ik woon in Rotterdam.","n":"","id":"wt1-64ae3328"},{"t":"tr","p":"Where do you live? (informal)","a":"Waar woon je?|Waar woon jij?","n":"","id":"wt1-1390bee2"},{"t":"tr","p":"He works in a hospital.","a":"Hij werkt in een ziekenhuis.","n":"","id":"wt1-aad6bf34"},{"t":"tr","p":"We work in an office.","a":"We werken in een kantoor.|We werken op een kantoor.|We werken op kantoor.|Wij werken in een kantoor.|Wij werken op een kantoor.|Wij werken op kantoor.","n":"","id":"wt1-42bf0d68"},{"t":"tr","p":"She lives in Utrecht and works in Amsterdam.","a":"Ze woont in Utrecht en werkt in Amsterdam.|Zij woont in Utrecht en werkt in Amsterdam.","n":"","id":"wt1-0e717f17"},{"t":"tr","p":"Where does he work?","a":"Waar werkt hij?","n":"","id":"wt1-0216d065"}]},{"instr":"Vertaal: andere veelgebruikte werkwoorden.","hint":"spreken, drinken, eten, lezen, slapen, komen","items":[{"t":"tr","p":"I speak a little Dutch.","a":"Ik spreek een beetje Nederlands.","n":"","id":"wt1-87bc83e2"},{"t":"tr","p":"She drinks coffee.","a":"Ze drinkt koffie.|Zij drinkt koffie.","n":"","id":"wt1-af8f2a70"},{"t":"tr","p":"We eat bread.","a":"We eten brood.|Wij eten brood.","n":"","id":"wt1-1fcdff8f"},{"t":"tr","p":"They play football.","a":"Ze voetballen.|Ze spelen voetbal.|Zij voetballen.|Zij spelen voetbal.","n":"","id":"wt1-392c35ce"},{"t":"tr","p":"He reads a book.","a":"Hij leest een boek.","n":"","id":"wt1-f71bf29c"},{"t":"tr","p":"The children sleep.","a":"De kinderen slapen.","n":"","id":"wt1-17e75744"},{"t":"tr","p":"Where do you come from? (informal)","a":"Waar kom je vandaan?|Waar kom jij vandaan?","n":"","id":"wt1-95a1573e"},{"t":"tr","p":"I like tea. (I love tea)","a":"Ik hou van thee.|Ik houd van thee.|Ik vind thee lekker.|Ik drink graag thee.","n":"","id":"wt1-7bfd17d7"}]},{"instr":"Vertaal: de/het, getallen en plaatsen.","hint":"Let op de of het.","items":[{"t":"tr","p":"The house is big.","a":"Het huis is groot.","n":"","id":"wt1-ededf29f"},{"t":"tr","p":"The woman is old.","a":"De vrouw is oud.","n":"","id":"wt1-5422f717"},{"t":"tr","p":"I have a cat and two fish.","a":"Ik heb een kat en twee vissen.","n":"","id":"wt1-aea4bcb1"},{"t":"tr","p":"There is a bank in the street.","a":"Er is een bank in de straat.|In de straat is een bank.","n":"","id":"wt1-d828366c"},{"t":"tr","p":"I am from England.","a":"Ik kom uit Engeland.|Ik ben uit Engeland.","n":"","id":"wt1-8c3df0b8"},{"t":"tr","p":"My sister is 25 years old.","a":"Mijn zus is vijfentwintig jaar oud.|Mijn zus is vijfentwintig jaar.|Mijn zus is 25 jaar oud.|Mijn zus is 25 jaar.","n":"","id":"wt1-52b412a3"},{"t":"tr","p":"This is my brother.","a":"Dit is mijn broer.","n":"","id":"wt1-a1fb64f7"},{"t":"tr","p":"The book is on the table.","a":"Het boek ligt op de tafel.|Het boek ligt op tafel.","n":"","id":"wt1-0c39e3ba"}]},{"instr":"Vertaal: kennismaken en persoonlijke informatie.","hint":"","items":[{"t":"tr","p":"How old are you? (informal)","a":"Hoe oud ben je?|Hoe oud ben jij?","n":"","id":"wt1-4870e473"},{"t":"tr","p":"I am thirty years old.","a":"Ik ben dertig jaar|Ik ben dertig|Ik ben dertig jaar oud.","n":"","id":"wt1-cbc1ddcb"},{"t":"tr","p":"She is a nurse.","a":"Ze is verpleegster.|Ze is verpleegkundige.|Zij is verpleegster.|Zij is verpleegkundige.","n":"","id":"wt1-41495d40"},{"t":"tr","p":"We are friends.","a":"We zijn vrienden.|Wij zijn vrienden.","n":"","id":"wt1-aaf2b1e4"},{"t":"tr","p":"I have a question.","a":"Ik heb een vraag.","n":"","id":"wt1-d6c54a54"},{"t":"tr","p":"You live in Leiden. (formal)","a":"U woont in Leiden.","n":"","id":"wt1-47d97d7a"},{"t":"tr","p":"My mother is a doctor.","a":"Mijn moeder is arts.|Mijn moeder is dokter.|Mijn moeder is huisarts.","n":"","id":"wt1-263515d3"},{"t":"tr","p":"Peter and Anna are married.","a":"Peter en Anna zijn getrouwd.","n":"","id":"wt1-d1635472"}]},{"instr":"Vind de fout en schrijf de zin goed.","hint":"","items":[{"t":"fix","p":"Ik ben woon in Utrecht.","a":"Ik woon in Utrecht.","n":"Woon is al het werkwoord; ben is niet nodig.","id":"wt1-c2996662"},{"t":"fix","p":"Hij hebben een auto.","a":"Hij heeft een auto.","n":"hij + heeft.","id":"wt1-8bd7e515"},{"t":"fix","p":"Wij werkt in een winkel.","a":"Wij werken in een winkel.|We werken in een winkel.","n":"wij + -en.","id":"wt1-385434a3"},{"t":"fix","p":"De huis is groot.","a":"Het huis is groot.","n":"huis is een het-woord.","id":"wt1-2ddbfba4"}]}]},{"id":"wt2","title":"Vertalen 2: woordvolgorde en vragen","rule":"- Hoofdzin: het werkwoord staat op **plaats 2**: Ik werk vandaag. / **Vandaag werk ik.** (inversie)\n- Ja/nee-vraag: werkwoord vooraan: **Werk je** vandaag? **Heeft** hij kinderen?\n- Vraagwoord + werkwoord + onderwerp: **Waar woon je?** **Wat wil hij?**\n- Vraagwoorden: wie, wat, waar, wanneer, waarom, hoe, welk(e), hoeveel, hoe laat.\n- In een bijzin (na **dat**, **waar**, **hoe laat**...) gaat het werkwoord **naar het eind**: Ik denk dat hij **ziek is**.\n- Voegwoorden **en, maar, of** veranderen de volgorde niet: Ik werk en hij slaapt.","group":"Schrijven","sets":[{"instr":"Vertaal: begin de zin met de tijd of plaats (inversie).","hint":"Vandaag werk ik. Het werkwoord blijft op plaats 2.","items":[{"t":"tr","p":"Today I work at home.","a":"Vandaag werk ik thuis.|Ik werk vandaag thuis.","n":"","id":"wt2-fa51b7a5"},{"t":"tr","p":"Tomorrow we are going to Amsterdam.","a":"Morgen gaan we naar Amsterdam.|Morgen gaan wij naar Amsterdam.|We gaan morgen naar Amsterdam.|Wij gaan morgen naar Amsterdam.","n":"","id":"wt2-b9bb0efb"},{"t":"tr","p":"Now she is sleeping.","a":"Nu slaapt ze.|Nu slaapt zij.|Ze slaapt nu.|Zij slaapt nu.","n":"","id":"wt2-99c9b6b5"},{"t":"tr","p":"In the evening he cooks.","a":"’s Avonds kookt hij.|In de avond kookt hij.|'s Avonds kookt hij.","n":"","id":"wt2-f8b90942"},{"t":"tr","p":"On Saturday I play football.","a":"Op zaterdag speel ik voetbal.|Op zaterdag voetbal ik.|Zaterdag speel ik voetbal.|Zaterdag voetbal ik.|Zaterdags speel ik voetbal.|Zaterdags voetbal ik.|Ik speel op zaterdag voetbal.|Ik speel op zaterdag .|Ik speel zaterdag voetbal.|Ik speel zaterdag .|Ik voetbal op zaterdag voetbal.|Ik voetbal op zaterdag .|Ik voetbal zaterdag voetbal.|Ik voetbal zaterdag .","n":"","id":"wt2-9221035a"},{"t":"tr","p":"Sometimes they eat in a restaurant.","a":"Soms eten ze in een restaurant.|Soms eten zij in een restaurant.|Ze eten soms in een restaurant.|Zij eten soms in een restaurant.","n":"","id":"wt2-455d181e"},{"t":"tr","p":"Here the bus stops.","a":"Hier stopt de bus.|De bus stopt hier.","n":"","id":"wt2-a031399b"},{"t":"tr","p":"Then I go home.","a":"Dan ga ik naar huis.|Daarna ga ik naar huis.|Ik ga dan naar huis.|Ik ga daarna naar huis.","n":"","id":"wt2-1575646d"}]},{"instr":"Vertaal: vragen met een vraagwoord.","hint":"Vraagwoord + werkwoord + onderwerp","items":[{"t":"tr","p":"What do you want? (informal)","a":"Wat wil je?|Wat wil jij?","n":"","id":"wt2-b2880bb7"},{"t":"tr","p":"Where is the station?","a":"Waar is het station?","n":"","id":"wt2-aae6e3a6"},{"t":"tr","p":"When are you coming? (informal)","a":"Wanneer kom je?|Wanneer kom jij?","n":"","id":"wt2-75f4d2dc"},{"t":"tr","p":"Who is that?","a":"Wie is dat?","n":"","id":"wt2-b479e67e"},{"t":"tr","p":"Why are you laughing? (informal)","a":"Waarom lach je?|Waarom lach jij?","n":"","id":"wt2-6a1751dc"},{"t":"tr","p":"How much does this cost?","a":"Hoeveel kost dit?|Wat kost dit?|Hoeveel kost het?","n":"","id":"wt2-90f10895"},{"t":"tr","p":"Which book are you reading? (informal)","a":"Welk boek lees je?|Welk boek lees jij?","n":"","id":"wt2-0dc84b6f"},{"t":"tr","p":"What time is it?","a":"Hoe laat is het?","n":"","id":"wt2-6bf06447"}]},{"instr":"Vertaal: ja/nee-vragen.","hint":"Het werkwoord staat vooraan.","items":[{"t":"tr","p":"Do you speak English? (informal)","a":"Spreek je Engels?|Spreek jij Engels?","n":"","id":"wt2-fe341a73"},{"t":"tr","p":"Is he at home?","a":"Is hij thuis?","n":"","id":"wt2-c1dff4ba"},{"t":"tr","p":"Do they have children?","a":"Hebben ze kinderen?|Hebben zij kinderen?","n":"","id":"wt2-47be2bcc"},{"t":"tr","p":"Are you coming tonight? (informal)","a":"Kom je vanavond?|Kom jij vanavond?|Komt u vanavond?","n":"","id":"wt2-82c76a5c"},{"t":"tr","p":"Does she work here?","a":"Werkt ze hier?|Werkt zij hier?","n":"","id":"wt2-9cd11582"},{"t":"tr","p":"Do we have bread?","a":"Hebben we brood?|Hebben wij brood?","n":"","id":"wt2-1e2f2c5f"},{"t":"tr","p":"Is the shop open?","a":"Is de winkel open?","n":"","id":"wt2-a210704b"},{"t":"tr","p":"Do you live alone? (formal)","a":"Woont u alleen?","n":"","id":"wt2-0be43cee"}]},{"instr":"Vertaal: bijzinnen met dat en vraagwoorden.","hint":"Het werkwoord gaat naar het eind van de bijzin.","items":[{"t":"tr","p":"I think that he is ill.","a":"Ik denk dat hij ziek is.","n":"","id":"wt2-3097a2b4"},{"t":"tr","p":"I know that she lives here.","a":"Ik weet dat ze hier woont.|Ik weet dat zij hier woont.","n":"","id":"wt2-8c90ce65"},{"t":"tr","p":"He says that it is expensive.","a":"Hij zegt dat het duur is.","n":"","id":"wt2-d16f10ec"},{"t":"tr","p":"I do not know where he lives.","a":"Ik weet niet waar hij woont.","n":"","id":"wt2-7727202c"},{"t":"tr","p":"Do you know what time it is? (informal)","a":"Weet je hoe laat het is?|Weet jij hoe laat het is?","n":"","id":"wt2-447bac87"},{"t":"tr","p":"I hope that you are coming. (informal)","a":"Ik hoop dat je komt.|Ik hoop dat jij komt.","n":"","id":"wt2-eb67cda6"},{"t":"tr","p":"She asks where the toilet is.","a":"Ze vraagt waar het toilet is.|Ze vraagt waar de wc is.|Zij vraagt waar het toilet is.|Zij vraagt waar de wc is.","n":"","id":"wt2-e9f0538e"},{"t":"tr","p":"I see that you are tired. (informal)","a":"Ik zie dat je moe bent.|Ik zie dat jij moe bent.","n":"","id":"wt2-9fa0b017"}]},{"instr":"Vertaal: en, maar, of en gemengde zinnen.","hint":"","items":[{"t":"tr","p":"I work and he sleeps.","a":"Ik werk en hij slaapt.","n":"","id":"wt2-ca0050c1"},{"t":"tr","p":"I want coffee, but he wants tea.","a":"Ik wil koffie, maar hij wil thee.","n":"","id":"wt2-844bef97"},{"t":"tr","p":"Do you want coffee or tea? (informal)","a":"Wil je koffie of thee?|Wil jij koffie of thee?","n":"","id":"wt2-4b4ba9ce"},{"t":"tr","p":"On Monday I work and on Tuesday I am free.","a":"Op maandag werk ik en op dinsdag ben ik vrij.|Op maandag werk ik en dinsdag ben ik vrij.|Maandag werk ik en op dinsdag ben ik vrij.|Maandag werk ik en dinsdag ben ik vrij.|Ik werk op maandag en ik ben op dinsdag vrij.|Ik werk op maandag en ik ben dinsdag vrij.|Ik werk maandag en ik ben op dinsdag vrij.|Ik werk maandag en ik ben dinsdag vrij.","n":"","id":"wt2-4fd182fc"},{"t":"tr","p":"Why does he work on Sundays?","a":"Waarom werkt hij op zondag?|Waarom werkt hij zondags?|Waarom werkt hij op zondagen?","n":"","id":"wt2-9627a944"},{"t":"tr","p":"Where do you work now? (informal)","a":"Waar werk je nu?|Waar werk jij nu?","n":"","id":"wt2-958679f4"},{"t":"tr","p":"Every day I walk to school.","a":"Elke dag loop ik naar school.|Iedere dag loop ik naar school.|Ik loop elke dag naar school.|Ik loop iedere dag naar school.","n":"","id":"wt2-24636c30"},{"t":"tr","p":"How do you go to work? (informal)","a":"Hoe ga je naar je werk?|Hoe ga je naar jouw werk?|Hoe ga jij naar je werk?|Hoe ga jij naar jouw werk?|Hoe ga je naar het werk?|Hoe ga jij naar het werk?","n":"","id":"wt2-71e08ddc"}]},{"instr":"Vind de fout en schrijf de zin goed.","hint":"","items":[{"t":"fix","p":"Morgen ik werk thuis.","a":"Morgen werk ik thuis.","n":"Na het tijdwoord komt eerst het werkwoord.","id":"wt2-e8cf2e3b"},{"t":"fix","p":"Waar je woont?","a":"Waar woon je?","n":"Vraag: vraagwoord + werkwoord + onderwerp.","id":"wt2-8510c4b4"},{"t":"fix","p":"Ik denk dat hij is ziek.","a":"Ik denk dat hij ziek is.","n":"In een bijzin staat het werkwoord achteraan.","id":"wt2-ebbff69f"},{"t":"fix","p":"Nu ik ga naar huis.","a":"Nu ga ik naar huis.","n":"Inversie: werkwoord op plaats 2.","id":"wt2-ec03e10c"}]}]},{"id":"wt3","title":"Vertalen 3: modale werkwoorden en scheidbare werkwoorden","rule":"- **Modale werkwoorden**: kunnen (ik kan), willen (ik wil), moeten (ik moet), mogen (ik mag), zullen (zullen we?).\n- Het tweede werkwoord is een infinitief en staat **aan het eind**: Ik wil **naar huis gaan**. Hij kan niet **komen**.\n- **Scheidbare werkwoorden**: opstaan, meekomen, aankomen, opruimen, uitnodigen. In de hoofdzin gaat het voorvoegsel naar het eind: Ik **sta** om zeven uur **op**.\n- Met een modaal werkwoord blijft het heel: Ik **moet** vroeg **opstaan**.\n- Gebod: **Kom binnen!** **Zet** de tv **uit.**\n- **Kunt u / kun je** en **kan je** zijn allebei goed.","group":"Schrijven","sets":[{"instr":"Vertaal: kunnen, willen, moeten, mogen.","hint":"Het tweede werkwoord staat aan het eind.","items":[{"t":"tr","p":"I can swim.","a":"Ik kan zwemmen.","n":"","id":"wt3-71902467"},{"t":"tr","p":"She wants to go home.","a":"Ze wil naar huis gaan.|Ze wil naar huis.|Zij wil naar huis gaan.|Zij wil naar huis.","n":"","id":"wt3-b8701e4b"},{"t":"tr","p":"We must work.","a":"We moeten werken.|Wij moeten werken.","n":"","id":"wt3-889cc373"},{"t":"tr","p":"May I come in?","a":"Mag ik binnenkomen?|Mag ik binnen komen?|Mag ik binnen?","n":"","id":"wt3-327a806a"},{"t":"tr","p":"You may not smoke here. (informal)","a":"Je mag hier niet roken.|Jij mag hier niet roken.","n":"","id":"wt3-7164b860"},{"t":"tr","p":"Can you help me? (informal)","a":"Kun je me helpen?|Kun je mij helpen?|Kun jij me helpen?|Kun jij mij helpen?|Kan je me helpen?|Kan je mij helpen?|Kan jij me helpen?|Kan jij mij helpen?","n":"","id":"wt3-60752838"},{"t":"tr","p":"He cannot come today.","a":"Hij kan vandaag niet komen.|Vandaag kan hij niet komen.","n":"","id":"wt3-33a87a9b"},{"t":"tr","p":"They want to eat.","a":"Ze willen eten.|Zij willen eten.","n":"","id":"wt3-dda31d37"}]},{"instr":"Vertaal: meer modale zinnen.","hint":"","items":[{"t":"tr","p":"I would like a coffee. (I want a coffee, please.)","a":"Ik wil graag een koffie.|Ik wil graag koffie.|Ik wil graag een kopje koffie.|Ik wil graag een kop koffie.|Mag ik een koffie?|Mag ik een kopje koffie?","n":"","id":"wt3-76c74058"},{"t":"tr","p":"Do you want to dance? (informal)","a":"Wil je dansen?|Wil jij dansen?","n":"","id":"wt3-8c24ed13"},{"t":"tr","p":"Tomorrow I have to get up early.","a":"Morgen moet ik vroeg opstaan.|Ik moet morgen vroeg opstaan.","n":"","id":"wt3-da2087a6"},{"t":"tr","p":"We cannot park here.","a":"We kunnen hier niet parkeren.|Wij kunnen hier niet parkeren.|Hier kunnen we niet parkeren.|Hier kunnen wij niet parkeren.","n":"","id":"wt3-699eb3fd"},{"t":"tr","p":"Shall we go?","a":"Zullen we gaan?|Zullen wij gaan?|Gaan we?|Gaan wij?","n":"","id":"wt3-45df070b"},{"t":"tr","p":"Can she speak Dutch?","a":"Kan ze Nederlands spreken?|Kan zij Nederlands spreken?","n":"","id":"wt3-29b75c07"},{"t":"tr","p":"I want to learn Dutch.","a":"Ik wil Nederlands leren.","n":"","id":"wt3-715d3040"},{"t":"tr","p":"You may sit here. (formal)","a":"U mag hier zitten.","n":"","id":"wt3-3adbd3ee"}]},{"instr":"Vertaal: scheidbare werkwoorden in de tegenwoordige tijd.","hint":"Voorvoegsel naar het eind.","items":[{"t":"tr","p":"I get up at seven o'clock.","a":"Ik sta om zeven uur op.|Om zeven uur sta ik op.","n":"","id":"wt3-a1944a4f"},{"t":"tr","p":"She phones her mother.","a":"Ze belt haar moeder op.|Ze belt haar moeder.|Zij belt haar moeder op.|Zij belt haar moeder.|Ze belt met haar moeder.|Zij belt met haar moeder.","n":"","id":"wt3-bd6243f7"},{"t":"tr","p":"The train arrives at nine o'clock.","a":"De trein komt om negen uur aan.|Om negen uur komt de trein aan.","n":"","id":"wt3-9a651179"},{"t":"tr","p":"He closes the door.","a":"Hij doet de deur dicht.|Hij sluit de deur.|Hij maakt de deur dicht.","n":"","id":"wt3-50e46407"},{"t":"tr","p":"I clean up the room.","a":"Ik ruim de kamer op.","n":"","id":"wt3-f0b41e2d"},{"t":"tr","p":"Does he switch on the light?","a":"Doet hij het licht aan?|Zet hij het licht aan?","n":"","id":"wt3-0d5ba456"},{"t":"tr","p":"She takes the children along.","a":"Ze neemt de kinderen mee.|Zij neemt de kinderen mee.","n":"","id":"wt3-1aa191e0"},{"t":"tr","p":"When are you coming back? (informal)","a":"Wanneer kom je terug?|Wanneer kom jij terug?","n":"","id":"wt3-644edb8a"}]},{"instr":"Vertaal: opdrachten, vragen en scheidbare werkwoorden met een modaal werkwoord.","hint":"","items":[{"t":"tr","p":"Come in! (informal)","a":"Kom binnen!","n":"","id":"wt3-b5cbcc67"},{"t":"tr","p":"Sit down!","a":"Ga zitten!","n":"","id":"wt3-2bcc9f54"},{"t":"tr","p":"Turn off the TV, please. (informal)","a":"Doe de tv uit, alsjeblieft!|Doe de tv uit alsjeblieft!|Doe de televisie uit, alsjeblieft!|Doe de televisie uit alsjeblieft!|Zet de tv uit, alsjeblieft!|Zet de tv uit alsjeblieft!|Zet de televisie uit, alsjeblieft!|Zet de televisie uit alsjeblieft!|Zet alsjeblieft de tv uit.|Zet alsjeblieft de televisie uit.","n":"","id":"wt3-d96a80a3"},{"t":"tr","p":"Are you coming along? (informal)","a":"Kom je mee?|Kom jij mee?","n":"","id":"wt3-df728b24"},{"t":"tr","p":"I cannot come along.","a":"Ik kan niet meekomen.|Ik kan niet mee komen.|Ik kan niet mee.","n":"","id":"wt3-94701927"},{"t":"tr","p":"You have to clean up your room. (informal)","a":"Je moet je kamer opruimen.|Je moet jouw kamer opruimen.|Jij moet je kamer opruimen.|Jij moet jouw kamer opruimen.","n":"","id":"wt3-eb3de440"},{"t":"tr","p":"Can you call me back? (informal)","a":"Kun je me terugbellen?|Kun je me terug bellen?|Kun je mij terugbellen?|Kun je mij terug bellen?|Kun jij me terugbellen?|Kun jij me terug bellen?|Kun jij mij terugbellen?|Kun jij mij terug bellen?|Kan je me terugbellen?|Kan je me terug bellen?|Kan je mij terugbellen?|Kan je mij terug bellen?|Kan jij me terugbellen?|Kan jij me terug bellen?|Kan jij mij terugbellen?|Kan jij mij terug bellen?","n":"","id":"wt3-70d1106a"},{"t":"tr","p":"I want to get up early tomorrow.","a":"Ik wil morgen vroeg opstaan.|Morgen wil ik vroeg opstaan.","n":"","id":"wt3-2ba479de"}]},{"instr":"Vertaal: gemengde zinnen.","hint":"","items":[{"t":"tr","p":"Does the shop open at eight o'clock?","a":"Gaat de winkel om acht uur open?|Opent de winkel om acht uur?|Gaat de winkel om acht open?","n":"","id":"wt3-e0a9f35f"},{"t":"tr","p":"Are you bringing an umbrella? (informal)","a":"Neem je een paraplu mee?|Neem jij een paraplu mee?","n":"","id":"wt3-a05f06aa"},{"t":"tr","p":"I have to stand up.","a":"Ik moet opstaan.","n":"","id":"wt3-10ba3310"},{"t":"tr","p":"He wants to stay at home.","a":"Hij wil thuisblijven.|Hij wil thuis blijven.","n":"","id":"wt3-9ea65a2d"},{"t":"tr","p":"We are going out tonight.","a":"We gaan vanavond uit.|Wij gaan vanavond uit.|Vanavond gaan we uit.|Vanavond gaan wij uit.","n":"","id":"wt3-030550cd"},{"t":"tr","p":"Can I pay by card?","a":"Kan ik met pin betalen?|Kan ik met de pinpas betalen?|Kan ik met mijn pinpas betalen?|Kan ik met een bankpas betalen?|Kan ik met de pas betalen?|Kan ik met de kaart betalen?|Kan ik met mijn kaart betalen?|Kan ik met een kaart betalen?|Kan ik met de creditcard betalen?|Kan ik met mijn creditcard betalen?|Mag ik met pin betalen?|Mag ik met de pinpas betalen?|Mag ik met mijn pinpas betalen?|Mag ik met een bankpas betalen?|Mag ik met de pas betalen?|Mag ik met de kaart betalen?|Mag ik met mijn kaart betalen?|Mag ik met een kaart betalen?|Mag ik met de creditcard betalen?|Mag ik met mijn creditcard betalen?|Kan ik pinnen?|Mag ik pinnen?","n":"","id":"wt3-05b19b17"},{"t":"tr","p":"I have to call my mother.","a":"Ik moet mijn moeder bellen.","n":"","id":"wt3-1489c337"},{"t":"tr","p":"Does the lesson start at nine?","a":"Begint de les om negen uur?|Begint de les om negen?","n":"","id":"wt3-76f43212"}]},{"instr":"Vind de fout en schrijf de zin goed.","hint":"","items":[{"t":"fix","p":"Ik wil gaan naar huis.","a":"Ik wil naar huis gaan.|Ik wil naar huis.","n":"Het tweede werkwoord (infinitief) staat aan het eind.","id":"wt3-8c40d3bd"},{"t":"fix","p":"Ik opsta om zeven uur.","a":"Ik sta om zeven uur op.","n":"opstaan is scheidbaar.","id":"wt3-e676e2f4"},{"t":"fix","p":"Hij kan zwemt goed.","a":"Hij kan goed zwemmen.","n":"Na een modaal werkwoord komt de infinitief.","id":"wt3-6cdf8cb9"},{"t":"fix","p":"Wij moeten werkt vandaag.","a":"Wij moeten vandaag werken.|We moeten vandaag werken.","n":"moeten + infinitief.","id":"wt3-38b5f26a"}]}]},{"id":"wt4","title":"Vertalen 4: het perfectum (gebeurtenissen in het verleden)","rule":"- Perfectum = **hebben/zijn** (plaats 2) + **voltooid deelwoord** (aan het eind): Ik **heb** gisteren **gewerkt**.\n- Regelmatig: **ge-** + stam + **-t/-d**: werken, gewerkt; wonen, gewoond; leren, geleerd. Stam eindigt op t, k, f, s, ch, p (**'t kofschip**): -t. Anders -d.\n- Onregelmatig leren: eten, gegeten; drinken, gedronken; zien, gezien; lezen, gelezen; schrijven, geschreven; kopen, gekocht.\n- Met **zijn**: gaan, komen, blijven, vertrekken, aankomen, zijn (geweest), opstaan: Ik **ben** naar huis **gegaan**.\n- Scheidbaar: ge- in het midden: opgestaan, opgeruimd, aangekomen. Niet-scheidbaar (be-, ver-, ont-, ge-) heeft geen ge-: bezocht, vergeten, begonnen.\n- **Let op:** een toestand die nog duurt = tegenwoordige tijd: We **wonen** hier al twee jaar.","group":"Schrijven","sets":[{"instr":"Vertaal: regelmatige werkwoorden met hebben.","hint":"ge- + stam + t/d","items":[{"t":"tr","p":"I worked yesterday.","a":"Ik heb gisteren gewerkt.|Gisteren heb ik gewerkt.","n":"","id":"wt4-2639f217"},{"t":"tr","p":"She cooked the food.","a":"Ze heeft het eten gekookt.|Ze heeft het avondeten gekookt.|Zij heeft het eten gekookt.|Zij heeft het avondeten gekookt.","n":"","id":"wt4-82b4042f"},{"t":"tr","p":"We played football.","a":"We hebben gevoetbald.|We hebben voetbal gespeeld.|Wij hebben gevoetbald.|Wij hebben voetbal gespeeld.","n":"","id":"wt4-623ae1cb"},{"t":"tr","p":"He lived in Belgium.","a":"Hij heeft in België gewoond.","n":"","id":"wt4-e9a106f4"},{"t":"tr","p":"They waited for the bus.","a":"Ze hebben op de bus gewacht.|Zij hebben op de bus gewacht.","n":"","id":"wt4-74279b5f"},{"t":"tr","p":"I learned Dutch.","a":"Ik heb Nederlands geleerd.","n":"","id":"wt4-32089a9e"},{"t":"tr","p":"You cleaned the kitchen. (informal)","a":"Je hebt de keuken schoongemaakt.|Je hebt de keuken schoon gemaakt.|Jij hebt de keuken schoongemaakt.|Jij hebt de keuken schoon gemaakt.","n":"","id":"wt4-70501ba2"},{"t":"tr","p":"I listened to music.","a":"Ik heb naar muziek geluisterd.","n":"","id":"wt4-554552be"}]},{"instr":"Vertaal: onregelmatige voltooide deelwoorden.","hint":"gegeten, gedronken, gezien, gelezen, geschreven, gekocht, geslapen","items":[{"t":"tr","p":"I ate an apple.","a":"Ik heb een appel gegeten.","n":"","id":"wt4-6488ca81"},{"t":"tr","p":"She drank tea.","a":"Ze heeft thee gedronken.|Zij heeft thee gedronken.","n":"","id":"wt4-309843c8"},{"t":"tr","p":"We saw a film.","a":"We hebben een film gezien.|Wij hebben een film gezien.","n":"","id":"wt4-7a719192"},{"t":"tr","p":"He read a book.","a":"Hij heeft een boek gelezen.","n":"","id":"wt4-2bd8460c"},{"t":"tr","p":"I wrote a letter.","a":"Ik heb een brief geschreven.","n":"","id":"wt4-28a0b827"},{"t":"tr","p":"They bought bread.","a":"Ze hebben brood gekocht.|Zij hebben brood gekocht. d.","n":"","id":"wt4-a5bfd459"},{"t":"tr","p":"We cleaned up the room.","a":"We hebben de kamer opgeruimd.|Wij hebben de kamer opgeruimd.","n":"","id":"wt4-587117cd"},{"t":"tr","p":"I started at nine o'clock.","a":"Ik ben om negen uur begonnen.|Ik ben om negen begonnen.|Om negen uur ben ik begonnen.|Om negen ben ik begonnen.","n":"","id":"wt4-c989ca5a"},{"t":"tr","p":"He visited his grandmother.","a":"Hij heeft zijn oma bezocht.|Hij heeft zijn grootmoeder bezocht.","n":"","id":"wt4-e17d6395"},{"t":"tr","p":"I invited my friends.","a":"Ik heb mijn vrienden uitgenodigd.","n":"","id":"wt4-3ff424e7"},{"t":"tr","p":"She watched TV.","a":"Ze heeft tv gekeken.|Ze heeft televisie gekeken.|Zij heeft tv gekeken.|Zij heeft televisie gekeken.","n":"","id":"wt4-122fa3e3"},{"t":"tr","p":"I received a present.","a":"Ik heb een cadeau gekregen.","n":"","id":"wt4-a2c89c2c"}]},{"instr":"Vertaal: gemengde zinnen over het verleden.","hint":"","items":[{"t":"tr","p":"Last week I went on holiday.","a":"Vorige week ben ik op vakantie gegaan.|Ik ben vorige week op vakantie gegaan.","n":"","id":"wt4-efeb7161"},{"t":"tr","p":"What did you do yesterday? (informal)","a":"Wat heb je gisteren gedaan?|Wat heb jij gisteren gedaan?","n":"","id":"wt4-e3a47ac1"},{"t":"tr","p":"Have you eaten yet? (informal)","a":"Heb je al gegeten?|Heb jij al gegeten?","n":"","id":"wt4-b9b9faff"},{"t":"tr","p":"I have never been to Germany.","a":"Ik ben nog nooit in Duitsland geweest.|Ik ben nooit in Duitsland geweest.","n":"","id":"wt4-f6e29d24"},{"t":"tr","p":"We have lived here for two years.","a":"We wonen hier al twee jaar.|Wij wonen hier al twee jaar.|We wonen al twee jaar hier.|Wij wonen al twee jaar hier.","n":"Het wonen duurt nog: tegenwoordige tijd met al.","id":"wt4-4b1cbe07"},{"t":"tr","p":"He did not come yesterday.","a":"Hij is gisteren niet gekomen.|Gisteren is hij niet gekomen.","n":"","id":"wt4-272fd585"},{"t":"tr","p":"Last night I watched a film.","a":"Gisteravond heb ik naar een film gekeken.|Gisteravond heb ik een film gekeken.|Gisteravond heb ik een film gezien.|Ik heb gisteravond naar een film gekeken.|Ik heb gisteravond een film gekeken.|Ik heb gisteravond een film gezien.","n":"","id":"wt4-396fe54b"},{"t":"tr","p":"I have not seen her.","a":"Ik heb haar niet gezien.","n":"","id":"wt4-f9d71551"}]},{"instr":"Vind de fout en schrijf de zin goed.","hint":"","items":[{"t":"fix","p":"Ik heb naar Utrecht gegaan.","a":"Ik ben naar Utrecht gegaan.","n":"gaan krijgt zijn.","id":"wt4-a73c0486"},{"t":"fix","p":"Wij hebben gevoetbal.","a":"Wij hebben gevoetbald.|We hebben gevoetbald.","n":"voetbal + d: gevoetbald (stam eindigt op l).","id":"wt4-491295a5"},{"t":"fix","p":"Zij is een boek gelezen.","a":"Zij heeft een boek gelezen.|Ze heeft een boek gelezen.","n":"lezen krijgt hebben.","id":"wt4-31c8e99b"},{"t":"fix","p":"Ik heb opgestaan om zeven uur.","a":"Ik ben om zeven uur opgestaan.|Ik ben opgestaan om zeven uur.","n":"opstaan krijgt zijn.","id":"wt4-74ea4891"}]}]},{"id":"wt5","title":"Vertalen 5: vergelijken, niet/geen en voornaamwoorden","rule":"- **Vergelijken**: groot, **groter** dan; de **grootste**. Onregelmatig: goed, **beter**, de **beste**. Veel: meer, de meeste.\n- **net zo ... als / even ... als** = as ... as: Zij is net zo groot **als** haar broer.\n- **geen** bij een zelfstandig naamwoord met **een** of zonder lidwoord: Ik heb **geen** tijd. Ik eet **geen** vlees.\n- **niet** bij werkwoorden, bijvoeglijke naamwoorden en bij **de/het/mijn**: Ik werk **niet**. Het is **niet** goed. Dit is **niet** mijn jas.\n- Onderwerp: ik, je/jij, hij, zij/ze, het, we/wij, jullie, zij/ze, u.\n- Voorwerp: **me/mij, je/jou, hem, haar, het, ons, jullie, hen/ze, u**.\n- Bezit: mijn, jouw/je, zijn, haar, ons/onze, jullie, hun, uw.","group":"Schrijven","sets":[{"instr":"Vertaal: vergelijkingen.","hint":"-er, dan; de -ste","items":[{"t":"tr","p":"The house is bigger.","a":"Het huis is groter.","n":"","id":"wt5-d854fcbb"},{"t":"tr","p":"My bike is older than your bike. (informal)","a":"Mijn fiets is ouder dan jouw fiets.|Mijn fiets is ouder dan je fiets.","n":"","id":"wt5-e5f8ff67"},{"t":"tr","p":"This is the cheapest shop.","a":"Dit is de goedkoopste winkel.","n":"","id":"wt5-5b82cbc8"},{"t":"tr","p":"She is as tall as her brother.","a":"Ze is net zo groot als haar broer.|Ze is net zo lang als haar broer.|Ze is even groot als haar broer.|Ze is even lang als haar broer.|Zij is net zo groot als haar broer.|Zij is net zo lang als haar broer.|Zij is even groot als haar broer.|Zij is even lang als haar broer.","n":"","id":"wt5-7af88762"},{"t":"tr","p":"Tea is healthier than coffee.","a":"Thee is gezonder dan koffie.","n":"","id":"wt5-1c1210a7"},{"t":"tr","p":"Amsterdam is more expensive than Utrecht.","a":"Amsterdam is duurder dan Utrecht.","n":"","id":"wt5-84d8d5d3"},{"t":"tr","p":"It is better today.","a":"Het is vandaag beter.|Vandaag is het beter.","n":"","id":"wt5-0253b5d1"},{"t":"tr","p":"He is the tallest.","a":"Hij is de langste.|Hij is de grootste.","n":"","id":"wt5-666933a6"}]},{"instr":"Vertaal: ontkenning met niet.","hint":"niet staat meestal achter het werkwoord of voor het bijvoeglijk naamwoord","items":[{"t":"tr","p":"I do not work today.","a":"Ik werk vandaag niet.|Vandaag werk ik niet.","n":"","id":"wt5-73c42ceb"},{"t":"tr","p":"She is not at home.","a":"Ze is niet thuis.|Zij is niet thuis.","n":"","id":"wt5-30e5afed"},{"t":"tr","p":"I do not understand.","a":"Ik begrijp het niet.|Ik begrijp dat niet.|Ik snap het niet.|Ik snap dat niet.","n":"","id":"wt5-ba3dfa82"},{"t":"tr","p":"He is not coming tomorrow.","a":"Hij komt morgen niet.|Morgen komt hij niet.","n":"","id":"wt5-943e9936"},{"t":"tr","p":"The shop is not open.","a":"De winkel is niet open.","n":"","id":"wt5-f2000ab8"},{"t":"tr","p":"I do not think this is nice.","a":"Ik vind dit niet leuk.|Ik denk niet dat dit leuk is.","n":"","id":"wt5-0865ebc2"},{"t":"tr","p":"This is not my coat.","a":"Dit is niet mijn jas.|Dit is mijn jas niet.","n":"","id":"wt5-3fd4c315"},{"t":"tr","p":"He does not live here.","a":"Hij woont hier niet.","n":"","id":"wt5-0893656c"}]},{"instr":"Vertaal: ontkenning met geen.","hint":"geen = niet een / niet zonder lidwoord","items":[{"t":"tr","p":"I have no time.","a":"Ik heb geen tijd.","n":"","id":"wt5-6a722823"},{"t":"tr","p":"He has no car.","a":"Hij heeft geen auto.","n":"","id":"wt5-28285f5d"},{"t":"tr","p":"We have no children.","a":"We hebben geen kinderen.|Wij hebben geen kinderen.","n":"","id":"wt5-57d239a0"},{"t":"tr","p":"There is no milk.","a":"Er is geen melk.","n":"","id":"wt5-cef50578"},{"t":"tr","p":"I eat no meat.","a":"Ik eet geen vlees.","n":"","id":"wt5-54f2dc39"},{"t":"tr","p":"She has no brother.","a":"Ze heeft geen broer.|Zij heeft geen broer.","n":"","id":"wt5-09935e17"},{"t":"tr","p":"I have no questions.","a":"Ik heb geen vragen.","n":"","id":"wt5-d590c82e"},{"t":"tr","p":"There are no tickets.","a":"Er zijn geen kaartjes.|Er zijn geen kaarten.|Er zijn geen tickets.|Er zijn geen toegangskaarten.","n":"","id":"wt5-31fa5183"}]},{"instr":"Vertaal: voornaamwoorden.","hint":"Onderwerp, voorwerp, bezit.","items":[{"t":"tr","p":"Do you know him? (informal)","a":"Ken je hem?|Ken jij hem?","n":"","id":"wt5-ca26b16e"},{"t":"tr","p":"I see her.","a":"Ik zie haar.","n":"","id":"wt5-a20f7e2c"},{"t":"tr","p":"He helps us.","a":"Hij helpt ons.","n":"","id":"wt5-44943698"},{"t":"tr","p":"She gives me the book.","a":"Ze geeft me het boek.|Ze geeft mij het boek.|Zij geeft me het boek.|Zij geeft mij het boek.|Ze geeft het boek aan mij.|Zij geeft het boek aan mij.","n":"","id":"wt5-a90537ef"},{"t":"tr","p":"This is their house.","a":"Dit is hun huis.","n":"","id":"wt5-60b0f722"},{"t":"tr","p":"That is our car.","a":"Dat is onze auto.","n":"","id":"wt5-55df8425"},{"t":"tr","p":"Is this your bag? (informal)","a":"Is dit jouw tas?|Is dit je tas?","n":"","id":"wt5-993962ac"},{"t":"tr","p":"I love you. (informal)","a":"Ik hou van je.|Ik hou van jou.|Ik houd van je.|Ik houd van jou.","n":"","id":"wt5-a872 nee kwijtgeraakt.","n":"","id":"wt7-71790b5a"}]},{"instr":"Vind de fout en schrijf de zin goed.","hint":"","items":[{"t":"fix","p":"Ik heb hoofd pijn.","a":"Ik heb hoofdpijn.","n":"hoofdpijn is een woord.","id":"wt7-1317e5ca"},{"t":"fix","p":"Mijn buik is pijn.","a":"Mijn buik doet pijn.","n":"pijn doen.","id":"wt7-35f17bca"},{"t":"fix","p":"Ik heb een afspraak op tien uur.","a":"Ik heb een afspraak om tien uur.","n":"Bij een tijd: om.","id":"wt7-0e81cb51"}]}]},{"id":"wt8","title":"Vertalen 8: A2-herhaling (te, omdat/want, voorzetsels)","rule":"- **om ... te + infinitief**: Ik ga naar de winkel **om** brood **te kopen**. Het is leuk **om te koken**.\n- **te + infinitief** zonder om: Ik probeer **te leren**. Zij begint **te werken**. Hij vergeet **te bellen**.\n- **omdat** + bijzin (werkwoord achteraan): Ik blijf thuis, **omdat ik ziek ben**.\n- **want** + gewone volgorde: Ik blijf thuis, **want ik ben ziek**.\n- Vaste voorzetsels: wachten **op**, praten **over**, bang **voor**, denken **aan**, kijken **naar**, goed **in**, geïnteresseerd **in**.\n- Plaats: **in, op, onder, boven, naast, achter, voor, tussen, door**. Zoeken kan zonder voorzetsel: Ik **zoek** mijn sleutels.","group":"Schrijven","sets":[{"instr":"Vertaal: te en om ... te.","hint":"","items":[{"t":"tr","p":"I go to the shop to buy bread.","a":"Ik ga naar de winkel om brood te kopen.","n":"","id":"wt8-caa3baee"},{"t":"tr","p":"It is nice to cook.","a":"Het is leuk om te koken.|Koken is leuk.","n":"","id":"wt8-d2e4e957"},{"t":"tr","p":"I try to learn Dutch every day.","a":"Ik probeer elke dag Nederlands te leren.|Ik probeer iedere dag Nederlands te leren.|Elke dag probeer ik Nederlands te leren.|Iedere dag probeer ik Nederlands te leren.","n":"","id":"wt8-958f9604"},{"t":"tr","p":"She begins to work.","a":"Ze begint te werken.|Zij begint te werken.","n":"","id":"wt8-8534c328"},{"t":"tr","p":"I have no time to read.","a":"Ik heb geen tijd om te lezen.","n":"","id":"wt8-5e39cde3"},{"t":"tr","p":"He forgets to cook.","a":"Hij vergeet te koken.","n":"","id":"wt8-e50d7b95"},{"t":"tr","p":"We use a map to find the way.","a":"We gebruiken een kaart om de weg te vinden.|Wij gebruiken een kaart om de weg te vinden.","n":"","id":"wt8-6fa984ad"},{"t":"tr","p":"It is difficult to understand him.","a":"Het is moeilijk om hem te begrijpen.|Het is moeilijk  hem te begrijpen.|Hem te begrijpen is moeilijk.|Hem begrijpen is moeilijk.","n":"","id":"wt8-c18db74d"}]},{"instr":"Vertaal: omdat en want.","hint":"omdat: werkwoord achteraan. want: gewone volgorde.","items":[{"t":"tr","p":"I stay at home because I am ill.","a":"Ik blijf thuis, omdat ik ziek ben.|Ik blijf thuis omdat ik ziek ben.|Omdat ik ziek ben, blijf ik thuis.|Omdat ik ziek ben blijf ik thuis.|Ik blijf thuis, want ik ben ziek.","n":"","id":"wt8-c1012b10"},{"t":"tr","p":"She is tired because she works a lot.","a":"Ze is moe, omdat ze veel werkt.|Ze is moe, omdat zij veel werkt.|Ze is moe omdat ze veel werkt.|Ze is moe omdat zij veel werkt.|Zij is moe, omdat ze veel werkt.|Zij is moe, omdat zij veel werkt.|Zij is moe omdat ze veel werkt.|Zij is moe omdat zij veel werkt.|Omdat ze veel werkt, is ze moe.|Omdat ze veel werkt, is zij moe.|Omdat ze veel werkt is ze moe.|Omdat ze veel werkt is zij moe.|Omdat zij veel werkt, is ze moe.|Omdat zij veel werkt, is zij moe.|Omdat zij veel werkt is ze moe.|Omdat zij veel werkt is zij moe.|Ze is moe, want ze werkt veel.|Ze is moe, want zij werkt veel.|Zij is moe, want ze werkt veel.|Zij is moe, want zij werkt veel.","n":"","id":"wt8-8881b8e6"},{"t":"tr","p":"Because it is raining, we stay inside.","a":"Omdat het regent, blijven we binnen.|Omdat het regent, blijven wij binnen.|Omdat het regent blijven we binnen.|Omdat het regent blijven wij binnen.|We blijven binnen, omdat het regent.|We blijven binnen omdat het regent.|Wij blijven binnen, omdat het regent.|Wij blijven binnen omdat het regent.|We blijven binnen, want het regent.|Wij blijven binnen, want het regent.","n":"","id":"wt8-263767a9"},{"t":"tr","p":"He is not coming because he has no time.","a":"Hij komt niet, omdat hij geen tijd heeft.|Hij komt niet omdat hij geen tijd heeft.|Omdat hij geen tijd heeft, komt hij niet.|Omdat hij geen tijd heeft komt hij niet.|Hij komt niet, want hij heeft geen tijd.","n":"","id":"wt8-5e05f661"},{"t":"tr","p":"I learn Dutch because I live here.","a":"Ik leer Nederlands omdat ik hier woon.|Ik leer Nederlands, want ik woon hier.","n":"","id":"wt8-4815edc4"},{"t":"tr","p":"I am not going out because I have to work.","a":"Ik ga niet uit omdat ik moet werken.|Ik ga niet uit, want ik moet werken.","n":"","id":"wt8-2ee12ca0"},{"t":"tr","p":"Why are you cooking? Because I am hungry. (informal)","a":"Waarom kook je? Omdat ik honger heb.|Waarom kook jij? Omdat ik honger heb.","n":"","id":"wt8-a43c0f48"},{"t":"tr","p":"They are happy because they have a holiday.","a":"Ze zijn blij omdat ze vakantie hebben.|Ze zijn blij omdat zij vakantie hebben.|Zij zijn blij omdat ze vakantie hebben.|Zij zijn blij omdat zij vakantie hebben.|Ze zijn blij, want ze hebben vakantie.|Ze zijn blij, want zij hebben vakantie.|Zij zijn blij, want ze hebben vakantie.|Zij zijn blij, want zij hebben vakantie.","n":"","id":"wt8-7fb0995b"}]},{"instr":"Vertaal: vaste voorzetsels.","hint":"wachten op, praten over, bang voor, denken aan, kijken naar, goed in","items":[{"t":"tr","p":"I am waiting for the bus.","a":"Ik wacht op de bus.","n":"","id":"wt8-8ae7f6d4"},{"t":"tr","p":"She is talking about her work.","a":"Ze praat over haar werk.|Zij praat over haar werk.","n":"","id":"wt8-2e0b4776"},{"t":"tr","p":"He is afraid of dogs.","a":"Hij is bang voor honden.","n":"","id":"wt8-16f46a20"},{"t":"tr","p":"I am thinking of you. (informal)","a":"Ik denk aan je.|Ik denk aan jou.","n":"","id":"wt8-c5dd15a0"},{"t":"tr","p":"We are looking at the photos.","a":"We kijken naar de foto's.|Wij kijken naar de foto's.","n":"","id":"wt8-42cb4cd7"},{"t":"tr","p":"She is good at cooking.","a":"Ze is goed in koken.|Zij is goed in koken.|Ze kan goed koken.|Zij kan goed koken.","n":"","id":"wt8-eb202eae"},{"t":"tr","p":"I am looking for my keys.","a":"Ik zoek mijn sleutels.","n":"","id":"wt8-2f1af4dd"},{"t":"tr","p":"I am interested in art.","a":"Ik ben geïnteresseerd in kunst.|Ik heb interesse in kunst.","n":"","id":"wt8-6a2f64bb"}]},{"instr":"Vertaal: voorzetsels van plaats.","hint":"in, op, onder, boven, naast, achter, door, van, naar","items":[{"t":"tr","p":"The cat is under the table.","a":"De kat zit onder de tafel.|De kat ligt onder de tafel.|De kat is onder de tafel.","n":"","id":"wt8-72657592"},{"t":"tr","p":"The painting hangs above the sofa.","a":"Het schilderij hangt boven de bank.|Het schilderij hangt boven de sofa.","n":"","id":"wt8-62ee2b16"},{"t":"tr","p":"The pharmacy is next to the supermarket.","a":"De apotheek is naast de supermarkt.|De apotheek ligt naast de supermarkt.","n":"","id":"wt8-149a80c9"},{"t":"tr","p":"The school is behind the church.","a":"De school is achter de kerk.|De school staat achter de kerk.|De school ligt achter de kerk.","n":"","id":"wt8-32430e25"},{"t":"tr","p":"I walk through the park.","a":"Ik loop door het park.|Ik wandel door het park.","n":"","id":"wt8-97f976ce"},{"t":"tr","p":"She comes from work.","a":"Ze komt van haar werk.|Ze komt van het werk.|Zij komt van haar werk.|Zij komt van het werk.","n":"","id":"wt8-c80ed13a"},{"t":"tr","p":"I go to my grandmother.","a":"Ik ga naar mijn oma.|Ik ga naar mijn grootmoeder.","n":"","id":"wt8-b8b71234"},{"t":"tr","p":"The book is in my bag.","a":"Het boek zit in mijn tas.|Het boek is in mijn tas.|Het boek ligt in mijn tas.","n":"","id":"wt8-19c43515"}]},{"instr":"Vertaal: gemengde A2-zinnen.","hint":"","items":[{"t":"tr","p":"Do you know when the train leaves? (informal)","a":"Weet je wanneer de trein vertrekt?|Weet jij wanneer de trein vertrekt?","n":"","id":"wt8-f7c1ec7e"},{"t":"tr","p":"I have not been to the doctor because I have no time.","a":"Ik ben niet naar de dokter geweest, omdat ik geen tijd heb.|Ik ben niet naar de dokter geweest omdat ik geen tijd heb.|Ik ben niet naar de dokter gegaan, omdat ik geen tijd heb.|Ik ben niet naar de dokter gegaan omdat ik geen tijd heb.|Ik ben niet naar de huisarts geweest, omdat ik geen tijd heb.|Ik ben niet naar de huisarts geweest omdat ik geen tijd heb.|Ik ben niet naar de huisarts gegaan, omdat ik geen tijd heb.|Ik ben niet naar de huisarts gegaan omdat ik geen tijd heb.|Ik ben niet naar de dokter geweest, want ik heb geen tijd.|Ik ben niet naar de dokter gegaan, want ik heb geen tijd.|Ik ben niet naar de huisarts geweest, want ik heb geen tijd.|Ik ben niet naar de huisarts gegaan, want ik heb geen tijd.|Omdat ik geen tijd heb, ben ik niet naar de dokter geweest.|Omdat ik geen tijd heb, ben ik niet naar de dokter gegaan.|Omdat ik geen tijd heb, ben ik niet naar de huisarts geweest.|Omdat ik geen tijd heb, ben ik niet naar de huisarts gegaan.|Omdat ik geen tijd heb ben ik niet naar de dokter geweest.|Omdat ik geen tijd heb ben ik niet naar de dokter gegaan.|Omdat ik geen tijd heb ben ik niet naar de huisarts geweest.|Omdat ik geen tijd heb ben ik niet naar de huisarts gegaan.","n":"","id":"wt8-ae241547"},{"t":"tr","p":"Yesterday I went to the market to buy fruit.","a":"Gisteren ben ik naar de markt gegaan om fruit te kopen.|Ik ben gisteren naar de markt gegaan om fruit te kopen.","n":"","id":"wt8-e6044d24"},{"t":"tr","p":"I am learning Dutch because I want to work here.","a":"Ik leer Nederlands, omdat ik hier wil werken.|Ik leer Nederlands omdat ik hier wil werken.|Omdat ik hier wil werken, leer ik Nederlands.|Omdat ik hier wil werken leer ik Nederlands.|Ik leer Nederlands, want ik wil hier werken.","n":"","id":"wt8-4821de1d"},{"t":"tr","p":"It is important to sleep enough.","a":"Het is belangrijk om genoeg te slapen.|Het is belangrijk om voldoende te slapen.|Het is belangrijk  genoeg te slapen.|Het is belangrijk  voldoende te slapen.","n":"","id":"wt8-9e7bafdf"},{"t":"tr","p":"We have to go because the shop closes at six.","a":"We moeten gaan omdat de winkel om zes uur sluit.|We moeten gaan omdat de winkel om zes uur dichtgaat.|We moeten gaan omdat de winkel om zes uur gaat dicht.|Wij moeten gaan omdat de winkel om zes uur sluit.|Wij moeten gaan omdat de winkel om zes uur dichtgaat.|Wij moeten gaan omdat de winkel om zes uur gaat dicht.|We moeten gaan, want de winkel sluit om zes uur.|Wij moeten gaan, want de winkel sluit om zes uur.","n":"","id":"wt8-a6870249"},{"t":"tr","p":"She has a lot of friends in the city.","a":"Ze heeft veel vrienden in de stad.|Zij heeft veel vrienden in de stad.","n":"","id":"wt8-9676fd79"},{"t":"tr","p":"After work I go to the gym.","a":"Na mijn werk ga ik naar de sportschool.|Na mijn werk ga ik naar de gym.|Na het werk ga ik naar de sportschool.|Na het werk ga ik naar de gym.|Ik ga na mijn werk naar de sportschool.|Ik ga na mijn werk naar de gym.|Ik ga na het werk naar de sportschool.|Ik ga na het werk naar de gym.","n":"","id":"wt8-31ccf521"}]},{"instr":"Vind de fout en schrijf de zin goed.","hint":"","items":[{"t":"fix","p":"Ik ga naar de winkel om kopen brood.","a":"Ik ga naar de winkel om brood te kopen.","n":"om ... te + infinitief.","id":"wt8-f0f92d85"},{"t":"fix","p":"Ik blijf thuis omdat ik ben ziek.","a":"Ik blijf thuis omdat ik ziek ben.","n":"Na omdat: werkwoord achteraan.","id":"wt8-08a25b6a"},{"t":"fix","p":"Ik wacht voor de bus.","a":"Ik wacht op de bus.","n":"wachten op.","id":"wt8-d8d9e288"},{"t":"fix","p":"Hij is bang van honden.","a":"Hij is bang voor honden.","n":"bang voor.","id":"wt8-db86d522"}]}]},{"id":"wf1","title":"Schrijven 1: jezelf voorstellen, familie, huis","rule":"Schrijf in hele zinnen. Let op: het werkwoord staat op plaats 2 (**Ik woon in Utrecht.**) en na een ander beginwoord komt het werkwoord eerst (**In Utrecht woon ik.**).\nGebruik **mijn/jouw/zijn/haar** bij familie: **mijn moeder**, **haar broer**. Bij huis: **Ik woon in een flat / een huis / een appartement.**","group":"Schrijven","sets":[{"instr":"Sc
